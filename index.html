        if (run.kb) parts.push('HTML ' + fmt(run.kb) + ' КБ');
        parts.push('начало ' + clock(run.minute));
        if (isNum(run.seconds)) parts.push('конец ~' + clock(run.minute + Math.round(run.seconds / 60)));
        return parts.join(' · ');
      }

      const PRICE_PERIODS = [
        ['1w', '1Н', 7],
        ['1m', '1М', 30],
        ['all', 'Всё', Infinity],
      ];
      const SELLING_SORTS = [
        ['chance', 'шанс'],
        ['cheap', 'дешёвые'],
        ['new', 'новые'],
      ];
      /**
       * Порог дешевле 500 ₽ — заглушка (1 ₽ у моделей на паузе, «Включить все»), а не цена куклы: как
       * MODEL_SEARCH_MIN_PRICE_RUB и «дешевле 500 ₽ — не цена куклы» в brief-facts.ts.
       */
      const MIN_PRICE_RUB = 500;

      /** Порог модели для графика и подписи; заглушка — 0 (порога нет). */
      function priceLimit(target) {
        return target.priceRub >= MIN_PRICE_RUB ? target.priceRub : 0;
      }

      /** Модели с ценой по дням: включённые первыми, внутри — как в данных (с находкой и поиском по модели выше). */
      function priceModels(p) {
        const enabled = (model) => (lightTarget(p, model.targetId).active ? 1 : 0);
        return [...p.models].sort((a, b) => enabled(b) - enabled(a));
      }

      /** Экран «Цена модели»: чипы моделей с фото, шапка, график медианы и минимума с порогом, продающиеся куклы. */
      function renderPrice(screen) {
        const p = state.profile;
        const view = $('detailView');
        view.textContent = '';
        view.append(el('h2', '', 'Цена модели'));
        const models = priceModels(p);
        if (models.length === 0) {
          view.append(el('div', 'muted', 'Нет данных'));
          return;
        }
        const chosen = models.find((model) => model.targetId === screen.targetId) || models[0];
        screen.targetId = chosen.targetId;
        const chips = el('div', 'chips');
        const body = el('div');
        view.append(chips, body);
        const page = priceView(body, p);
        for (const model of models) {
          const target = lightTarget(p, model.targetId);
          const chip = el('button', 'fchip');
          chip.type = 'button';
          chip.dataset.key = String(model.targetId);
          chip.append(thumb({ name: target.name, img: target.img }, 'chip-img'), el('span', '', target.name));
          chip.addEventListener('click', () => {
            if (screen.targetId === model.targetId) return;
            screen.targetId = model.targetId;
            haptic('select');
            pressed(chips, model.targetId);
            page.show(model, true);
          });
          chips.append(chip);
        }
        pressed(chips, chosen.targetId);
        page.show(chosen, false);
      }

      /** Шапка, график и список одной модели; смена модели и периода — морфингом графика. */
      function priceView(body, p) {
        const card = el('div', 'panel chart-card');
        const name = el('div', 'chart-label');
        const head = el('div', 'chart-head');
        const value = el('div', 'chart-value');
        const chip = el('span', 'chip');
        head.append(value, chip);
        const sub = el('div', 'chart-sub');
        const box = el('div');
        const switcher = el('div', 'periods');
        const note = el('div');
        card.append(name, head, sub, box, switcher, note);
        const list = el('div');
        body.append(card, list);
        let model = null;
        let target = null;
        let points = [];
        let allButton = null;
        const chart = lineChart(box, {
          tone: 'accent',
          emptyText: 'Мало данных',
          tip: (point) => ({ value: rub(point.y), label: dayLabel(point.x) }),
          summary: (shown) => priceSummary(target, shown),
          onScrub: (point) => showHead(point),
        });
        for (const [key, label] of PRICE_PERIODS) {
          const button = el('button', '', label);
          button.type = 'button';
          button.dataset.key = key;
          button.addEventListener('click', () => {
            if (state.pricePeriod === key) return;
            state.pricePeriod = key;
            haptic('select');
            draw(true);
          });
          if (key === 'all') allButton = button;
          switcher.append(button);
        }

        function draw(animate) {
          // В ссылку вошли только последние 30 дней модели — «Всё» повторило бы «1М»: кнопки нет, показ — за 30 дней
          const key = state.pricePeriod === 'all' && model.short ? '1m' : state.pricePeriod;
          const period = PRICE_PERIODS.find((item) => item[0] === key) || PRICE_PERIODS[1];
          pressed(switcher, period[0]);
          points = pricePoints(model, period[2]);
          const limit = priceLimit(target);
          chart.update(points, { animate, threshold: limit });
          showHead(null);
          // Легенда: медиана по отдельным куклам (без лотов), минимум, порог, мало данных (меньше 3 кукол), находки
          const items = [
            ['ln', 'медиана'],
            ['ln dash', 'минимум'],
          ];
          if (limit) items.push(['ln thr', 'порог']);
          if (points.some((point) => point.faint)) items.push(['pt faint', 'мало данных']);
          if (points.some((point) => point.mark)) items.push(['pt', 'находки']);
          note.replaceChildren(chartLegend(items));
        }

        function showHead(point) {
          const last = points.length ? points[points.length - 1] : null;
          const shown = point || last;
          value.textContent = shown ? rub(shown.y) : '—';
          const first = points.length > 1 ? points[0] : null;
          const change = first && shown && shown !== first ? ChartMath.changePercent(first.y, shown.y) : null;
          chip.hidden = change === null;
          if (change !== null) {
            const parts = priceChangeParts(change);
            chip.textContent = parts.text;
            chip.className = 'chip ' + parts.tone;
          }
          sub.textContent = point ? priceNote(point) : priceDefault(target, last);
        }

        return {
          show(next, animate) {
            model = next;
            target = lightTarget(p, next.targetId);
            const limit = priceLimit(target);
            let about = limit ? 'порог ' + rub(limit) : 'порог не задан';
            if (!limit && !target.active) about = 'на паузе';
            name.textContent = RunText.plain(target.name) + ' · ' + about;
            if (allButton) allButton.hidden = model.short;
            draw(animate);
            fillSelling(list, p, model, target);
          },
        };
      }

      /** Протяжка: «пн, 5 окт. · медиана 7 400 · мин 5 900 · 12 объявл. · 1 находка». */
      function priceNote(point) {
        const parts = [dayLabel(point.x), 'медиана ' + fmt(point.y)];
        if (isNum(point.low)) parts.push('мин ' + fmt(point.low));
        parts.push(countText(point.count, 'кукла', 'куклы', 'кукол'));
        if (point.finds > 0) parts.push(countText(point.finds, 'находка', 'находки', 'находок'));
        if (point.faint) parts.push('мало данных');
        return parts.join(' · ');
      }

      /** Под ценой: «медиана · 12 в продаже · от 5 900 ₽». */
      function priceDefault(target, last) {
        const parts = ['медиана', fmt(target.selling) + ' в продаже'];
        if (last && isNum(last.low)) parts.push('от ' + rub(last.low));
        return parts.join(' · ');
      }

      function priceSummary(target, points) {
        if (!target || points.length === 0) return 'График цены: данных нет';
        const last = points[points.length - 1];
        return 'Медиана цены ' + target.name + ' по дням: последняя ' + rub(last.y) + ', точек ' + points.length;
      }

      /** «В продаже (N)»: живые находки модели и самые дешёвые её куклы; сортировка «шанс / дешёвые / новые». */
      function fillSelling(list, p, model, target) {
        list.textContent = '';
        const items = sellingItems(model);
        const total = Math.max(target.selling, items.length);
        list.append(el('div', 'section-title', 'В продаже (' + fmt(total) + ')'));
        if (items.length === 0) {
          list.append(el('div', 'muted', model.selling === null ? 'Не вошло в ссылку' : 'Нет'));
          return;
        }
        const sorts = el('div', 'chips');
        const rows = el('div');
        list.append(sorts, dotLegend(), rows);
        const median = lastMedian(model);
        const threshold = priceLimit(target);
        const fill = () => {
          rows.textContent = '';
          for (const item of sortSelling(items, threshold)) rows.append(sellingRow(item, median, threshold));
          pressed(sorts, state.sellingSort);
        };
        for (const [key, label] of SELLING_SORTS) {
          const button = el('button', 'fchip', label);
          button.type = 'button';
          button.dataset.key = key;
          button.addEventListener('click', () => {
            state.sellingSort = key;
            haptic('select');
            fill();
          });
          sorts.append(button);
        }
        fill();
        if (total > items.length) list.append(el('div', 'muted', 'Показано ' + items.length + ' из ' + fmt(total)));
      }

      /** Живые находки модели и самые дешёвые её куклы (m), без повторов и снятых. */
      function sellingItems(model) {
        const ids = [];
        for (const find of liveFinds()) {
          if (find.targetId === model.targetId && !ids.includes(find.listingId)) ids.push(find.listingId);
        }
        for (const id of model.selling || []) {
          if (!ids.includes(id)) ids.push(id);
        }
        const items = [];
        for (const id of ids) {
          const item = profileItem(id, model.targetId);
          if (item && !item.removed) items.push(item);
        }
        return items;
      }

      /** Живые находки первыми, дальше — по «шансу» (К5: горячие, обычные, жёлтые; затем дешевле), дешёвые, новые. */
      function sortSelling(items, thresholdRub) {
        const price = (item) => unitPrice(item) ?? Infinity;
        const fresh = (item) => item.firstSeen || 0;
        const ranked = items.map((item) => ({
          item,
          level: listingLevel(item, thresholdRub),
          deal: item.deal,
          unitRub: unitPrice(item),
        }));
        const order = (a, b) => {
          if (state.sellingSort === 'new') return fresh(b.item) - fresh(a.item);
          if (state.sellingSort === 'cheap') return price(a.item) - price(b.item) || 0;
          return DealView.compare(a, b);
        };
        ranked.sort((a, b) => Number(b.item.live) - Number(a.item.live) || order(a, b));
        return ranked.map((entry) => entry.item);
      }

      function lastMedian(model) {
        for (let index = model.counts.length - 1; index >= 0; index--) {
          if (model.counts[index] > 0) return model.median[index];
        }
        return null;
      }

      /** Строка «В продаже»: цвет и «шанс» (К5); нажатие — страница объявления, «Avito» — сразу на Avito. */
      function sellingRow(listing, median, thresholdRub) {
        const row = el('div', 'srow');
        const level = listingLevel(listing, thresholdRub);
        if (!listing.live && levelClass(level)) row.classList.add(level);
        const main = el('button', 'srow-main');
        main.type = 'button';
        const image = { name: listing.title || '?', img: listing.img };
        main.append(listing.live ? liveThumb(image) : thumb(image, 'thumb'));
        const info = el('span', 'info');
        info.append(el('span', 'title', listing.title), el('span', 'sub', sellingNote(listing, median)));
        const tags = dealTags(listing.deal, level, isFresh(listing));
        if (tags) info.append(tags);
        const okc = listing.within && !level ? ' okc' : '';
        main.append(info, el('span', 'cost' + okc, priceText(listing)));
        const screen = { type: 'listing', id: listing.id, targetId: listing.targetId };
        main.addEventListener('click', () => openScreen(screen));
        const avito = el('button', 'small avito', 'Avito');
        avito.append(icon('external'));
        avito.type = 'button';
        avito.setAttribute('aria-label', 'Открыть на Avito: ' + listing.title);
        avito.addEventListener('click', () => openLink(listing.url));
        row.append(main, avito);
        return row;
      }

      /** «−12 % к медиане · лот ×3 · видели 2 ч назад · слежу». */
      function sellingNote(listing, median) {
        const parts = [];
        const unit = unitPrice(listing);
        const diff = unit === null || !median ? null : ChartMath.changePercent(median, unit);
        if (diff) parts.push(signed(diff) + ' % к медиане');
        // С признаками (DealRow) лот — в их чипах
        const lot = !listing.deal && listing.verdict && listing.verdict.type === 1;
        if (lot) parts.push('лот ×' + listing.verdict.quantity);
        if (listing.lastSeen) parts.push('видели ' + ago(listing.lastSeen));
        if (listing.watched) parts.push('слежу');
        return parts.join(' · ');
      }

      /** Объявление профиля (обход, цена модели, находка): страница объявления, итог отбора и разметка. */
      function renderProfileListing(listing) {
        renderItemView(listing, listingContext(listing.targetId));
        const panel = el('div', 'panel');
        panel.append(el('div', 'group-title', 'Отбор'));
        panel.append(el('div', 'verdict ' + outcomeClass(listing.outcome), selectionText(listing, 0)));
        const chips = verdictChips(listing);
        if (chips) panel.append(chips);
        const view = $('detailView');
        view.insertBefore(panel, view.querySelector('.actions'));
      }

      /** Порог модели: из ссылки «Цели» (с правками) или из профиля; модели нет — 0. */
      function thresholdOf(targetId) {
        const context = listingContext(targetId);
        return context ? Number(context.threshold) || 0 : 0;
      }

      /** Цель объявления для страницы: из ссылки «Цели» (с правками) или из профиля; нет — null. */
      function listingContext(targetId) {
        const target = targetId ? findTarget(targetId) : null;
        if (target) return { name: target.name, threshold: current(target).priceRub, targetId };
        const light = targetId ? profileTarget(targetId) : null;
        return light ? { name: light.name, threshold: light.priceRub, targetId } : null;
      }

      const SVG_NS = 'http://www.w3.org/2000/svg';
      /** Графики на экране: render() их снимает (наблюдатель размера, анимация). */
      const charts = new Set();
      let chartCount = 0;

      function svgEl(tag, className) {
        const node = document.createElementNS(SVG_NS, tag);
        if (className) node.setAttribute('class', className);
        return node;
      }

      function setAttrs(node, attrs) {
        for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, String(value));
      }

      function destroyCharts() {
        for (const chart of charts) chart.destroy();
        charts.clear();
      }

      function reducedMotion() {
        return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }

      /** Вертикальные свайпы Telegram (Bot API 7.7+): на время протяжки выключены, чтобы окно не сворачивалось. */
      function verticalSwipes(on) {
        try {
          if (!tg.isVersionAtLeast('7.7')) return;
          if (on) tg.enableVerticalSwipes();
          else tg.disableVerticalSwipes();
        } catch {
          // клиент без этих вызовов
        }
      }

      /**
       * График «как в Telegram Wallet» (TZ.md, шаг 5) — свой SVG без библиотек: линия с градиентом под ней, пунктиры
       * второго ряда и минимума, порог, красные отметки находок, подписи минимума и максимума; протяжка пальцем, мышью
       * и стрелками ←/→ (Esc — убрать). options: { points, height, tone, floorZero, threshold, format, tip(точка) →
       * { value, label }, summary(точки), emptyText, onScrub(точка | null) }; точка — { x, y, y2?, low?, mark?,
       * faint? } по возрастанию x. Возвращает { update(точки, { animate, tone, threshold }), destroy() }.
       */
      function lineChart(box, options) {
        chartCount += 1;
        const fillId = 'chart-fill-' + chartCount;
        const height = options.height || 180;
        const format = options.format || fmt;
        const root = el('div', 'chart tone-' + (options.tone || 'accent'));
        root.style.height = height + 'px';
        const surface = svgEl('svg');
        setAttrs(surface, { height, role: 'img', tabindex: 0 });
        const defs = svgEl('defs');
        const gradient = svgEl('linearGradient');
        setAttrs(gradient, { id: fillId, x1: 0, y1: 0, x2: 0, y2: 1 });
        const stopTop = svgEl('stop', 'g0');
        stopTop.setAttribute('offset', '0');
        const stopBottom = svgEl('stop', 'g1');
        stopBottom.setAttribute('offset', '1');
        gradient.append(stopTop, stopBottom);
        defs.append(gradient);
        const area = svgEl('path', 'area');
        area.setAttribute('fill', 'url(#' + fillId + ')');
        // Пунктиры второго ряда и минимума, порог — под главной линией; при морфинге и прорисовке — как отметки
        const overlay = svgEl('g', 'overlay');
        const second = svgEl('path', 'line2');
        const low = svgEl('path', 'line-low');
        const limit = svgEl('line', 'thr');
        const limitLabel = svgEl('text', 'lab');
        overlay.append(second, low, limit, limitLabel);
        const line = svgEl('path', 'line');
        const extras = svgEl('g', 'extras');
        const cross = svgEl('line', 'cross');
        const dot = svgEl('circle', 'dot');
        dot.setAttribute('r', '4.5');
        surface.append(defs, area, overlay, line, extras, cross, dot);
        const tip = el('div', 'chart-tip');
        const empty = el('div', 'chart-empty');
        root.append(surface, tip, empty);
        box.append(root);
        let source = [];
        let points = [];
        let screen = [];
        let xs = [];
        let width = 0;
        let active = -1;
        let dragging = false;
        let drawn = false;
        let frame = 0;
        let drawing = null;
        hide();

        /** Масштаб: значения (и порог, если он не дальше 1,5 размаха) — на высоту, x — на ширину. */
        function layout(list) {
          width = root.clientWidth || box.clientWidth || 320;
          const values = [];
          for (const point of list) values.push(point.y, point.y2, point.low);
          let [lo, hi] = ChartMath.extent(values);
          if (options.floorZero) lo = 0;
          const span = hi - lo || Math.abs(hi) || 1;
          const threshold = options.threshold;
          let edge = '';
          if (threshold > 0 && list.length > 0) {
            if (threshold < lo - 1.5 * span) edge = 'below';
            else if (threshold > hi + 1.5 * span) edge = 'above';
            else {
              lo = Math.min(lo, threshold);
              hi = Math.max(hi, threshold);
            }
          }
          if (hi === lo) {
            hi = lo + 1;
            if (!options.floorZero) lo -= 1;
          }
          if (!options.floorZero) {
            const pad = (hi - lo) * 0.08;
            lo -= pad;
            hi += pad;
          }
          const top = 22;
          const bottom = height - 20;
          const first = list.length ? list[0].x : 0;
          const last = list.length ? list[list.length - 1].x : 1;
          const sx = (x) => (last === first ? width / 2 : 6 + ((x - first) / (last - first)) * (width - 12));
          const sy = (y) => top + ((hi - y) / (hi - lo)) * (bottom - top);
          return { sx, sy, edge };
        }

        /** Нарисовать: mode — 'first' (прорисовка), 'morph' (смена периода или модели) или 'none'. */
        function draw(input, mode) {
          cancelAnimationFrame(frame);
          if (drawing) drawing.cancel();
          drawing = null;
          line.style.strokeDasharray = '';
          fade(false);
          const geo = layout(input);
          const list = ChartMath.thin(input, Math.max(24, Math.floor(width / 3)));
          const previous = screen;
          points = list;
          screen = list.map((point) => ({ x: geo.sx(point.x), y: geo.sy(point.y) }));
          xs = screen.map((point) => point.x);
          surface.setAttribute('aria-label', options.summary ? options.summary(list) : 'График');
          empty.hidden = list.length >= 2;
          empty.textContent = options.emptyText || 'Мало данных';
          drawExtras(list, geo);
          if (list.length < 2) {
            line.setAttribute('d', '');
            area.setAttribute('d', '');
            return;
          }
          const still = reducedMotion();
          if (mode === 'morph' && previous.length >= 2 && !still) return morph(previous, screen);
          setMain(screen);
          if (mode === 'first' && !still) drawIn();
        }

        function setMain(list) {
          const path = ChartMath.monotonePath(list);
          const first = list[0];
          const last = list[list.length - 1];
          line.setAttribute('d', path);
          area.setAttribute('d', path + 'L' + px(last.x) + ',' + height + 'L' + px(first.x) + ',' + height + 'Z');
        }

        /** Координаты ряда key (y2 — второй ряд, low — минимум) у точек, где он есть. */
        function project(list, key, geo) {
          const out = [];
          for (const point of list) {
            if (isNum(point[key])) out.push({ x: geo.sx(point.x), y: geo.sy(point[key]) });
          }
          return out;
        }

        function circle(className, x, y, radius) {
          const node = svgEl('circle', className);
          setAttrs(node, { cx: px(x), cy: px(y), r: radius });
          return node;
        }

        /** Второй ряд, минимум, порог, отметки находок, бледные точки, подписи минимума и максимума. */
        function drawExtras(list, geo) {
          const pathOf = (key) => {
            const projected = project(list, key, geo);
            return projected.length >= 2 ? ChartMath.monotonePath(projected) : '';
          };
          second.setAttribute('d', pathOf('y2'));
          low.setAttribute('d', pathOf('low'));
          drawLimit(geo, list.length > 0);
          extras.textContent = '';
          for (const point of list) {
            const x = geo.sx(point.x);
            const y = geo.sy(point.y);
            if (list.length < 2) extras.append(circle('solo', x, y, 4));
            if (point.faint) extras.append(circle('faint', x, y, 2.5));
            if (point.mark) extras.append(circle('mark', x, y, 3.5));
          }
          if (list.length >= 2) drawLabels(list, geo);
        }

        /** Подписи максимума и минимума — 11 px у своих точек. */
        function drawLabels(list, geo) {
          let top = 0;
          let bottom = 0;
          list.forEach((point, index) => {
            if (point.y > list[top].y) top = index;
            if (point.y < list[bottom].y) bottom = index;
          });
          extras.append(label(list[top], geo, -9));
          if (list[bottom].y !== list[top].y) extras.append(label(list[bottom], geo, 16));
        }

        function label(point, geo, shift) {
          const x = geo.sx(point.x);
          const y = Math.max(11, Math.min(height - 4, geo.sy(point.y) + shift));
          const anchor = x < 40 ? 'start' : x > width - 40 ? 'end' : 'middle';
          const text = svgEl('text', 'lab');
          setAttrs(text, { x: px(x), y: px(y), 'text-anchor': anchor });
          text.textContent = format(point.y);
          return text;
        }

        /** Порог: штриховая линия с подписью; дальше 1,5 размаха цен — подпись у края («порог 3 000 ниже»). */
        function drawLimit(geo, any) {
          const threshold = options.threshold;
          limit.style.display = 'none';
          limitLabel.textContent = '';
          if (!(threshold > 0) || !any) return;
          const text = 'порог ' + format(threshold);
          if (geo.edge) {
            const below = geo.edge === 'below';
            setAttrs(limitLabel, { x: width - 4, y: below ? height - 4 : 12, 'text-anchor': 'end' });
            limitLabel.textContent = text + (below ? ' ниже' : ' выше');
            return;
          }
          const y = px(geo.sy(threshold));
          setAttrs(limit, { x1: 0, x2: width, y1: y, y2: y });
          limit.style.display = '';
          setAttrs(limitLabel, { x: width - 4, y: y - 4, 'text-anchor': 'end' });
          limitLabel.textContent = text;
        }

        /** Смена периода или модели: старая линия перетекает в новую за 280 мс (по 48 точкам), затем — точный путь. */
        function morph(from, to) {
          const count = 48;
          const left = to[0].x;
          const right = to[to.length - 1].x;
          const start = [];
          const end = [];
          for (let index = 0; index < count; index++) {
            const x = left + ((right - left) * index) / (count - 1);
            start.push({ x, y: ChartMath.sampleAt(from, x) });
            end.push({ x, y: ChartMath.sampleAt(to, x) });
          }
          const began = performance.now();
          fade(true);
          const step = (now) => {
            const t = Math.min(1, (now - began) / 280);
            const ease = 1 - Math.pow(1 - t, 3);
            if (t >= 1) {
              setMain(to);
              fade(false);
              return;
            }
            setMain(start.map((point, index) => ({ x: point.x, y: point.y + (end[index].y - point.y) * ease })));
            frame = requestAnimationFrame(step);
          };
          frame = requestAnimationFrame(step);
        }

        /** Первый показ: линия прорисовывается за 600 мс, заливка и отметки проявляются. */
        function drawIn() {
          if (typeof line.animate !== 'function' || typeof line.getTotalLength !== 'function') return;
          const length = line.getTotalLength();
          const timing = { duration: 600, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)' };
          line.style.strokeDasharray = length + ' ' + length;
          drawing = line.animate([{ strokeDashoffset: length + 'px' }, { strokeDashoffset: '0px' }], timing);
          drawing.onfinish = () => {
            line.style.strokeDasharray = '';
            drawing = null;
          };
          for (const layer of [area, overlay, extras]) layer.animate([{ opacity: 0 }, { opacity: 1 }], timing);
        }

        /**
         * Отметки, пунктиры и порог уже на новом месте: на время морфинга главной линии они спрятаны сразу (без
         * перехода), потом проявляются (переход 0,2 с; при prefers-reduced-motion — без него).
         */
        function fade(hidden) {
          for (const layer of [overlay, extras]) {
            layer.style.transition = hidden ? 'none' : '';
            layer.style.opacity = hidden ? '0' : '';
          }
        }

        /** Перекрестие на точке index: линия, точка, подсказка (значение и дата), шапка через onScrub. */
        function show(index) {
          if (index < 0 || index >= screen.length || points.length < 2) return;
          if (index !== active) haptic('select');
          active = index;
          const spot = screen[index];
          root.classList.add('scrubbing');
          setAttrs(cross, { x1: px(spot.x), x2: px(spot.x), y1: 0, y2: height });
          setAttrs(dot, { cx: px(spot.x), cy: px(spot.y) });
          cross.style.display = '';
          dot.style.display = '';
          const info = options.tip ? options.tip(points[index]) : { value: format(points[index].y), label: '' };
          tip.textContent = '';
          tip.append(el('b', '', info.value), el('span', '', info.label));
          tip.hidden = false;
          const half = tip.offsetWidth / 2;
          tip.style.left = px(Math.max(half, Math.min(width - half, spot.x))) + 'px';
          // Точка в полосе подсказки (у верха графика) — подсказка под точкой: точку под пальцем видно всегда
          const tall = tip.offsetHeight;
          tip.style.top = (spot.y - 8 < tall ? px(Math.min(height - tall, spot.y + 12)) : 0) + 'px';
          if (options.onScrub) options.onScrub(points[index]);
        }

        function hide() {
          const shown = active !== -1;
          active = -1;
          root.classList.remove('scrubbing');
          cross.style.display = 'none';
          dot.style.display = 'none';
          tip.hidden = true;
          if (shown && options.onScrub) options.onScrub(null);
        }

        // Протяжка: касание и движение по горизонтали (вертикальный свайп листает страницу — touch-action: pan-y)
        const pick = (event) => ChartMath.nearestIndex(xs, event.clientX - surface.getBoundingClientRect().left);
        surface.addEventListener('pointerdown', (event) => {
          if (points.length < 2) return;
          dragging = true;
          try {
            surface.setPointerCapture(event.pointerId);
          } catch {
            // указатель уже отпущен
          }
          verticalSwipes(false);
          show(pick(event));
        });
        surface.addEventListener('pointermove', (event) => {
          if (dragging || event.pointerType === 'mouse') show(pick(event));
        });
        const release = () => {
          if (!dragging) return;
          dragging = false;
          verticalSwipes(true);
          hide();
        };
        surface.addEventListener('pointerup', release);
        surface.addEventListener('pointercancel', release);
        surface.addEventListener('pointerleave', (event) => {
          if (event.pointerType === 'mouse' && !dragging) hide();
        });
        // Telegram Desktop: стрелки ←/→ — по точкам, Esc — убрать перекрестие
        surface.addEventListener('keydown', (event) => {
          if (points.length < 2) return;
          if (event.key === 'Escape') return hide();
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          const next = active === -1 ? screen.length - 1 : active + (event.key === 'ArrowLeft' ? -1 : 1);
          show(Math.max(0, Math.min(screen.length - 1, next)));
        });
        surface.addEventListener('blur', () => hide());

        // Ширина поменялась (поворот, окно Telegram Desktop) — перерисовать без анимации; тема — через CSS-переменные
        const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(() => resize()) : null;
        if (observer) observer.observe(root);
        function resize() {
          const next = root.clientWidth;
          if (!drawn || !next || Math.abs(next - width) < 1) return;
          hide();
          draw(source, 'none');
        }

        const chart = {
          update(list, settings = {}) {
            if (settings.tone) root.className = 'chart tone-' + settings.tone;
            if ('threshold' in settings) options.threshold = settings.threshold;
            hide();
            source = list;
            let mode = 'none';
            if (!drawn) mode = 'first';
            else if (settings.animate) mode = 'morph';
            drawn = true;
            draw(list, mode);
          },
          destroy() {
            cancelAnimationFrame(frame);
            if (observer) observer.disconnect();
            if (dragging) verticalSwipes(true);
            charts.delete(chart);
          },
        };
        charts.add(chart);
        if (options.points) chart.update(options.points);
        return chart;
      }

      /** Открыть экран поверх текущего; прокрутка под ним запоминается для «Назад». */
      function openScreen(screen) {
        state.stack.push({ ...screen, scroll: window.scrollY });
        haptic('select');
        render();
        window.scrollTo(0, 0);
      }

      /** «Назад»: верхний экран снимается, прокрутка — как была под ним. */
      function goBack() {
        const screen = state.stack.pop();
        render();
        window.scrollTo(0, screen ? screen.scroll : 0);
      }

      /** Верхний экран, у которого есть данные (цель удалили, данные обновились — экран снимается); нет — null. */
      function topScreen() {
        while (state.stack.length > 0) {
          const screen = state.stack[state.stack.length - 1];
          if (screenData(screen)) return screen;
          state.stack.pop();
        }
        return null;
      }

      function screenData(screen) {
        if (screen.type === 'model') return findTarget(screen.id);
        if (screen.type === 'item') {
          const target = findTarget(screen.targetId);
          const listing = target ? target.listings.find((item) => item.id === screen.listingId) : null;
          return listing ? { target, listing } : null;
        }
        if (screen.type === 'watch') return state.watched.find((item) => item.id === screen.id) || null;
        if (screen.type === 'run') return profileRun(screen.id);
        if (screen.type === 'price') return state.profile;
        if (screen.type === 'listing') return profileItem(screen.id, screen.targetId);
        return null;
      }

      function renderScreen(screen) {
        const data = screenData(screen);
        if (screen.type === 'model') renderDetail(data);
        else if (screen.type === 'item') renderItem(data.target, data.listing);
        else if (screen.type === 'watch') renderItemView(data, watchContext(data));
        else if (screen.type === 'run') renderRun(data);
        else if (screen.type === 'price') renderPrice(screen);
        else renderProfileListing(data);
      }

      function watchContext(item) {
        return item.targetName ? { name: item.targetName, threshold: item.thresholdRub } : null;
      }

      function showItem(targetId, listingId) {
        if (!listingId) return;
        openScreen({ type: 'item', targetId, listingId });
      }

      /** Находка из блока «Подходят сейчас»: страница объявления в модели; «Назад» — сразу к списку. */
      function openFind(find) {
        const { listingId, targetId } = find;
        if (findTarget(targetId)) return openScreen({ type: 'item', targetId, listingId });
        if (state.profile) return openScreen({ type: 'listing', id: listingId, targetId });
        openLink(find.url);
      }

      function render() {
        showError('');
        destroyCharts();
        renderStale();
        const screen = topScreen();
        const page = Boolean(screen);
        $('top').hidden = page;
        $('bulk').hidden = state.readOnly;
        $('add').hidden = state.readOnly;
        $('tabs').hidden = state.statsOnly;
        $('title').textContent = state.statsOnly ? 'Обходы' : 'Модели';
        $('listView').hidden = page || state.tab !== 'targets';
        $('watchView').hidden = page || state.tab !== 'watch';
        $('statsView').hidden = page || state.tab !== 'stats';
        $('detailView').hidden = !page;
        $('tabTargets').classList.toggle('active', state.tab === 'targets');
        $('tabWatch').classList.toggle('active', state.tab === 'watch');
        $('tabStats').classList.toggle('active', state.tab === 'stats');
        $('watchCount').textContent = watchedCount() ? String(watchedCount()) : '';
        $('tabStatsLive').textContent = '';
        if (statsPulse()) $('tabStatsLive').append(pulse());
        if (screen) {
          // «Назад» — до отрисовки: неожиданные данные не должны оставить экран без выхода
          tg.BackButton.show();
          try {
            renderScreen(screen);
          } catch (error) {
            $('detailView').textContent = '';
            $('detailView').append(el('div', 'error', 'Не удалось показать: ' + error.message));
          }
        } else {
          if (!state.statsOnly) {
            renderList();
            renderFinds();
          }
          if (state.tab === 'watch') renderWatch();
          if (state.tab === 'stats') renderStats();
          tg.BackButton.hide();
        }
        updateMainButton();
      }

      function findTarget(id) {
        return state.targets.concat(state.added).find((t) => t.id === id) || null;
      }

      function showDetail(id) {
        openScreen({ type: 'model', id });
      }

      function openLink(url) {
        if (!url) return;
        try {
          tg.openLink(url);
        } catch {
          window.open(url, '_blank', 'noopener');
        }
      }

      function toggleDelete(target) {
        if (state.readOnly) return;
        if (target.id < 0) {
          state.added = state.added.filter((t) => t !== target);
          state.stack = [];
          haptic('select');
          return render();
        }
        if (state.deleted.has(target.id)) {
          state.deleted.delete(target.id);
          haptic('select');
          return render();
        }
        const apply = (ok) => {
          if (!ok) return;
          state.deleted.add(target.id);
          state.dirty.delete(target.id);
          state.stack = [];
          haptic('warning');
          render();
        };
        const question = 'Удалить «' + RunText.plain(target.name) + '»? Находки и история останутся.';
        try {
          tg.showConfirm(question, apply);
        } catch {
          apply(window.confirm(question));
        }
      }

      function edit(target, patch) {
        if (state.readOnly) return;
        if (target.id < 0) {
          // Новая (ещё не сохранённая) цель — правим её саму.
          Object.assign(target, patch);
          haptic('select');
          return render();
        }
        const change = { ...(state.dirty.get(target.id) || {}), ...patch };
        if (change.priceRub === target.priceRub) delete change.priceRub;
        if (change.active === target.active) delete change.active;
        if (Object.keys(change).length) state.dirty.set(target.id, change);
        else state.dirty.delete(target.id);
        haptic('select');
        render();
      }

      function setAll(active) {
        if (state.readOnly) return;
        const filter = state.filter.trim().toLowerCase();
        for (const target of state.targets.concat(state.added)) {
          if (state.deleted.has(target.id)) continue;
          if (filter && !target.name.toLowerCase().includes(filter)) continue;
          if (target.id < 0) target.active = active;
          else {
            const change = { ...(state.dirty.get(target.id) || {}), active };
            if (change.active === target.active) delete change.active;
            if (Object.keys(change).length) state.dirty.set(target.id, change);
            else state.dirty.delete(target.id);
          }
        }
        haptic('select');
        render();
      }

      function pendingCount() {
        return (
          state.dirty.size + state.added.length + state.deleted.size + state.watchAdd.size + state.watchRemove.size
        );
      }

      function updateMainButton() {
        const count = pendingCount();
        if (count === 0 || state.readOnly) return tg.MainButton.hide();
        tg.MainButton.setText('Сохранить (' + count + ')');
        tg.MainButton.show();
      }

      /**
       * Сохранить. openId — бот пришлёт в чат карточку цели, historyId — историю объявления, brief — сводку рынка,
       * refresh — свежую кнопку «Цели» (данные в ссылке устарели; правки, если есть, сохраняются как обычно).
       */
      async function save({ openId, historyId, brief, refresh } = {}) {
        if (state.readOnly) return showError(READ_ONLY_HINT);
        const invalid = [...state.dirty.values()].find(
          (change) => change.priceRub !== undefined && !(change.priceRub > 0),
        );
        if (invalid) return showError('Цена должна быть больше нуля');
        if (state.added.some((t) => !(t.priceRub > 0))) return showError('Цена новой модели должна быть больше нуля');
        if (state.offline) {
          const data = {
            v: 1,
            c: [...state.dirty]
              .filter(([id]) => !state.deleted.has(id))
              .map(([id, change]) => [
                id,
                change.priceRub ?? null,
                change.active === undefined ? null : change.active ? 1 : 0,
              ]),
            n: state.added.map((target) => [target.name, target.priceRub]),
          };
          if (state.deleted.size > 0) data.d = [...state.deleted];
          if (state.watchAdd.size > 0) data.w = [...state.watchAdd.keys()];
          if (state.watchRemove.size > 0) data.u = [...state.watchRemove];
          if (typeof openId === 'number') data.o = openId;
          if (typeof historyId === 'number') data.h = historyId;
          if (brief) data.i = 1;
          if (refresh) data.r = 1;
          const payload = JSON.stringify(data);
          if (new TextEncoder().encode(payload).length > 4096)
            return showError('Слишком много правок за раз — сохраните частями');
          // Telegram закрывает приложение, бот применяет правки и присылает ответ. Приложение, открытое не кнопкой
          // «Цели» внизу чата, Telegram молча не закрывает — правки не ушли (sendDataIgnored).
          try {
            tg.sendData(payload);
          } catch {
            // клиент без sendData — то же, что пропущенный вызов
          }
          setTimeout(sendDataIgnored, SEND_DATA_WAIT_MS);
          return;
        }
        tg.MainButton.showProgress();
        try {
          for (const [id, change] of state.dirty) {
            if (state.deleted.has(id)) continue;
            await api('/api/targets/' + id, { method: 'POST', body: JSON.stringify(change) });
          }
          for (const target of state.added) {
            await api('/api/targets', {
              method: 'POST',
              body: JSON.stringify({ name: target.name, priceRub: target.priceRub }),
            });
          }
          for (const id of state.deleted) await api('/api/targets/' + id + '/delete', { method: 'POST' });
          for (const id of state.watchAdd.keys()) await api('/api/watch/' + id, { method: 'POST' });
          for (const id of state.watchRemove) await api('/api/watch/' + id + '/delete', { method: 'POST' });
          state.dirty.clear();
          state.added = [];
          state.deleted.clear();
          state.watchAdd.clear();
          state.watchRemove.clear();
          haptic('success');
          await load();
        } catch (error) {
          showError('Не сохранилось: ' + error.message);
          haptic('error');
        } finally {
          tg.MainButton.hideProgress();
        }
      }

      /** Приложение не закрылось после sendData: открыто не кнопкой «Цели» — правки сбрасываются, только просмотр. */
      function sendDataIgnored() {
        state.readOnly = true;
        state.dirty.clear();
        state.added = [];
        state.deleted.clear();
        state.watchAdd.clear();
        state.watchRemove.clear();
        haptic('error');
        render();
        showError('Не сохранено. ' + READ_ONLY_HINT);
      }

      async function load() {
        const body = await api('/api/targets');
        state.at = body.at || null;
        // Нижняя граница цены куклы (MIN_DOLL_PRICE_RUB) — для цвета объявлений без «шанса»
        if (isNum(body.minDollPriceRub)) state.minRub = body.minDollPriceRub;
        state.targets = body.targets.map(normalize);
        state.watched = (body.w || []).map(watchFromRow);
        state.dashboard = dashboardFrom(body.d);
        // S — профиль статистики целиком (графики, цены моделей, страницы обходов)
        state.profile = body.S ? profileFrom(body.S) : null;
        state.finds = (body.f || []).map((row) => findFromRow(row, body.at));
        attachFinds();
        render();
      }

      /**
       * Ссылка — снимок на момент выдачи кнопки (аудит 05.10.2026, М2: обходы отставали на 5 минут и больше): открыто в
       * Telegram со страницы core — обходы, графики и находки ещё и живым запросом; правки по-прежнему только как
       * позволяет ссылка. Не ответил за LIVE_TIMEOUT_MS — остаётся снимок.
       */
      async function refreshFromLive() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), LIVE_TIMEOUT_MS);
        try {
          const body = await api('/api/targets', { signal: controller.signal });
          if (body.at) state.at = body.at;
          if (body.d) state.dashboard = dashboardFrom(body.d);
          if (body.S) state.profile = profileFrom(body.S);
          if (Array.isArray(body.f)) {
            state.finds = body.f.map((row) => findFromRow(row, body.at));
            attachFinds();
          }
          render();
        } catch {
          // Страница не с core или core не ответил — остаётся снимок из ссылки
        } finally {
          clearTimeout(timer);
        }
      }

      $('search').addEventListener('input', (event) => {
        state.filter = event.target.value;
        renderList();
      });
      $('allOn').addEventListener('click', () => setAll(true));
      $('tabTargets').addEventListener('click', () => {
        state.tab = 'targets';
        render();
      });
      $('tabStats').addEventListener('click', () => {
        state.tab = 'stats';
        haptic('select');
        render();
      });
      $('tabWatch').addEventListener('click', () => {
        state.tab = 'watch';
        haptic('select');
        render();
      });
      $('allOff').addEventListener('click', () => setAll(false));

      $('add').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.target;
        const name = form.elements.name.value.trim();
        const priceRub = Number(form.elements.price.value);
        if (!name || !(priceRub > 0)) return showError('Нужны название и цена больше нуля');
        state.added.push(normalize({ id: state.nextNewId--, name, priceRub, active: true }));
        form.reset();
        haptic('select');
        render();
      });

      async function start() {
        let fromLink = null;
        try {
          fromLink = await fromHash();
        } catch (error) {
          if (/[#&][zt]=/.test(location.hash)) {
            document.body.textContent = 'Не удалось прочитать список: ' + error.message;
            return;
          }
        }
        if (!tg || (!fromLink && !tg.initData)) {
          document.body.textContent = 'Откройте через кнопку «Цели» в чате с ботом.';
          return;
        }
        tg.ready();
        tg.expand();
        tg.MainButton.onClick(() => save());
        $('refresh').addEventListener('click', () => save({ refresh: true }));
        // Стек экранов: страница находки, открытая из блока, лежит прямо на списке — «Назад» сразу к нему
        tg.BackButton.onClick(goBack);
        const applyTheme = () => document.body.classList.toggle('dark', tg.colorScheme === 'dark');
        applyTheme();
        tg.onEvent('themeChanged', applyTheme);
        if (fromLink) {
          state.offline = true;
          // Кнопка закреплённого сообщения (inline): правки через sendData не дойдут — только просмотр. Кнопка табло
          // «Обходы и графики» (k: 's') — сразу вкладка «Обходы», целей в ней нет.
          state.statsOnly = Boolean(fromLink.stats);
          state.readOnly = openedInline() || state.statsOnly;
          if (state.statsOnly) state.tab = 'stats';
          state.at = fromLink.at;
          if (isNum(fromLink.minRub)) state.minRub = fromLink.minRub;
          state.targets = fromLink.targets;
          state.watched = fromLink.watched;
          state.dashboard = fromLink.dashboard || null;
          state.profile = fromLink.profile || null;
          state.finds = fromLink.finds || [];
          attachFinds();
          render();
          if (tg.initData && !STATIC_HOST.test(location.hostname)) refreshFromLive();
        } else {
          load().catch((error) => showError('Не загрузилось: ' + error.message));
        }
        // Приложение могли оставить открытым: плашка появится, когда данным исполнится 30 минут; «N мин назад» у
        // находок идёт дальше.
        setInterval(() => {
          renderStale();
          if (!$('listView').hidden) renderFinds();
        }, 60_000);
      }

      start();
    </script>
  </body>
</html>
