<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Модели</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /*
       * Стиль Mini App (просьба владельца 05.10.2026: «Убери все смайлики в приложении сделай четкий стиль без воды
       * лишней»): цвета Telegram, один акцент и смысловые зелёный (горячее, рост), жёлтый («проверьте», пауза) и
       * красный (блок, сбой, находка сейчас); шрифт — четыре размера, цифры моноширинные; радиусы 12 и 8 px. Статусы —
       * словом и цветной точкой, без смайликов и значков; нужные значки (шеврон, внешняя ссылка, «следить») — SVG.
       */
      :root {
        --bg: var(--tg-theme-bg-color, #ffffff);
        --text: var(--tg-theme-text-color, #111111);
        --hint: var(--tg-theme-hint-color, #8a8a8e);
        --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
        --accent: var(--tg-theme-button-color, #2481cc);
        --accent-text: var(--tg-theme-button-text-color, #ffffff);
        --link: var(--tg-theme-link-color, #2481cc);
        --red: var(--tg-theme-destructive-text-color, #e53935);
        --red-bg: rgba(229, 57, 53, 0.1);
        --green: #1f9a5e;
        --green-text: #17804d;
        --green-bg: rgba(31, 154, 94, 0.12);
        --yellow: #e0a100;
        --yellow-text: #8f6600;
        --yellow-bg: rgba(224, 161, 0, 0.15);
        --grey: #8e8e93;
        --line: rgba(142, 142, 147, 0.22);
        --fill-top: 0.28;
        --fs-s: 13px;
        --fs-m: 15px;
        --fs-l: 20px;
        --fs-xl: 28px;
        --r: 12px;
        --r-s: 8px;
      }
      body.dark {
        --red-bg: rgba(255, 107, 107, 0.15);
        --green: #4cc38a;
        --green-text: #5ad69a;
        --green-bg: rgba(90, 214, 154, 0.15);
        --yellow: #f0b429;
        --yellow-text: #f0b429;
        --yellow-bg: rgba(240, 180, 41, 0.16);
        --line: rgba(255, 255, 255, 0.1);
        --fill-top: 0.34;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 16px 96px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: var(--fs-m);
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2 {
        font-size: var(--fs-l);
        font-weight: 700;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      h1 {
        margin: 4px 0 8px;
      }
      h2 {
        margin: 12px 0 4px;
      }
      .muted,
      .sub,
      .tiny {
        color: var(--hint);
        font-size: var(--fs-s);
      }
      .sub {
        margin-top: 2px;
      }
      [hidden] {
        display: none !important;
      }
      /* Поля и кнопки. */
      input {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid transparent;
        border-radius: var(--r-s);
        padding: 9px 10px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      input:disabled {
        opacity: 0.6;
      }
      /* Цена без стрелок-спиннеров: они съедали место, и 20000 выглядело как «2000(». */
      input[type='number'] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      input[type='number']::-webkit-outer-spin-button,
      input[type='number']::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: var(--r-s);
        padding: 10px 12px;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
      }
      button.ghost {
        background: var(--card);
        color: var(--text);
      }
      button.danger {
        background: var(--card);
        color: var(--red);
      }
      button.small {
        padding: 6px 10px;
        font-size: var(--fs-s);
      }
      button:focus-visible,
      .chart svg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .icon {
        display: block;
        flex: none;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .error {
        margin: 8px 0;
        color: var(--red);
      }
      .empty {
        padding: 24px 0;
        text-align: center;
      }
      /* Шапка: плашка устаревших данных, заголовок, вкладки. */
      .stale-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 8px;
        padding: 8px 8px 8px 12px;
        border-radius: var(--r);
        background: var(--yellow-bg);
        font-size: var(--fs-s);
      }
      .stale-banner span {
        flex: 1;
        min-width: 0;
      }
      .stale-banner button {
        flex: none;
        padding: 6px 10px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin: 8px 0 12px;
        padding: 3px;
        border-radius: var(--r);
        background: var(--card);
      }
      .tab {
        flex: 1;
        padding: 8px 4px;
        border-radius: var(--r-s);
        background: transparent;
        color: var(--text);
      }
      .tab.active {
        background: var(--bg);
        font-weight: 600;
      }
      .tab .n {
        color: var(--hint);
      }
      #tabLive .pulse,
      #tabStatsLive .pulse {
        width: 8px;
        height: 8px;
        margin-left: 4px;
        vertical-align: 1px;
      }
      /* Список целей. */
      .search {
        width: 100%;
        margin: 8px 0;
      }
      .bulk,
      .add {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .bulk button {
        flex: 1;
        padding: 8px 6px;
      }
      .add {
        margin-bottom: 12px;
      }
      .add input[name='name'] {
        flex: 1;
        min-width: 0;
      }
      .add input[name='price'] {
        width: 86px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: var(--r);
        background: var(--card);
      }
      .row.paused .name {
        color: var(--hint);
      }
      .row.dirty {
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .row.deleted {
        opacity: 0.55;
      }
      .row.deleted .name {
        text-decoration: line-through;
      }
      .open {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .name {
        overflow-wrap: anywhere;
      }
      .thumb {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: var(--r-s);
        object-fit: cover;
        background: var(--bg);
      }
      .placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 600;
      }
      /* 7 знаков: цена до 999 999 ₽ целиком и место под курсор (на телефоне 375 px строка помещается). */
      .price {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
      }
      .price input {
        width: calc(7ch + 16px);
        padding: 9px 7px;
        text-align: right;
        background: var(--bg);
      }
      .switch {
        position: relative;
        flex: none;
        width: 44px;
        height: 26px;
      }
      .switch input {
        width: 0;
        height: 0;
        opacity: 0;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 13px;
        background: var(--hint);
        transition: background 0.15s;
      }
      .switch span::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span::after {
        transform: translateX(18px);
      }
      .switch input:disabled + span {
        opacity: 0.45;
      }
      /* Карточки и панели. */
      .panel {
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: var(--r);
        background: var(--card);
      }
      .panel .row {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
      }
      .stat b {
        font-weight: 600;
        text-align: right;
      }
      .section-title {
        margin: 20px 2px 8px;
        font-size: var(--fs-l);
        font-weight: 700;
      }
      .group-title {
        margin-bottom: 2px;
        font-weight: 600;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 8px 0;
      }
      .card {
        padding: 10px 12px;
        border-radius: var(--r);
        background: var(--card);
      }
      .card .num {
        font-size: var(--fs-l);
        font-weight: 700;
      }
      .card.good .num {
        color: var(--green-text);
      }
      .card.bad .num {
        color: var(--red);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }
      button.brief {
        width: 100%;
        margin: 12px 0 4px;
      }
      details.more summary {
        padding: 2px 2px 6px;
        color: var(--link);
        cursor: pointer;
      }
      .pause-banner,
      .gap-row {
        margin: 8px 0;
        padding: 8px 12px;
        border-radius: var(--r);
        background: var(--yellow-bg);
        color: var(--yellow-text);
      }
      .gap-row {
        margin: 2px 0 8px;
        padding: 6px 10px;
        font-size: var(--fs-s);
      }
      /* Цветная точка статуса и подписи уровней. */
      .sdot {
        display: inline-block;
        flex: none;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--grey);
        vertical-align: 1px;
      }
      .sdot.hot,
      .sdot.ok {
        background: var(--green);
      }
      .sdot.warn {
        background: var(--yellow);
      }
      .sdot.bad {
        background: var(--red);
      }
      .dot-legend,
      .legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin: 6px 0;
        color: var(--hint);
        font-size: var(--fs-s);
      }
      .dot-legend span,
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot-legend i,
      .legend i {
        display: block;
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--grey);
      }
      .dot-legend i.hot {
        background: var(--green);
      }
      .dot-legend i.warn {
        background: var(--yellow);
      }
      .legend i {
        border-radius: 3px;
      }
      /* Образцы линий графика в легенде: сплошная, пунктир, штрих порога, точки. */
      .legend i.ln {
        width: 14px;
        height: 0;
        border-top: 2px solid var(--accent);
        border-radius: 0;
        background: none;
      }
      .legend i.ln.dash {
        border-top-style: dashed;
        opacity: 0.75;
      }
      .legend i.ln.thr {
        border-top: 1px dashed var(--hint);
      }
      .legend i.pt {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
      }
      .legend i.pt.faint {
        background: var(--accent);
        opacity: 0.35;
      }
      /*
       * «Подходит сейчас» (решение владельца 05.10.2026, образец «как прямой эфир»): ровная красная точка, от неё
       * расходится и гаснет тень (1,6 с). Данные обновились и находки нет — нет и точки. Без анимации — просто точка.
       * --ring — подложка под точкой на фото (цвет фона), её тень сохраняется в каждом кадре.
       */
      .pulse {
        --ring: 0 0 0 0 transparent;
        display: inline-block;
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--red);
        vertical-align: middle;
        box-shadow:
          var(--ring),
          0 0 0 0 rgba(226, 75, 74, 0.7);
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow:
            var(--ring),
            0 0 0 0 rgba(226, 75, 74, 0.7);
        }
        70% {
          box-shadow:
            var(--ring),
            0 0 0 10px rgba(226, 75, 74, 0);
        }
        100% {
          box-shadow:
            var(--ring),
            0 0 0 0 rgba(226, 75, 74, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
        .chart .extras,
        .chart .overlay {
          transition: none;
        }
      }
      .thumb-wrap {
        position: relative;
        flex: none;
      }
      .thumb-wrap > .pulse {
        --ring: 0 0 0 2px var(--bg);
        position: absolute;
        top: -3px;
        right: -3px;
        width: 12px;
        height: 12px;
      }
      /* Строки на фоне карточки — подложка под точкой цвета карточки. */
      .asset .thumb-wrap > .pulse,
      .lrow .thumb-wrap > .pulse,
      .srow .thumb-wrap > .pulse,
      .offer .thumb-wrap > .pulse,
      .wrow .thumb-wrap > .pulse {
        --ring: 0 0 0 2px var(--card);
      }
      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 6px;
        padding: 1px 8px 1px 7px;
        border-radius: var(--r-s);
        background: var(--red-bg);
        color: var(--red);
        font-size: var(--fs-s);
        font-weight: 600;
        white-space: nowrap;
      }
      .live-badge .pulse {
        width: 8px;
        height: 8px;
      }
      .live-note {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        color: var(--red);
        font-weight: 600;
      }
      /* «Подходят сейчас». */
      .finds {
        margin: 0 0 12px;
        padding: 10px 10px 4px;
        border-radius: var(--r);
        background: var(--red-bg);
      }
      .finds-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 4px 10px;
        font-weight: 600;
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 6px;
        padding: 8px;
        border-radius: var(--r-s);
        background: var(--bg);
        color: var(--text);
        text-align: left;
      }
      .frow .title {
        display: -webkit-box;
        overflow: hidden;
        overflow-wrap: anywhere;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .frow .cost {
        color: var(--red);
        text-align: right;
      }
      .frow .cost .sub {
        font-weight: 400;
      }
      /* Объявления модели и «Слежу»: полоса слева по уровню, снятое — бледное. */
      .offer,
      .wrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
        padding: 8px;
        border-radius: var(--r-s);
        background: var(--bg);
        box-shadow: inset 3px 0 0 var(--line);
        cursor: pointer;
      }
      .wrow {
        border-radius: var(--r);
        background: var(--card);
      }
      .offer .title {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .offer .when {
        color: var(--hint);
        font-size: var(--fs-s);
      }
      .offer.ok,
      .offer.hot,
      .wrow.ok {
        box-shadow: inset 3px 0 0 var(--green);
      }
      .offer.warn {
        box-shadow: inset 3px 0 0 var(--yellow);
      }
      .offer.live {
        box-shadow: inset 3px 0 0 var(--red);
      }
      .offer.live .when,
      .offer.live .cost {
        color: var(--red);
      }
      .removed {
        opacity: 0.55;
      }
      .removed .name,
      .removed .title {
        text-decoration: line-through;
      }
      .removed img {
        filter: grayscale(1);
      }
      .wrow.pending {
        opacity: 0.5;
      }
      .wrow.adding {
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .cost {
        flex: none;
        font-weight: 600;
        white-space: nowrap;
      }
      .ok .cost,
      .hot .cost,
      .cost.hot,
      .cost.okc,
      .verdict.okc {
        color: var(--green-text);
      }
      .warn .cost,
      .cost.warn {
        color: var(--yellow-text);
      }
      /* «Следить»: закладка; следим — залита акцентом. */
      .watch-toggle {
        flex: none;
        padding: 6px;
        background: transparent;
        color: var(--hint);
      }
      .watch-toggle.on {
        color: var(--accent);
      }
      .watch-toggle.on .icon {
        fill: currentColor;
      }
      /* Страница объявления. */
      .hero {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: var(--r);
        object-fit: cover;
        background: var(--card);
      }
      .hero.placeholder {
        font-size: var(--fs-xl);
      }
      .hero.gone {
        filter: grayscale(1);
        opacity: 0.6;
      }
      .big-price {
        margin: 4px 0 2px;
        font-size: var(--fs-xl);
        font-weight: 700;
      }
      .big-price.ok,
      .big-price.hot {
        color: var(--green-text);
      }
      .big-price.warn {
        color: var(--yellow-text);
      }
      .big-price.gone {
        color: var(--hint);
        text-decoration: line-through;
      }
      .gone-banner {
        margin: 8px 0;
        padding: 8px 12px;
        border-radius: var(--r);
        background: var(--card);
        color: var(--hint);
      }
      .verdict-line {
        display: block;
        margin: 4px 0;
      }
      /* «Шанс» (аудит 05.10.2026, К5): зелёное — горячее (от 70), серое — обычное, жёлтое — «проверьте». */
      .vchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      .vchip,
      .chance {
        display: inline-block;
        padding: 1px 6px;
        border-radius: var(--r-s);
        background: var(--bg);
        color: var(--hint);
        font-size: var(--fs-s);
        white-space: nowrap;
      }
      .offer .vchip,
      .offer .chance,
      .frow .chance {
        background: var(--card);
      }
      .chance {
        font-weight: 600;
      }
      .sub > .chance {
        margin-left: 6px;
      }
      .chance.hot {
        background: var(--green-bg);
        color: var(--green-text);
      }
      .chance.warn {
        background: var(--yellow-bg);
        color: var(--yellow-text);
      }
      .vchip.fresh {
        color: var(--accent);
        font-weight: 600;
      }
      .reasons {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--hint);
        font-size: var(--fs-s);
      }
      .reasons .red {
        color: var(--yellow-text);
      }
      /* Сводка «Цели» (ссылка «Цели»): последние обходы. */
      .run {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
        padding: 8px 10px;
        border-radius: var(--r-s);
        background: var(--bg);
        box-shadow: inset 3px 0 0 var(--grey);
      }
      .run.ok {
        box-shadow: inset 3px 0 0 var(--green);
      }
      .run.blocked,
      .run.error {
        box-shadow: inset 3px 0 0 var(--red);
      }
      .run .when {
        flex: none;
        width: 74px;
        color: var(--hint);
        font-size: var(--fs-s);
      }
      .run .what {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      /* Таблицы. */
      .qtable {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fs-s);
      }
      .qtable th {
        padding: 4px 6px;
        color: var(--hint);
        font-weight: 400;
        text-align: left;
      }
      .qtable td {
        padding: 6px;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }
      .qtable td.n,
      .qtable th.n {
        text-align: right;

    <script id="chart-math">
      /*
       * Чистые функции графиков (TZ.md «Поиск по моделям, страница обхода и графики», шаг 5): путь линии, ближайшая
       * точка, прореживание, % изменения, суммы по окну. Без DOM: Jest выполняет этот блок через vm
       * (test/miniapp/chart-math.test.ts).
       */
      var ChartMath = (() => {
        const round = (value) => Math.round(value * 10) / 10;

        /**
         * Путь SVG через точки { x, y } (по возрастанию x) — монотонная кубическая интерполяция Фрича — Карлсона: между
         * соседними точками линия не выходит за их значения — не уходит ниже нуля и не рисует несуществующих пиков.
         */
        function monotonePath(points) {
          const count = points.length;
          if (count === 0) return '';
          const head = 'M' + round(points[0].x) + ',' + round(points[0].y);
          if (count === 1) return head;
          const steps = [];
          const slopes = [];
          for (let index = 0; index < count - 1; index++) {
            const step = points[index + 1].x - points[index].x;
            steps.push(step);
            slopes.push(step === 0 ? 0 : (points[index + 1].y - points[index].y) / step);
          }
          const tangents = [slopes[0]];
          for (let index = 1; index < count - 1; index++) {
            const before = slopes[index - 1];
            const after = slopes[index];
            tangents.push(before * after <= 0 ? 0 : (before + after) / 2);
          }
          tangents.push(slopes[count - 2]);
          for (let index = 0; index < count - 1; index++) {
            const slope = slopes[index];
            if (slope === 0) {
              tangents[index] = 0;
              tangents[index + 1] = 0;
              continue;
            }
            const alpha = tangents[index] / slope;
            const beta = tangents[index + 1] / slope;
            const length = alpha * alpha + beta * beta;
            if (length > 9) {
              const scale = 3 / Math.sqrt(length);
              tangents[index] = scale * alpha * slope;
              tangents[index + 1] = scale * beta * slope;
            }
          }
          let path = head;
          for (let index = 0; index < count - 1; index++) {
            const from = points[index];
            const to = points[index + 1];
            const third = steps[index] / 3;
            const first = round(from.x + third) + ',' + round(from.y + tangents[index] * third);
            const second = round(to.x - third) + ',' + round(to.y - tangents[index + 1] * third);
            path += 'C' + first + ' ' + second + ' ' + round(to.x) + ',' + round(to.y);
          }
          return path;
        }

        /** Номер точки, ближайшей к x (xs — по возрастанию); пусто — −1. */
        function nearestIndex(xs, x) {
          if (xs.length === 0) return -1;
          let low = 0;
          let high = xs.length - 1;
          while (high - low > 1) {
            const middle = Math.floor((low + high) / 2);
            if (xs[middle] <= x) low = middle;
            else high = middle;
          }
          return Math.abs(xs[high] - x) < Math.abs(xs[low] - x) ? high : low;
        }

        /**
         * Прореживание до max точек (Largest-Triangle-Three-Buckets): первая и последняя остаются, из каждой корзины —
         * точка с наибольшим треугольником, поэтому пики не теряются. Точки с mark (дни находок) остаются всегда, сверх
         * max: иначе пропали бы их красные отметки и протяжка до них. Точки — те же объекты (со всеми полями).
         */
        function thin(points, max) {
          const out = lttb(points, max);
          if (out.length === points.length) return out;
          const kept = new Set(out);
          const marks = points.filter((point) => point.mark && !kept.has(point));
          return marks.length === 0 ? out : out.concat(marks).sort((a, b) => a.x - b.x);
        }

        function lttb(points, max) {
          if (max < 3 || points.length <= max) return points.slice();
          const out = [points[0]];
          const every = (points.length - 2) / (max - 2);
          let anchor = 0;
          for (let bucket = 0; bucket < max - 2; bucket++) {
            const start = Math.floor(bucket * every) + 1;
            const end = Math.floor((bucket + 1) * every) + 1;
            const nextEnd = Math.min(Math.floor((bucket + 2) * every) + 1, points.length);
            let averageX = 0;
            let averageY = 0;
            for (let index = end; index < nextEnd; index++) {
              averageX += points[index].x;
              averageY += points[index].y;
            }
            const size = Math.max(1, nextEnd - end);
            averageX /= size;
            averageY /= size;
            const a = points[anchor];
            let best = start;
            let area = -1;
            for (let index = start; index < end; index++) {
              const b = points[index];
              const value = Math.abs((a.x - averageX) * (b.y - a.y) - (a.x - b.x) * (averageY - a.y));
              if (value > area) {
                area = value;
                best = index;
              }
            }
            out.push(points[best]);
            anchor = best;
          }
          out.push(points[points.length - 1]);
          return out;
        }

        /** Изменение в процентах, округлённое; база не больше нуля — null. */
        function changePercent(from, to) {
          if (!(from > 0) || typeof to !== 'number') return null;
          return Math.round(((to - from) * 100) / from);
        }

        /** Наименьшее и наибольшее (не числа пропускаются); пусто — [0, 1]. */
        function extent(values) {
          let low = Infinity;
          let high = -Infinity;
          for (const value of values) {
            if (typeof value !== 'number' || Number.isNaN(value)) continue;
            low = Math.min(low, value);
            high = Math.max(high, value);
          }
          return low === Infinity ? [0, 1] : [low, high];
        }

        /** Сумма ряда (шаги по step от start) за окно [from, to): шаг на границе входит долей по времени. */
        function windowSum(values, start, step, from, to) {
          let sum = 0;
          values.forEach((value, index) => {
            const left = Math.max(from, start + index * step);
            const right = Math.min(to, start + (index + 1) * step);
            if (right > left) sum += ((Number(value) || 0) * (right - left)) / step;
          });
          return sum;
        }

        /** Ряд из дельт (первая — значение, дальше — разница с предыдущим), умноженный на unit. */
        function undelta(values, unit) {
          let value = 0;
          return values.map((delta, index) => {
            value = index === 0 ? Number(delta) || 0 : value + (Number(delta) || 0);
            return value * unit;
          });
        }

        /** Значение ломаной (точки по возрастанию x) в x; за краями — крайние значения. */
        function sampleAt(points, x) {
          if (points.length === 0) return 0;
          if (x <= points[0].x) return points[0].y;
          for (let index = 1; index < points.length; index++) {
            const right = points[index];
            if (x > right.x) continue;
            const left = points[index - 1];
            const span = right.x - left.x;
            return span === 0 ? right.y : left.y + ((right.y - left.y) * (x - left.x)) / span;
          }
          return points[points.length - 1].y;
        }

        return { monotonePath, nearestIndex, thin, changePercent, extent, windowSum, undelta, sampleAt };
      })();
    </script>

    <script id="run-text">
      /*
       * Фразы вкладки «Обходы» — как у сервера (в данных только коды): словарь ошибок обхода (stats/run-errors.ts,
       * RUN_ERROR_TEXT; индекс — код 0–15) и причины замедления очередей (targets/model-search.ts, laneSlowText;
       * индекс — код 1–8). Совпадение проверяет test/miniapp/chart-math.test.ts. plain — текст без смайликов (как
       * appText сервера, miniapp/app-text.ts): так показываются ссылки до 06.10.2026 и заголовки Avito.
       */
      var RunText = {
        errors: [
          'без ошибок',
          'связь оборвалась',
          'Avito не ответил вовремя',
          'страница не загрузилась за 60 с',
          'у ПК пропал или сменился интернет',
          'не нашёлся адрес avito.ru',
          'сервер не ответил',
          'защищённое соединение не установилось',
          'Avito закрыл доступ',
          'Avito попросил подождать',
          'страница пришла, но объявления не разобрать',
          'Avito ничего не нашёл',
          'ПК не прислал результат за 7 минут',
          'расширение обновлялось — обход пропущен',
          'страница слишком большая',
          'другое',
        ],
        slow: [
          '',
          'выключен (MODEL_SEARCH=false)',
          'Avito на паузе',
          'Avito в бэкоффе',
          'пауза после блока',
          'лимит Avito',
          'мало удачных обходов',
          'агент занят',
          'реже: лимит загрузок Avito',
        ],
        /** Без эмодзи и пиктограмм (флаги, цвет кожи, VS16, ZWJ, keycap); лишние пробелы схлопываются. */
        plain(text) {
          const value = String(text);
          const pictographs =
            /\p{Extended_Pictographic}|\p{Regional_Indicator}|\p{Emoji_Modifier}|\u{FE0F}|\u{200D}|\u{20E3}/gu;
          const stripped = value.replace(pictographs, '');
          return stripped === value ? value : stripped.replace(/\s{2,}/g, ' ').trim();
        },
      };
    </script>

    <script id="stats-data">
      /*
       * Чтение данных вкладки «Обходы» без DOM (TZ.md «Поиск по моделям, страница обхода и графики», шаг 5): сводка
       * ссылки «Цели» (d, старые восьмиполевые строки r) и профиль статистики (k: 's' и поле S сервера; формат —
       * в начале apps/core/src/miniapp/stats-payload.ts). Jest выполняет этот блок вместе с chart-math через vm
       * (test/miniapp/chart-math.test.ts): старые строки читаются, а строки сервера ложатся в поля, которые читает
       * страница.
       */
      var StatsData = (() => {
        const safeUrl = (value) => (typeof value === 'string' && /^https:\/\//.test(value) ? value : null);
        const isNum = (value) => typeof value === 'number' && Number.isFinite(value);
        const has = (flags, bit) => (Number(flags) & bit) !== 0;

        /** Выход Avito за сутки (с 05.10.2026): [сервер | «напрямую», IP | 0, обходов, удачных, блоков, ошибок]. */
        function exitFromRow([label, ip, runs, ok, blocked, failed]) {
          return {
            label: String(label),
            ip: ip || null,
            runs: Number(runs) || 0,
            ok: Number(ok) || 0,
            blocked: Number(blocked) || 0,
            failed: Number(failed) || 0,
          };
        }

        /**
         * Заголовок группы «Запросов за сутки» в ссылках до пометки (q[5]): «Выдача · раз в ~10 мин», «Модели»; в самых
         * старых — со смайликом впереди.
         */
        const GROUP_HEADER = /^[^\p{L}]*(Выдача|Модели|Проверки|Общие|По моделям|Проверки страниц)( ·|$)/u;

        /**
         * Вид обхода строки d.r (как в профиле: 0 выдача, 1 модель, 2 «Слежу», 3 разовый, 4 находка): с 06.10.2026 —
         * поле 9 у модели и разового; иначе — по полю «проверка страницы» и подписи старых ссылок (смайлик модели,
         * «разовый обход»).
         */
        function dashboardKind(kind, watch, label) {
          if (kind === 1 || kind === 3) return kind;
          if (watch === 2) return 4;
          if (watch === 1) return 2;
          if (/^\s*\u{1F3AF}/u.test(label)) return 1;
          return label === 'разовый обход' ? 3 : 0;
        }

        /** Сводка вкладки «Обходы» (одна форма в ссылке и в API). */
        function dashboardFrom(d) {
          if (!d) return null;
          const [runs, ok, blocked, failed, found, fresh, finds, discoveries] = d.s || [];
          const exits = (d.x || []).map(exitFromRow);
          return {
            day: { runs, ok, blocked, failed, found, fresh, finds, discoveries },
            listings: d.n || 0,
            pausedUntil: d.p || null,
            pauseReason: d.pr || null,
            queries: (d.q || []).map(([query, qRuns, qOk, qFound, qFresh, header]) => ({
              query,
              runs: qRuns,
              ok: qOk,
              found: qFound,
              fresh: qFresh,
              // Заголовок группы с итогом (с 06.10.2026 — пометка 1; раньше — по подписи)
              header: header === 1 || GROUP_HEADER.test(String(query)),
            })),
            exits,
            recent: (d.r || []).map(([at, label, watch, code, rFound, rFresh, seconds, exit, page, kind]) => ({
              at,
              label,
              kind: dashboardKind(kind, watch, String(label)),
              // Проверка страницы: 1 — «Слежу», 2 — находки (с 05.10.2026; раньше обе — 1)
              watch: watch === 1 || watch === 2,
              findCheck: watch === 2,
              code,
              found: rFound,
              fresh: rFresh,
              seconds,
              // Через что грузилась страница Avito — строка x; -1 (не Avito) и в ссылках старее 05.10.2026 — ничего.
              exit: exit >= 0 ? exits[exit] || null : null,
              page: pageCheckFrom(page),
            })),
          };
        }

        /** Итог удачной проверки страницы (М1): [снято 0|1, цена на странице ₽ | null, цена до проверки ₽ | null]. */
        function pageCheckFrom(row) {
          if (!Array.isArray(row)) return null;
          const price = (value) => (isNum(value) ? value : null);
          return { removed: row[0] === 1, priceRub: price(row[1]), prevRub: price(row[2]) };
        }

        /**
         * Признаки и «шанс» объявления у модели (DealRow, listings/deal-score.ts): [шанс | -1, флаги FLAG, [коды
         * причин], кукол | 0, роль 0 кукла | 1 лот | 2 не кукла модели, цена в описании ₽ | 0]; нет — null.
         */
        function dealFromRow(row) {
          if (!Array.isArray(row)) return null;
          const score = Number(row[0]);
          return {
            score: Number.isFinite(score) && score >= 0 ? score : null,
            flags: Number(row[1]) || 0,
            reasons: Array.isArray(row[2]) ? row[2].map(Number) : [],
            quantity: Number(row[3]) || 0,
            role: Number(row[4]) || 0,
            descRub: Number(row[5]) || 0,
          };
        }

        /** «Блоки»: лимиты сессий браузеров Avito (a) — сессии и изменения лимитов; нет — null. */
        function budgetFrom(a) {
          if (!a || !Array.isArray(a.s)) return null;
          return {
            loads: Number(a.t) || 0,
            capacity: Number(a.c) || 0,
            min: Number(a.mn) || 0,
            max: Number(a.mx) || 0,
            start: Number(a.st) || 0,
            cap: Number(a.cp) || null,
            sessions: a.s.map((row) => ({
              label: String(row[0]),
              budget: Number(row[1]) || 0,
              loads: Number(row[2]) || 0,
              pausedUntil: Number(row[3]) || null,
              active: row[4] === 1,
              hold: Number(row[5]) || 0,
              reason: row[6] || null,
              // Последняя загрузка Avito — этого браузера (с 06.10.2026: браузер меняется на каждой загрузке)
              last: row[7] === 1,
              // С 06.10.2026: грузит картинки, сейчас её очередь, на связи для круга
              ...(row.length > 8 ? { media: row[8] === 1, turn: row[9] === 1, live: row[10] === 1 } : {}),
            })),
            history: (a.h || []).map(([minute, label, reason, from, to, pausedUntil, note]) => ({
              minute,
              label: String(label),
              reason: Number(reason) || 0,
              from: isNum(from) && from >= 0 ? from : null,
              to: Number(to) || 0,
              pausedUntil: Number(pausedUntil) || null,
              note: note || null,
            })),
          };
        }

        /** «Блоки»: статистика блоков Avito (b) — блоки, доли по частоте, выходы, сессии, вывод; нет — null. */
        function blocksFrom(b) {
          if (!b || !Array.isArray(b.k)) return null;
          const exits = (b.x || []).map(([label, ip]) => ({ label: String(label), ip: ip || null }));
          const buckets = (rows) => (rows || []).map(([from, loads, blocks]) => ({ from, loads, blocks }));
          return {
            days: Number(b.d) || 0,
            loads: Number((b.n || [])[0]) || 0,
            blocks: Number((b.n || [])[1]) || 0,
            rows: b.k.map((row) => ({
              minute: row[0],
              exit: exits[row[1]] || null,
              session: row[2] || null,
              kind: row[3],
              http: row[4] || 0,
              code: row[5] || 0,
              all: [row[6], row[7], row[8]],
              sameExit: [row[9], row[10], row[11]],
              sameSession: [row[12], row[13], row[14]],
              sincePrev: isNum(row[15]) && row[15] >= 0 ? row[15] : null,
              firstAfterQuiet: row[16] === 1,
              // С 06.10.2026: HTTP 439 (ранний сигнал), тип IP, тишина сессии и IP перед загрузкой, картинки
              ...(row.length > 17
                ? {
                    warn: row[17] === 1,
                    ipType: Number(row[18]) || 0,
                    idleSession: row[19] >= 0 ? row[19] : null,
                    idleExit: row[20] >= 0 ? row[20] : null,
                    media: row[21] === 1 ? true : row[21] === 0 ? false : null,
                  }
                : {}),
            })),
            byAll: buckets(b.a),
            byExit: buckets(b.e),
            bySession: buckets(b.s),
            exits: (b.px || []).map(([exit, loads, blocks]) => ({ exit: exits[exit] || null, loads, blocks })),
            sessions: (b.ps || []).map(([session, loads, blocks]) => ({ session: String(session), loads, blocks })),
            // Смена браузера и IP подряд за сутки (с 06.10.2026): пар соседних загрузок, тот же выход, та же сессия
            repeats: Array.isArray(b.rp) ? { pairs: b.rp[0], sameExit: b.rp[1], sameSession: b.rp[2] } : null,
            conclusion: (b.w || []).map(String),
            // «Что предсказывает блоки», опыт с картинками и безопасный темп (с 06.10.2026)
            warns: Number(b.wn) || 0,
            byType: Array.isArray(b.ty) ? b.ty.map(([type, ...rest]) => ({ type, ...groupOf(rest) })) : null,
            byIdle: Array.isArray(b.id) ? b.id.map(([from, ...rest]) => ({ from, ...groupOf(rest) })) : null,
            media: Array.isArray(b.md) ? { on: groupOf(b.md[0]), off: groupOf(b.md[1]) } : null,
            safeRate: isNum(b.sr) && b.sr > 0 ? b.sr : null,
            // Безопасный темп каждого браузера (ss); ссылки до него — только общий (sr)
            safeRates: safeRatesOf(b.ss),
          };
        }

        /** Безопасный темп каждого браузера: [[сессия, загрузок за час | -1 — мало блоков]]; нет поля — null. */
        function safeRatesOf(rows) {
          if (!Array.isArray(rows)) return null;
          return rows.map(([session, rate]) => ({
            session: String(session),
            rate: isNum(rate) && rate > 0 ? rate : null,
          }));
        }

        /** Группа загрузок [загрузок, блоков, 439] → объект; нет — нули. */
        function groupOf(row) {
          const [loads, blocks, warns] = Array.isArray(row) ? row : [];
          return { loads: Number(loads) || 0, blocks: Number(blocks) || 0, warns: Number(warns) || 0 };
        }

        /** «Оценка шанса» (e): версия формулы и корзины [от, находок, оценено, одобрено, проверялась, снято]. */
        function chanceFrom(e) {
          if (!e || !Array.isArray(e.b)) return null;
          return {
            version: Number(e.v) || 0,
            buckets: e.b.map(([from, matches, rated, good, checked, gone]) => ({
              from,
              matches,
              rated,
              good,
              checked,
              gone,
            })),
          };
        }

        /**
         * Профиль статистики (TZ.md «Поиск по моделям, страница обхода и графики», шаг 5): ссылка табло (k: 's') или
         * поле S серверного режима. Формат — в начале apps/core/src/miniapp/stats-payload.ts.
         */
        function profileFrom(data) {
          const at = Number(data.at) || Math.floor(Date.now() / 1000);
          const atMinute = Math.floor(at / 60);
          const targets = new Map();
          for (const row of data.t || []) targets.set(row[0], targetFromRow(row));
          const listings = new Map();
          for (const row of data.L || []) listings.set(row[0], listingFromRow(row, atMinute));
          // Браузеры обходов (r[27] — индекс; с 06.10.2026)
          const browsers = (data.br || []).map(String);
          const runs = (data.r || []).map((row) => runFromRow(row, browsers));
          // В r сначала последние обходы (подробности — у первых подряд), затем «интересные» — всегда с подробностями:
          // до сортировки по времени первая строка без подробностей — сколько последних обходов с подробностями
          const bare = runs.findIndex((run) => run.freshIds === 0);
          const interesting = bare === -1 ? 0 : runs.slice(bare).filter((run) => run.freshIds !== 0).length;
          runs.sort((a, b) => b.minute - a.minute || b.id - a.id);
          return {
            at,
            atMinute,
            day: data.s || [],
            pauseReason: data.pr || null,
            groups: (data.g || []).map(groupFromRow),
            exits: (data.x || []).map(exitFromRow),
            series: data.c || null,
            offset: displayOffset(data.c),
            targets,
            models: (data.m || []).map(modelFromRow),
            runs,
            // «Подробности — у последних N обходов»: null — подробности у всех обходов
            detailed: bare === -1 ? null : bare,
            // «Интересные» за сутки (с подробностями) в r после последних
            interesting,
            listings,
            urls: (data.u || []).map(fullUrl),
            queries: (data.q || []).map(queryFromRow),
            cut: data.o || null,
            budget: budgetFrom(data.a),
            blocks: blocksFrom(data.b),
            chance: chanceFrom(data.e),
          };
        }

        /** Ссылка из данных: у Avito — путь от «/». */
        function fullUrl(url) {
          return safeUrl(typeof url === 'string' && url.startsWith('/') ? 'https://www.avito.ru' + url : url);
        }

        /**
         * Смещение DISPLAY_TZ от UTC, мин: от сервера (c.z). В ссылках до c.z — догадка: блоки q начинаются в 00, 06,
         * 12 и 18 ч по нему — из смещений, кратных этому, берётся ближайшее к поясу телефона.
         */
        function displayOffset(series) {
          const own = -new Date().getTimezoneOffset();
          if (series && isNum(series.z)) return series.z;
          if (!series || !isNum(series.q0)) return own;
          const base = ((-series.q0 % 360) + 360) % 360;
          let best = base;
          for (let shift = -1440; shift <= 1440; shift += 360) {
            if (Math.abs(base + shift - own) < Math.abs(best - own)) best = base + shift;
          }
          return best;
        }

        /** Цель профиля: [id, название, порог ₽, включена, фото | 0, поиск по модели, кукол в продаже за 7 дней]. */
        function targetFromRow([id, name, priceRub, active, img, modelSearch, selling]) {
          return {
            id,
            name: String(name),
            priceRub: Number(priceRub) || 0,
            active: active === 1,
            img: safeUrl(img || null),
            modelSearch: modelSearch === 1,
            selling: Number(selling) || 0,
          };
        }

        /** Группа за сутки (g, 13 чисел): общие, модели или проверки страниц — интервал, замедление, очередь. */
        function groupFromRow(row) {
          return {
            group: row[0],
            urls: row[1],
            runs: row[2],
            ok: row[3],
            fresh: row[4],
            only: row[5],
            finds: row[6],
            every: row[7],
            target: row[8],
            slow: row[9],
            slowUntil: row[10],
            waitMedian: row[11],
            waitP90: row[12],
          };
        }

        /** Запрос за сутки (q): [запрос, обходов, удачных, найдено, новых, группа, только им, находок, цель | 0]. */
        function queryFromRow([query, runs, ok, found, fresh, group, only, finds, targetId]) {
          return { query: String(query), runs, ok, found, fresh, group, only, finds, targetId: targetId || null };
        }

        /**
         * Цена модели (m): медиана и минимум — дельтами по 10 ₽; кукол 0 — в этот день точки нет; short — в ссылку
         * вошли только последние 30 дней.
         */
        function modelFromRow([targetId, d0, medians, mins, counts, finds, selling, short]) {
          return {
            targetId,
            d0,
            median: ChartMath.undelta(medians || [], 10),
            min: ChartMath.undelta(mins || [], 10),
            counts: counts || [],
            finds: finds || [],
            selling: Array.isArray(selling) ? selling : null,
            short: short === 1,
          };
        }

        /**
         * Обход (r, 26 полей и необязательные); списки 22–25 — 0, если подробности не поместились в ссылку; 26 — итог
         * проверки страницы; 27–31 (с 06.10.2026) — браузер, картинки, передача, сеть и тип IP выхода.
         */
        function runFromRow(row, browsers = []) {
          return {
            id: row[0],
            minute: row[1],
            kind: row[2],
            about: row[3],
            outcome: row[4],
            found: row[5],
            fresh: row[6],
            cheaper: row[7],
            known: row[8],
            seconds: row[9],
            wait: row[10],
            exit: row[11],
            attempts: row[12],
            code: row[13] || 0,
            finds: row[14] || 0,
            page: row[15] || 1,
            flags: row[16] || 0,
            url: row[17],
            http: row[18] || 0,
            kb: row[19] || 0,
            thresholdRub: row[20] || 0,
            errorText: row[21] || null,
            freshIds: row[22] ?? 0,
            cheaperList: row[23] ?? 0,
            attemptList: row[24] ?? 0,
            findIds: row[25] ?? 0,
            check: pageCheckFrom(row[26]),
            // С 06.10.2026, только у обходов с браузером: браузер (строка br), картинки, передача, сеть выхода
            ...(row.length > 27
              ? {
                  browser: browsers[row[27]] || null,
                  media: has(row[28], 1) ? true : has(row[28], 2) ? false : null,
                  handedOver: has(row[28], 4),
                  handOverOf: row[29] || null,
                  asn: row[30] || null,
                  ipType: Number(row[31]) || 0,
                }
              : {}),
          };
        }

        /** Разбор классификатора: [тип, уверенность %, шт, предложение, подделка] | 0. */
        function verdictFromRow(row) {
          if (!Array.isArray(row)) return null;
          return {
            type: row[0],
            confidence: row[1],
            quantity: Math.max(1, Number(row[2]) || 1),
            offer: row[3],
            fake: row[4] === 1,
          };
        }

        /** Объявление словаря L; время — минуты Unix (в данных — минут до at). */
        function listingFromRow(row, atMinute) {
          const flags = Number(row[6]) || 0;
          return {
            id: row[0],
            url: fullUrl(row[1]),
            title: String(row[2] || ''),
            priceRub: row[3] === null || row[3] === undefined ? null : Number(row[3]),
            img: safeUrl(row[4] || null),
            targetId: row[5] || null,
            live: has(flags, 1),
            sent: has(flags, 2),
            within: has(flags, 4),
            lot: has(flags, 8),
            baseline: has(flags, 16),
            byModel: has(flags, 32),
            removed: has(flags, 64),
            watched: has(flags, 128),
            outcome: Number(row[7]) || 0,
            verdict: verdictFromRow(row[8]),
            firstSeen: atMinute - (Number(row[9]) || 0),
            lastSeen: atMinute - (Number(row[10]) || 0),
            sentAt: row[11] >= 0 ? atMinute - row[11] : null,
            // Истории цены и проверок ПК в профиле нет — строк «Цена не менялась» и «ещё не проверял» нет
            trail: null,
            checks: null,
            deal: dealFromRow(row[12]),
          };
        }

        return {
          dashboardFrom,
          profileFrom,
          exitFromRow,
          runFromRow,
          listingFromRow,
          modelFromRow,
          targetFromRow,
          groupFromRow,
          queryFromRow,
          verdictFromRow,
          dealFromRow,
          pageCheckFrom,
          budgetFrom,
          blocksFrom,
          chanceFrom,
          displayOffset,
          fullUrl,
        };
      })();
    </script>

    <script id="deal-view">
      /*

          const target = state.targets.find((t) => t.id === find.targetId);
          if (!target || !find.url) continue;
          const listing = target.listings.find((item) => item.id === find.listingId);
          if (listing) {
            if (!listing.img) listing.img = find.img;
            continue;
          }
          target.listings.unshift({
            id: find.listingId,
            url: find.url,
            title: find.title,
            priceRub: find.priceRub,
            img: find.img,
            firstSeen: null,
            lastSeen: null,
            removed: false,
            trail: [],
            deal: null,
          });
        }
      }

      function normalizeWatch(item) {
        return {
          id: item.id,
          title: String(item.title),
          priceRub: item.priceRub === null || item.priceRub === undefined ? null : Number(item.priceRub),
          url: safeUrl(item.url),
          img: safeUrl(item.img),
          ok: Boolean(item.ok),
          removed: Boolean(item.removed),
          thresholdRub: item.thresholdRub || null,
          targetName: item.targetName || null,
        };
      }

      /** Данные из ссылки кнопки: v2 (#z=, deflate-raw) или v1 (#t=, только цели). */
      async function fromHash() {
        const packed = /[#&]z=([A-Za-z0-9_-]+)/.exec(location.hash);
        if (packed) {
          if (typeof DecompressionStream === 'undefined') throw new Error('обновите Telegram — нужен новее WebView');
          const stream = new Blob([base64urlBytes(packed[1])])
            .stream()
            .pipeThrough(new DecompressionStream('deflate-raw'));
          const data = JSON.parse(await new Response(stream).text());
          if (data.k === 's') return statsFromLink(data);
          return {
            at: data.at || null,
            minRub: isNum(data.mp) ? data.mp : null,
            targets: data.t.map(
              ([id, name, priceRub, active, finds, img, stats, listings, activeCount, removedCount, market]) =>
                normalize({
                  id,
                  name,
                  priceRub,
                  active: active === 1,
                  finds,
                  img: img || null,
                  stats: stats ? { count: stats[0], min: stats[1], median: stats[2], max: stats[3] } : null,
                  listings: listings || [],
                  activeCount,
                  removedCount,
                  market: Array.isArray(market) ? { cheap: market[0], other: market[1], lots: market[2] } : null,
                }),
            ),
            watched: (data.w || []).map(watchFromRow),
            dashboard: dashboardFrom(data.d),
            // f — с 05.10.2026; в ссылках старее его нет.
            finds: (data.f || []).map((row) => findFromRow(row, data.at)),
          };
        }
        const plain = /[#&]t=([A-Za-z0-9_-]+)/.exec(location.hash);
        if (!plain) return null;
        const data = JSON.parse(new TextDecoder().decode(base64urlBytes(plain[1])));
        return {
          at: null,
          watched: [],
          finds: [],
          targets: data.t.map(([id, name, priceRub, active]) =>
            normalize({ id, name, priceRub, active: active === 1 }),
          ),
        };
      }

      /** Ссылка кнопки табло «Обходы и графики» (k: 's'): только профиль статистики, целей для правок нет. */
      function statsFromLink(data) {
        return {
          stats: true,
          at: data.at || null,
          targets: [],
          watched: [],
          dashboard: null,
          finds: (data.f || []).map((row) => findFromRow(row, data.at)),
          profile: profileFrom(data),
        };
      }

      /** Начало дня DISPLAY_TZ (номер дня) — минута Unix. */
      const dayMinute = (p, day) => day * 1440 - p.offset;

      /** Находка, которой нет в словаре L, — как объявление профиля. */
      function findListing(find) {
        const lot = { type: 1, confidence: 0, quantity: find.quantity, offer: 0, fake: false };
        return {
          id: find.listingId,
          url: find.url,
          title: find.title,
          priceRub: find.priceRub,
          img: find.img,
          targetId: find.targetId,
          live: true,
          sent: true,
          within: true,
          lot: find.quantity > 1,
          baseline: false,
          byModel: false,
          removed: false,
          watched: false,
          outcome: 0,
          verdict: find.quantity > 1 ? lot : null,
          firstSeen: null,
          lastSeen: null,
          sentAt: find.found,
          trail: null,
          checks: null,
          deal: null,
        };
      }

      function profileTarget(id) {
        return state.profile ? state.profile.targets.get(id) || null : null;
      }

      function profileModel(id) {
        return state.profile ? state.profile.models.find((model) => model.targetId === id) || null : null;
      }

      function profileRun(id) {
        return state.profile ? state.profile.runs.find((run) => run.id === id) || null : null;
      }

      /** Объявление профиля (словарь L) или находка, которой в нём нет; нет — null. */
      function profileItem(id, targetId) {
        const listing = state.profile ? state.profile.listings.get(id) : null;
        if (listing) return listing;
        const find = state.finds.find((item) => item.listingId === id && (!targetId || item.targetId === targetId));
        return find ? findListing(find) : null;
      }

      /** Название цели: из целей ссылки «Цели» или из профиля статистики. */
      function targetName(id) {
        const target = findTarget(id) || profileTarget(id);
        return target ? target.name : 'модель ' + id;
      }

      /** Цель профиля или заглушка (цель удалили, в данных её нет). */
      function lightTarget(p, id) {
        const target = p.targets.get(id);
        if (target) return target;
        return { id, name: targetName(id), priceRub: 0, active: false, img: null, modelSearch: false, selling: 0 };
      }

      function current(target) {
        const change = state.dirty.get(target.id) || {};
        return {
          priceRub: change.priceRub ?? target.priceRub,
          active: change.active ?? target.active,
        };
      }

      function thumb(target, className) {
        const color = 'hsl(' + ([...target.name].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % 360) + ' 45% 50%)';
        const placeholder = () => {
          // Первая буква без смайликов старых ссылок: у заголовка со смайликом в начале — буква, а не половина эмодзи
          const initial = [...RunText.plain(String(target.name)).trim()][0] || '?';
          const box = el('div', className + ' placeholder', initial.toUpperCase());
          box.style.background = color;
          return box;
        };
        if (!target.img) return placeholder();
        const img = el('img', className);
        img.src = target.img;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => img.replaceWith(placeholder()));
        return img;
      }

      function priceBox(target) {
        const box = el('label', 'price');
        const input = el('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '1';
        input.step = 'any';
        input.value = String(current(target).priceRub);
        input.disabled = state.readOnly;
        input.addEventListener('change', () => edit(target, { priceRub: Number(input.value) }));
        box.append(input, '₽');
        return box;
      }

      function toggle(target) {
        const label = el('label', 'switch');
        const box = el('input');
        box.type = 'checkbox';
        box.checked = current(target).active;
        box.disabled = state.readOnly;
        box.addEventListener('change', () => edit(target, { active: box.checked }));
        label.append(box, el('span'));
        return label;
      }

      /** «12 в продаже · медиана 3 000 ₽ · 2 находки» (медиана — от 3 кукол рынка, меньше — «мало данных»). */
      function subline(target) {
        const parts = [];
        if (target.activeCount > 0) parts.push(fmt(target.activeCount) + ' в продаже');
        if (target.stats && target.stats.count < 3) parts.push('мало данных (' + target.stats.count + ')');
        else if (target.stats) parts.push('медиана ' + rub(target.stats.median));
        if (target.finds > 0) parts.push(countText(target.finds, 'находка', 'находки', 'находок'));
        if (target.id < 0) parts.push('новая');
        return parts.join(' · ');
      }

      /**
       * Находки, которые подходят сейчас, с учётом несохранённых правок: цель на паузе, удалена или порог ниже цены
       * (у лота — за штуку) — точки нет, как не будет её и в чате после сохранения.
       */
      function liveFinds() {
        return state.finds.filter((find) => {
          const target = findTarget(find.targetId);
          // Только профиль статистики (кнопка табло): целей для правок нет — находки как в данных
          if (!target) return state.statsOnly;
          if (state.deleted.has(target.id)) return false;
          const now = current(target);
          return now.active && find.unitRub <= now.priceRub;
        });
      }

      /** Подходящая сейчас находка с этим объявлением (у этой цели; без targetId — у любой) или null. */
      function liveFind(listingId, targetId) {
        for (const find of liveFinds()) {
          if (find.listingId === listingId && (targetId === undefined || find.targetId === targetId)) return find;
        }
        return null;
      }

      /** Сколько прошло: «только что», «25 мин назад», «3 ч назад», «2 дн. назад». */
      function ago(minute) {
        const passed = Math.max(0, Math.floor(Date.now() / 60_000) - minute);
        if (passed < 1) return 'только что';
        if (passed < 60) return passed + ' мин назад';
        if (passed < 48 * 60) return Math.floor(passed / 60) + ' ч назад';
        return Math.floor(passed / 1440) + ' дн. назад';
      }

      function pulse() {
        const dot = el('span', 'pulse');
        dot.setAttribute('aria-hidden', 'true');
        return dot;
      }

      /** Миниатюра с пульсирующей точкой в углу: объявление подходит сейчас. */
      function liveThumb(item) {
        const wrap = el('div', 'thumb-wrap');
        wrap.append(thumb(item, 'thumb'), pulse());
        return wrap;
      }

      /** Точка и число у названия модели: сколько её объявлений подходят сейчас. */
      function liveBadge(count) {
        const badge = el('span', 'live-badge');
        badge.title = 'Подходят сейчас: ' + count;
        badge.append(pulse(), String(count));
        return badge;
      }

      /** Уровень «шанса» словом (чип без числа и легенда). */
      const LEVEL_TEXT = { hot: 'горячее', neutral: 'обычное', warn: 'проверьте' };

      /**
       * Уровень объявления у модели (аудит 05.10.2026, К5): по «шансу» и признакам сервера (DealRow); без них (ссылки
       * до 05.10.2026, «Слежу») — по цене за штуку к порогу. Снятое — без уровня.
       */
      function listingLevel(listing, thresholdRub) {
        if (!listing || listing.removed) return null;
        if (listing.deal) return DealView.levelOf(listing.deal);
        return DealView.fallbackLevel({
          unitRub: unitPrice(listing),
          thresholdRub: Number(thresholdRub) || 0,
          minRub: state.minRub,
          lastSeen: listing.lastSeen,
          nowMinute: nowMinute(),
        });
      }

      /** Класс строки по уровню: горячее и «проверьте» — цветом, обычное и без уровня — без цвета. */
      const levelClass = (level) => (level === 'hot' || level === 'warn' ? level : '');

      /** Чип «шанс 82» цветом уровня; «шанса» нет — уровень словом (только горячее и «проверьте»); иначе null. */
      function chanceChip(deal, level) {
        const hasScore = Boolean(deal) && deal.score !== null;
        if (!hasScore && !levelClass(level)) return null;
        const text = hasScore ? 'шанс ' + deal.score : LEVEL_TEXT[level];
        const chip = el('span', 'chance' + (levelClass(level) ? ' ' + level : ''), text);
        const reasons = DealView.reasonsOf(deal).map((reason) => reason.text);
        if (reasons.length > 0) chip.title = reasons.join(', ');
        return chip;
      }

      /** Пометки признаков у объявления: лот, цена в описании, не кукла этой модели. */
      function dealNotes(deal) {
        if (!deal) return [];
        const notes = [];
        if (deal.quantity > 1) notes.push('лот ×' + deal.quantity);
        else if (deal.role === 1 || has(deal.flags, DealView.FLAG.lot)) notes.push('лот');
        if (deal.descRub > 0) notes.push('в описании ' + rub(deal.descRub));
        if (deal.role === 2) notes.push('не кукла модели');
        return notes;
      }

      /** Скрытое из списка модели (рынок кукол, К4): «скрыто 3 дешевле 1 000 ₽, 2 не кукла модели · 4 лота». */
      function marketNote(market, thresholdRub) {
        if (!market) return '';
        const floor = thresholdRub >= MIN_PRICE_RUB ? Math.min(state.minRub, thresholdRub / 2) : state.minRub;
        const hidden = [];
        if (market.cheap > 0) hidden.push(market.cheap + ' дешевле ' + rub(floor));
        if (market.other > 0) hidden.push(market.other + ' не кукла модели');
        const parts = hidden.length > 0 ? ['скрыто ' + hidden.join(', ')] : [];
        if (market.lots > 0) parts.push(countText(market.lots, 'лот', 'лота', 'лотов'));
        return parts.join(' · ');
      }

      /** Чип «шанса», «новое» и пометки — строкой чипов; нечего показать — null. */
      function dealTags(deal, level, fresh) {
        const chip = chanceChip(deal, level);
        const notes = dealNotes(deal);
        if (!chip && !fresh && notes.length === 0) return null;
        const box = el('span', 'vchips');
        if (chip) box.append(chip);
        if (fresh) box.append(el('span', 'vchip fresh', 'новое'));
        for (const note of notes) box.append(el('span', 'vchip', note));
        return box;
      }

      /** Свежее объявление (впервые видели до 6 ч назад): флаг сервера, в старых ссылках — по времени. */
      function isFresh(listing) {
        if (!listing || listing.removed) return false;
        if (listing.deal) return DealView.isFresh(listing.deal);
        return Boolean(listing.firstSeen) && nowMinute() - listing.firstSeen <= 6 * 60;
      }

      /** Легенда цветов списков: горячее, обычное, «проверьте», подходит сейчас (пульс). */
      function dotLegend() {
        const box = el('div', 'dot-legend');
        for (const level of ['hot', 'neutral', 'warn']) {
          const item = el('span');
          item.append(el('i', levelClass(level)), LEVEL_TEXT[level]);
          box.append(item);
        }
        const live = el('span');
        live.append(pulse(), 'подходит сейчас');
        box.append(live);
        return box;
      }

      /** «Шанс» на странице объявления: число, уровень, причины по важности (красные флаги — цветом). */
      function chancePanel(deal, level) {
        const panel = el('div', 'panel');
        const head = el('div', 'stat');
        head.append(el('span', 'muted', 'Шанс'));
        const score = deal.score === null ? '—' : deal.score + ' из 100';
        const text = level ? score + ' · ' + LEVEL_TEXT[level] : score;
        head.append(el('b', levelClass(level) ? 'cost ' + level : '', text));
        panel.append(head);
        const reasons = DealView.reasonsOf(deal);
        const notes = dealNotes(deal);
        if (reasons.length > 0 || notes.length > 0) {
          const list = el('ul', 'reasons');
          for (const reason of reasons) list.append(el('li', reason.red ? 'red' : '', reason.text));
          for (const note of notes) list.append(el('li', '', note));
          panel.append(list);
        }
        return panel;
      }

      /** Ранг находки «Подходят сейчас» по уровню: горячее, обычное (и без «шанса»), «проверьте». */
      const FIND_RANK = { hot: 0, neutral: 1, warn: 2 };
      const findRank = (find) => (find.chance && find.chance.level ? FIND_RANK[find.chance.level] : 1);

      /**
       * Находки, которые подходят сейчас, по объявлениям: объявление под две цели — одна строка с обеими моделями.
       * Порядок — по «шансу» (горячие сверху, затем выше «шанс»), затем свежее.
       */
      function findGroups() {
        const groups = new Map();
        for (const find of liveFinds()) {
          const name = targetName(find.targetId);
          const group = groups.get(find.listingId);
          if (group) group.models.push(name);
          else groups.set(find.listingId, { find, models: [name] });
        }
        const score = (find) => (find.chance ? find.chance.score : -1);
        return [...groups.values()].sort(
          (a, b) => findRank(a.find) - findRank(b.find) || score(b.find) - score(a.find) || b.find.found - a.find.found,
        );
      }

      /** Блок «Подходят сейчас (N)» сверху вкладки «Модели»: объявление — одна строка (под две цели — обе модели). */
      function renderFinds() {
        const groups = findGroups();
        fillFinds($('finds'), groups);
        $('tabLive').textContent = '';
        if (groups.length > 0) $('tabLive').append(pulse());
      }

      /** Блок находок: вкладки «Модели» и «Обходы» профиля статистики. */
      function fillFinds(box, groups) {
        box.textContent = '';
        box.hidden = groups.length === 0;
        if (groups.length === 0) return;
        const head = el('div', 'finds-head');
        head.append(pulse(), el('span', '', 'Подходят сейчас (' + groups.length + ')'));
        box.append(head);
        for (const { find, models } of groups) {
          const row = el('button', 'frow');
          row.type = 'button';
          const info = el('div', 'info');
          info.append(el('div', 'title', find.title));
          const sub = el('div', 'sub', models.join(', ') + ' · ' + ago(find.found));
          // «Шанс» находки (с 05.10.2026): число цветом уровня
          if (find.chance) {
            const deal = { score: find.chance.score, flags: 0, reasons: [], quantity: 0, role: 0, descRub: 0 };
            const chip = chanceChip(deal, find.chance.level);
            if (chip) sub.append(chip);
          }
          info.append(sub);
          const cost = el('div', 'cost', rub(find.priceRub));
          if (find.quantity > 1) cost.append(el('div', 'sub', find.quantity + ' шт. по ' + rub(find.unitRub)));
          row.append(liveThumb({ name: find.title || '?', img: find.img }), info, cost);
          row.addEventListener('click', () => openFind(find));
          box.append(row);
        }
      }

      /** Время данных: сегодня — «21:11», раньше — «04.10, 21:11». */
      function dataTime(at) {
        const date = new Date(at * 1000);
        const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        if (date.toDateString() === new Date().toDateString()) return time;
        return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ', ' + time;
      }

      /** Плашка сверху: данные из ссылки старше 30 минут (с сервера — всегда свежие, без плашки). */
      function renderStale() {
        const stale = state.offline && state.at && Date.now() - state.at * 1000 > STALE_MINUTES * 60_000;
        $('stale').hidden = !stale;
        if (!stale) return;
        // Только просмотр: «Обновить» шлёт sendData — не сработает; свежие данные — в кнопке, открытой заново.
        const why = state.readOnly ? ', откройте заново' : '';
        $('staleText').textContent = 'Данные ' + dataTime(state.at) + ' могли устареть' + why;
        $('refresh').hidden = state.readOnly;
        // Несохранённые правки уходят вместе с обновлением — как при «Сохранить».
        $('refresh').textContent = pendingCount() ? 'Сохранить и обновить' : 'Обновить';
      }

      function renderList() {
        const list = $('list');
        list.textContent = '';
        const filter = state.filter.trim().toLowerCase();
        const all = state.targets.concat(state.added);
        const shown = all.filter((t) => !filter || t.name.toLowerCase().includes(filter));
        const kept = state.targets.filter((t) => !state.deleted.has(t.id));
        const view = state.readOnly ? ' · просмотр' : '';
        $('count').textContent = kept.filter((t) => current(t).active).length + ' из ' + kept.length + view;
        $('hint').textContent = state.at ? 'данные ' + dataTime(state.at) : '';
        if (shown.length === 0) list.append(el('div', 'empty muted', all.length ? 'Не найдено' : 'Моделей нет'));
        // Сколько объявлений модели подходят сейчас — точка и число у названия.
        const live = new Map();
        for (const find of liveFinds()) live.set(find.targetId, (live.get(find.targetId) || 0) + 1);
        for (const target of shown) {
          const deleted = state.deleted.has(target.id);
          const now = current(target);
          const row = el('div', 'row');
          if (!now.active) row.classList.add('paused');
          if (state.dirty.has(target.id) || target.id < 0) row.classList.add('dirty');
          if (deleted) row.classList.add('deleted');
          const open = el('div', 'open');
          const info = el('div', 'info');
          const name = el('div', 'name', target.name);
          if (live.get(target.id)) name.append(liveBadge(live.get(target.id)));
          info.append(name);
          const sub = subline(target);
          if (sub) info.append(el('div', 'sub', sub));
          open.append(thumb(target, 'thumb'), info);
          open.addEventListener('click', () => showDetail(target.id));
          row.append(open);
          if (deleted) {
            const undo = el('button', 'ghost small', 'Вернуть');
            undo.type = 'button';
            undo.addEventListener('click', () => {
              state.deleted.delete(target.id);
              haptic('select');
              render();
            });
            row.append(undo);
          } else {
            row.append(priceBox(target), toggle(target));
          }
          list.append(row);
        }
      }

      function isWatched(listingId) {
        if (state.watchAdd.has(listingId)) return true;
        return state.watched.some((item) => item.id === listingId) && !state.watchRemove.has(listingId);
      }

      /** «Следить» у объявления: следить (добавится при сохранении) или больше не следить. */
      function toggleWatch(offer) {
        if (!offer.id || state.readOnly) return;
        if (state.watchAdd.has(offer.id)) state.watchAdd.delete(offer.id);
        else if (state.watched.some((item) => item.id === offer.id)) {
          if (state.watchRemove.has(offer.id)) state.watchRemove.delete(offer.id);
          else state.watchRemove.add(offer.id);
        } else state.watchAdd.set(offer.id, offer);
        haptic('select');
        render();
      }

      function watchedCount() {
        return state.watched.filter((item) => !state.watchRemove.has(item.id)).length + state.watchAdd.size;
      }

      /** Закладка «Следить»: залита — слежу (или добавится при сохранении), пустая — не слежу. */
      function watchToggle(item) {
        const on = isWatched(item.id);
        const button = el('button', 'watch-toggle' + (on ? ' on' : ''));
        button.type = 'button';
        button.setAttribute('aria-label', on ? 'Не следить' : 'Следить');
        button.setAttribute('aria-pressed', String(on));
        button.append(icon('bookmark'));
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleWatch(item);
        });
        return button;
      }

      function renderWatch() {
        const list = $('watchList');
        list.textContent = '';
        const pending = [...state.watchAdd.values()].map((offer) => ({
          id: offer.id,
          title: offer.title,
          priceRub: offer.priceRub,
          url: offer.url,
          img: offer.img,
          ok: false,
          removed: false,
          adding: true,
        }));
        const items = pending.concat(state.watched);
        if (items.length === 0) list.append(el('div', 'empty muted', 'Список пуст'));
        for (const item of items) {
          const row = el('div', 'wrow');
          if (item.ok) row.classList.add('ok');
          if (item.removed) row.classList.add('removed');
          if (item.adding) row.classList.add('adding');
          if (state.watchRemove.has(item.id)) row.classList.add('pending');
          const info = el('div', 'info');
          info.append(el('div', 'name', item.title));
          const sub = item.adding
            ? 'добавится при сохранении'
            : item.removed
              ? 'снято'
              : item.targetName
                ? (item.ok ? 'проходит · ' : 'дороже порога · ') + item.targetName + ' до ' + rub(item.thresholdRub)
                : 'модели нет';
          info.append(el('div', 'sub', sub));
          const cost = el(
            'div',
            'cost',
            item.removed
              ? '—'
              : item.priceRub === null || item.priceRub === undefined
                ? 'без цены'
                : rub(item.priceRub),
          );
          const image = { name: item.title, img: item.img };
          const live = !item.removed && liveFind(item.id);
          row.append(live ? liveThumb(image) : thumb(image, 'thumb'), info, cost);
          if (!state.readOnly) row.append(watchToggle(item));
          row.addEventListener('click', () => (item.adding ? openLink(item.url) : showWatchItem(item.id)));
          list.append(row);
        }
      }

      function renderDetail(target) {
        const view = $('detailView');
        view.textContent = '';
        const deleted = state.deleted.has(target.id);
        const first = target.listings.find((listing) => !listing.removed && listing.id);
        const hero = thumb(target, 'hero');
        if (first) {
          hero.style.cursor = 'pointer';
          hero.addEventListener('click', () => showItem(target.id, first.id));
        }
        view.append(hero, el('h2', '', target.name));
        if (deleted) view.append(el('div', 'error', 'Удалится при сохранении'));

        const controls = el('div', 'panel');
        const row = el('div', 'row');
        if (!current(target).active) row.classList.add('paused');
        const label = el('div', 'info');
        label.append(
          el('div', 'name', 'Порог'),
          el('div', 'sub', current(target).active ? 'поиск включён' : 'на паузе'),
        );
        row.append(label, priceBox(target), toggle(target));
        controls.append(row);
        view.append(controls);

        const stats = el('div', 'panel');
        const line = (name, value) => {
          const item = el('div', 'stat');
          item.append(el('span', 'muted', name), el('b', '', value));
          stats.append(item);
        };
        if (target.stats) {
          // Рынок кукол модели (аудит 05.10.2026, К4): отдельные куклы без дублей, лотов и мусора; медиана — от 3
          line('Кукол за 30 дней', fmt(target.stats.count));
          line('Цены', rub(target.stats.min) + ' – ' + rub(target.stats.max));
          if (target.stats.count < 3) {
            line('Медиана', 'мало данных (' + target.stats.count + ')');
          } else {
            line('Медиана', rub(target.stats.median));
            const diff = Math.round(((target.stats.median - current(target).priceRub) * 100) / target.stats.median);
            let versus = 'на медиане';
            if (diff > 0) versus = diff + ' % ниже';
            if (diff < 0) versus = -diff + ' % выше';
            line('К медиане', versus);
          }
        } else {
          stats.append(el('div', 'muted', target.id < 0 ? 'Сводка — после сохранения' : 'Нет данных за 30 дней'));
        }
        line('Находок', fmt(target.finds));
        const liveHere = liveFinds().filter((find) => find.targetId === target.id).length;
        if (liveHere > 0) line('Подходят сейчас', String(liveHere));
        view.append(stats);

        const listingsPanel = el('div', 'panel');
        const threshold = current(target).priceRub;
        const shownActive = target.listings.filter((listing) => !listing.removed).length;
        const shownRemoved = target.listings.length - shownActive;
        const selling = fmt(target.activeCount || shownActive) + ' в продаже';
        const gone = fmt(target.removedCount || shownRemoved) + ' снято';
        listingsPanel.append(el('div', 'muted', selling + ' · ' + gone), dotLegend());
        const skipped = marketNote(target.market, threshold);
        if (skipped) listingsPanel.append(el('div', 'muted', skipped));
        // Подходящие сейчас — сверху, снятые — внизу; остальные — по «шансу» (К5), затем дешевле за штуку
        const findOf = (listing) => (listing.removed ? null : liveFind(listing.id, target.id));
        const rows = target.listings.map((listing) => ({
          listing,
          find: findOf(listing),
          level: listingLevel(listing, threshold),
          deal: listing.deal,
          unitRub: unitPrice(listing),
        }));
        rows.sort(
          (a, b) =>
            Number(a.listing.removed) - Number(b.listing.removed) ||
            Number(Boolean(b.find)) - Number(Boolean(a.find)) ||
            (a.listing.removed ? 0 : DealView.compare(a, b)),
        );
        for (const { listing, find, level } of rows) {
          const item = el('div', 'offer');
          if (listing.removed) item.classList.add('removed');
          else if (find) item.classList.add('live');
          else if (levelClass(level)) item.classList.add(level);
