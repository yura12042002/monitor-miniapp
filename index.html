<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Цели</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: var(--tg-theme-bg-color, #ffffff);
        --text: var(--tg-theme-text-color, #111111);
        --hint: var(--tg-theme-hint-color, #8a8a8e);
        --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
        --accent: var(--tg-theme-button-color, #2481cc);
        --accent-text: var(--tg-theme-button-text-color, #ffffff);
        --link: var(--tg-theme-link-color, #2481cc);
        --danger: var(--tg-theme-destructive-text-color, #e53935);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 14px 96px;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.35 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        margin: 4px 0 2px;
        font-size: 20px;
      }
      h2 {
        margin: 12px 0 4px;
        font-size: 20px;
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--hint);
        font-size: 13px;
      }
      input {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 10px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
      }
      button.ghost {
        background: var(--card);
        color: var(--text);
      }
      button.danger {
        background: var(--card);
        color: var(--danger);
      }
      .search {
        width: 100%;
        margin: 10px 0 8px;
      }
      .bulk {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .bulk button {
        flex: 1;
        padding: 8px 6px;
        font-size: 14px;
      }
      .add {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .add input[name='name'] {
        flex: 1;
        min-width: 0;
      }
      .add input[name='price'] {
        width: 86px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        margin-bottom: 8px;
        background: var(--card);
        border-radius: 12px;
      }
      .row.paused .name {
        color: var(--hint);
      }
      .row.dirty {
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .row.deleted {
        opacity: 0.55;
      }
      .row.deleted .name {
        text-decoration: line-through;
      }
      .open {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }
      .thumb {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 10px;
        object-fit: cover;
        background: var(--bg);
      }
      .placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: #fff;
      }
      .info {
        min-width: 0;
        flex: 1;
      }
      .name {
        overflow-wrap: anywhere;
      }
      .sub {
        color: var(--hint);
        font-size: 12px;
        margin-top: 1px;
      }
      .price {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
      }
      .price input {
        width: 76px;
        text-align: right;
        background: var(--bg);
      }
      .switch {
        position: relative;
        width: 44px;
        height: 26px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 13px;
        background: var(--hint);
        transition: background 0.15s;
      }
      .switch span::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span::after {
        transform: translateX(18px);
      }
      .error {
        color: var(--danger);
        margin: 8px 0;
      }
      .empty {
        text-align: center;
        padding: 30px 0;
      }
      .hero {
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: 14px;
        object-fit: cover;
        background: var(--card);
        display: block;
      }
      .hero.placeholder {
        font-size: 64px;
      }
      .panel {
        background: var(--card);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 10px 0;
      }
      .panel .row {
        background: transparent;
        padding: 0;
        margin: 0;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
      }
      .stat b {
        font-weight: 600;
      }
      .offer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        cursor: pointer;
      }
      .offer + .offer {
        border-top: 1px solid var(--bg);
      }
      .offer .title {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        color: var(--link);
      }
      .offer .cost {
        flex: none;
        font-weight: 600;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="error" class="error" hidden></div>

    <section id="listView">
      <h1>Цели <span class="muted" id="count"></span></h1>
      <div class="muted" id="hint">
        Цена — до скольких ₽ покупать. Переключатель — слежу / пауза. Нажмите на модель — карточка.
      </div>
      <input class="search" id="search" type="search" placeholder="Поиск по названию" autocomplete="off" />
      <div class="bulk">
        <button type="button" class="ghost" id="allOn">✅ Включить все</button>
        <button type="button" class="ghost" id="allOff">⏸ Выключить все</button>
      </div>
      <form class="add" id="add">
        <input name="name" placeholder="Новая модель" autocomplete="off" required />
        <input name="price" type="number" inputmode="decimal" min="1" step="any" placeholder="₽" required />
        <button type="submit">+</button>
      </form>
      <div id="list"></div>
    </section>

    <section id="detailView" hidden></section>

    <script>
      const tg = window.Telegram && window.Telegram.WebApp;
      // Два режима: данные в ссылке (#z=… сжато, #t=… старый формат; правки — боту через sendData; ПК снаружи
      // не виден) или API через туннель (правки сразу).
      const state = {
        targets: [],
        dirty: new Map(),
        added: [],
        deleted: new Set(),
        filter: '',
        offline: false,
        at: null,
        view: null,
        nextNewId: -1,
      };
      const $ = (id) => document.getElementById(id);
      const rub = (value) => Number(value).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';
      const safeUrl = (value) => (typeof value === 'string' && /^https:\/\//.test(value) ? value : null);

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function showError(text) {
        $('error').textContent = text;
        $('error').hidden = !text;
      }

      function haptic(kind) {
        try {
          if (kind === 'select') tg.HapticFeedback.selectionChanged();
          else tg.HapticFeedback.notificationOccurred(kind);
        } catch {
          // вне Telegram вибрации нет
        }
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { 'Content-Type': 'application/json', Authorization: 'tma ' + tg.initData },
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'ошибка ' + response.status);
        return body;
      }

      function base64urlBytes(text) {
        const b64 = text.replace(/-/g, '+').replace(/_/g, '/');
        return Uint8Array.from(atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4)), (c) => c.charCodeAt(0));
      }

      function normalize(target) {
        return {
          id: target.id,
          name: String(target.name),
          priceRub: Number(target.priceRub),
          active: Boolean(target.active),
          finds: Number(target.finds) || 0,
          img: safeUrl(target.img),
          stats: target.stats || null,
          offers: (target.offers || [])
            .map((offer) => ({ ...offer, url: safeUrl(offer.url), img: safeUrl(offer.img) }))
            .filter((offer) => offer.url),
        };
      }

      /** Данные из ссылки кнопки: v2 (#z=, deflate-raw) или v1 (#t=, только цели). */
      async function fromHash() {
        const packed = /[#&]z=([A-Za-z0-9_-]+)/.exec(location.hash);
        if (packed) {
          if (typeof DecompressionStream === 'undefined') throw new Error('обновите Telegram — нужен новее WebView');
          const stream = new Blob([base64urlBytes(packed[1])])
            .stream()
            .pipeThrough(new DecompressionStream('deflate-raw'));
          const data = JSON.parse(await new Response(stream).text());
          return {
            at: data.at || null,
            targets: data.t.map(([id, name, priceRub, active, finds, img, stats, offers]) =>
              normalize({
                id,
                name,
                priceRub,
                active: active === 1,
                finds,
                img: img || null,
                stats: stats ? { count: stats[0], min: stats[1], median: stats[2], max: stats[3] } : null,
                offers: (offers || []).map(([url, title, offerRub, offerImg]) => ({
                  url,
                  title,
                  priceRub: offerRub,
                  img: offerImg || null,
                })),
              }),
            ),
          };
        }
        const plain = /[#&]t=([A-Za-z0-9_-]+)/.exec(location.hash);
        if (!plain) return null;
        const data = JSON.parse(new TextDecoder().decode(base64urlBytes(plain[1])));
        return {
          at: null,
          targets: data.t.map(([id, name, priceRub, active]) =>
            normalize({ id, name, priceRub, active: active === 1 }),
          ),
        };
      }

      function current(target) {
        const change = state.dirty.get(target.id) || {};
        return {
          priceRub: change.priceRub ?? target.priceRub,
          active: change.active ?? target.active,
        };
      }

      function thumb(target, className) {
        const color = 'hsl(' + ([...target.name].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % 360) + ' 45% 50%)';
        const placeholder = () => {
          const box = el('div', className + ' placeholder', (target.name.trim()[0] || '?').toUpperCase());
          box.style.background = color;
          return box;
        };
        if (!target.img) return placeholder();
        const img = el('img', className);
        img.src = target.img;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => img.replaceWith(placeholder()));
        return img;
      }

      function priceBox(target) {
        const box = el('label', 'price');
        const input = el('input');
        input.type = 'number';
        input.inputMode = 'decimal';
        input.min = '1';
        input.step = 'any';
        input.value = String(current(target).priceRub);
        input.addEventListener('change', () => edit(target, { priceRub: Number(input.value) }));
        box.append(input, '₽');
        return box;
      }

      function toggle(target) {
        const label = el('label', 'switch');
        const box = el('input');
        box.type = 'checkbox';
        box.checked = current(target).active;
        box.addEventListener('change', () => edit(target, { active: box.checked }));
        label.append(box, el('span'));
        return label;
      }

      function subline(target) {
        const parts = [];
        if (target.stats) parts.push('медиана ' + rub(target.stats.median) + ' · ' + target.stats.count + ' объявл.');
        if (target.finds > 0) parts.push('находок ' + target.finds);
        if (target.id < 0) parts.push('новая');
        return parts.join(' · ');
      }

      function renderList() {
        const list = $('list');
        list.textContent = '';
        const filter = state.filter.trim().toLowerCase();
        const all = state.targets.concat(state.added);
        const shown = all.filter((t) => !filter || t.name.toLowerCase().includes(filter));
        const kept = state.targets.filter((t) => !state.deleted.has(t.id));
        $('count').textContent = kept.filter((t) => current(t).active).length + ' из ' + kept.length;
        if (state.at) {
          const at = new Date(state.at * 1000).toLocaleString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
          });
          $('hint').textContent = 'Данные на ' + at + '. Нажмите на модель — карточка: фото, цены, объявления.';
        }
        if (shown.length === 0) {
          list.append(el('div', 'empty muted', all.length ? 'Ничего не нашлось' : 'Целей пока нет — добавьте первую'));
        }
        for (const target of shown) {
          const deleted = state.deleted.has(target.id);
          const now = current(target);
          const row = el('div', 'row');
          if (!now.active) row.classList.add('paused');
          if (state.dirty.has(target.id) || target.id < 0) row.classList.add('dirty');
          if (deleted) row.classList.add('deleted');
          const open = el('div', 'open');
          const info = el('div', 'info');
          info.append(el('div', 'name', target.name));
          const sub = subline(target);
          if (sub) info.append(el('div', 'sub', sub));
          open.append(thumb(target, 'thumb'), info);
          open.addEventListener('click', () => showDetail(target.id));
          row.append(open);
          if (deleted) {
            const undo = el('button', 'ghost', '↩ Вернуть');
            undo.type = 'button';
            undo.addEventListener('click', () => {
              state.deleted.delete(target.id);
              haptic('select');
              render();
            });
            row.append(undo);
          } else {
            row.append(priceBox(target), toggle(target));
          }
          list.append(row);
        }
      }

      function renderDetail(target) {
        const view = $('detailView');
        view.textContent = '';
        const deleted = state.deleted.has(target.id);
        const first = target.offers[0];
        const hero = thumb(target, 'hero');
        if (first) {
          hero.style.cursor = 'pointer';
          hero.addEventListener('click', () => openLink(first.url));
        }
        view.append(hero, el('h2', '', target.name));
        if (deleted) view.append(el('div', 'error', 'Будет удалена при сохранении.'));

        const controls = el('div', 'panel');
        const row = el('div', 'row');
        if (!current(target).active) row.classList.add('paused');
        const label = el('div', 'info');
        label.append(el('div', 'name', 'Покупать до'), el('div', 'sub', current(target).active ? 'слежу' : 'на паузе'));
        row.append(label, priceBox(target), toggle(target));
        controls.append(row);
        view.append(controls);

        const stats = el('div', 'panel');
        const line = (name, value) => {
          const item = el('div', 'stat');
          item.append(el('span', 'muted', name), el('b', '', value));
          stats.append(item);
        };
        if (target.stats) {
          line('Объявлений за 30 дней', String(target.stats.count));
          line('Цены', rub(target.stats.min) + ' – ' + rub(target.stats.max));
          line('Медиана', rub(target.stats.median));
          const diff = Math.round(((target.stats.median - current(target).priceRub) * 100) / target.stats.median);
          line(
            'Ваш порог',
            diff > 0 ? 'ниже медианы на ' + diff + ' %' : diff < 0 ? 'выше медианы на ' + -diff + ' %' : 'на медиане',
          );
        } else {
          stats.append(
            el(
              'div',
              'muted',
              target.id < 0
                ? 'Новая модель — сводка появится после сохранения.'
                : 'Объявлений с этой моделью за 30 дней пока нет (или они не поместились в ссылку — смотрите в чате).',
            ),
          );
        }
        line('Находок прислано', String(target.finds));
        view.append(stats);

        if (target.offers.length > 0) {
          const offers = el('div', 'panel');
          offers.append(el('div', 'muted', 'Дешевле всего сейчас'));
          for (const offer of target.offers) {
            const item = el('div', 'offer');
            if (offer.img) item.append(thumb({ name: offer.title, img: offer.img }, 'thumb'));
            item.append(el('div', 'title', offer.title), el('div', 'cost', rub(offer.priceRub)));
            item.addEventListener('click', () => openLink(offer.url));
            offers.append(item);
          }
          view.append(offers);
        }

        const actions = el('div', 'actions');
        if (state.offline && target.id > 0) {
          const chat = el('button', '', '📈 История цен и все объявления — в чат');
          chat.type = 'button';
          chat.addEventListener('click', () => save(target.id));
          actions.append(chat);
        }
        const remove = el('button', 'danger', deleted ? '↩ Не удалять' : '🗑 Удалить цель');
        remove.type = 'button';
        remove.addEventListener('click', () => toggleDelete(target));
        actions.append(remove);
        view.append(actions);
      }

      function render() {
        showError('');
        const target = state.view === null ? null : findTarget(state.view);
        $('listView').hidden = Boolean(target);
        $('detailView').hidden = !target;
        if (target) {
          renderDetail(target);
          tg.BackButton.show();
        } else {
          state.view = null;
          renderList();
          tg.BackButton.hide();
        }
        updateMainButton();
      }

      function findTarget(id) {
        return state.targets.concat(state.added).find((t) => t.id === id) || null;
      }

      function showDetail(id) {
        state.view = id;
        haptic('select');
        render();
        window.scrollTo(0, 0);
      }

      function openLink(url) {
        if (!url) return;
        try {
          tg.openLink(url);
        } catch {
          window.open(url, '_blank', 'noopener');
        }
      }

      function toggleDelete(target) {
        if (target.id < 0) {
          state.added = state.added.filter((t) => t !== target);
          state.view = null;
          haptic('select');
          return render();
        }
        if (state.deleted.has(target.id)) {
          state.deleted.delete(target.id);
          haptic('select');
          return render();
        }
        const apply = (ok) => {
          if (!ok) return;
          state.deleted.add(target.id);
          state.dirty.delete(target.id);
          state.view = null;
          haptic('warning');
          render();
        };
        const question = 'Удалить «' + target.name + '»? Находки и история цен останутся. Удалится при сохранении.';
        try {
          tg.showConfirm(question, apply);
        } catch {
          apply(window.confirm(question));
        }
      }

      function edit(target, patch) {
        if (target.id < 0) {
          // Новая (ещё не сохранённая) цель — правим её саму.
          Object.assign(target, patch);
          haptic('select');
          return render();
        }
        const change = { ...(state.dirty.get(target.id) || {}), ...patch };
        if (change.priceRub === target.priceRub) delete change.priceRub;
        if (change.active === target.active) delete change.active;
        if (Object.keys(change).length) state.dirty.set(target.id, change);
        else state.dirty.delete(target.id);
        haptic('select');
        render();
      }

      function setAll(active) {
        const filter = state.filter.trim().toLowerCase();
        for (const target of state.targets.concat(state.added)) {
          if (state.deleted.has(target.id)) continue;
          if (filter && !target.name.toLowerCase().includes(filter)) continue;
          if (target.id < 0) target.active = active;
          else {
            const change = { ...(state.dirty.get(target.id) || {}), active };
            if (change.active === target.active) delete change.active;
            if (Object.keys(change).length) state.dirty.set(target.id, change);
            else state.dirty.delete(target.id);
          }
        }
        haptic('select');
        render();
      }

      function pendingCount() {
        return state.dirty.size + state.added.length + state.deleted.size;
      }

      function updateMainButton() {
        const count = pendingCount();
        if (count === 0) return tg.MainButton.hide();
        tg.MainButton.setText('Сохранить (' + count + ')');
        tg.MainButton.show();
      }

      /** Сохранить. openId — после сохранения бот пришлёт в чат карточку этой цели. */
      async function save(openId) {
        const invalid = [...state.dirty.values()].find(
          (change) => change.priceRub !== undefined && !(change.priceRub > 0),
        );
        if (invalid) return showError('Цена должна быть больше нуля');
        if (state.added.some((t) => !(t.priceRub > 0))) return showError('Цена новой модели должна быть больше нуля');
        if (state.offline) {
          const data = {
            v: 1,
            c: [...state.dirty]
              .filter(([id]) => !state.deleted.has(id))
              .map(([id, change]) => [
                id,
                change.priceRub ?? null,
                change.active === undefined ? null : change.active ? 1 : 0,
              ]),
            n: state.added.map((target) => [target.name, target.priceRub]),
          };
          if (state.deleted.size > 0) data.d = [...state.deleted];
          if (typeof openId === 'number') data.o = openId;
          const payload = JSON.stringify(data);
          if (new TextEncoder().encode(payload).length > 4096)
            return showError('Слишком много правок за раз — сохраните частями');
          tg.sendData(payload); // Telegram закрывает приложение, бот применяет правки и присылает ответ
          return;
        }
        tg.MainButton.showProgress();
        try {
          for (const [id, change] of state.dirty) {
            if (state.deleted.has(id)) continue;
            await api('/api/targets/' + id, { method: 'POST', body: JSON.stringify(change) });
          }
          for (const target of state.added) {
            await api('/api/targets', {
              method: 'POST',
              body: JSON.stringify({ name: target.name, priceRub: target.priceRub }),
            });
          }
          for (const id of state.deleted) await api('/api/targets/' + id + '/delete', { method: 'POST' });
          state.dirty.clear();
          state.added = [];
          state.deleted.clear();
          haptic('success');
          await load();
        } catch (error) {
          showError('Не сохранилось: ' + error.message);
          haptic('error');
        } finally {
          tg.MainButton.hideProgress();
        }
      }

      async function load() {
        const body = await api('/api/targets');
        state.at = body.at || null;
        state.targets = body.targets.map(normalize);
        render();
      }

      $('search').addEventListener('input', (event) => {
        state.filter = event.target.value;
        renderList();
      });
      $('allOn').addEventListener('click', () => setAll(true));
      $('allOff').addEventListener('click', () => setAll(false));

      $('add').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.target;
        const name = form.elements.name.value.trim();
        const priceRub = Number(form.elements.price.value);
        if (!name || !(priceRub > 0)) return showError('Нужны название и цена больше нуля');
        state.added.push(normalize({ id: state.nextNewId--, name, priceRub, active: true }));
        form.reset();
        haptic('select');
        render();
      });

      async function start() {
        let fromLink = null;
        try {
          fromLink = await fromHash();
        } catch (error) {
          if (/[#&][zt]=/.test(location.hash)) {
            document.body.textContent = 'Не удалось прочитать список: ' + error.message;
            return;
          }
        }
        if (!tg || (!fromLink && !tg.initData)) {
          document.body.textContent = 'Откройте «Цели» кнопкой «📋 Цели» в чате с ботом.';
          return;
        }
        tg.ready();
        tg.expand();
        tg.MainButton.onClick(() => save());
        tg.BackButton.onClick(() => {
          state.view = null;
          render();
        });
        if (fromLink) {
          state.offline = true;
          state.at = fromLink.at;
          state.targets = fromLink.targets;
          render();
        } else {
          load().catch((error) => showError('Не загрузилось: ' + error.message));
        }
      }

      start();
    </script>
  </body>
</html>
