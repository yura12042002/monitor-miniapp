          else if (!level && listing.priceRub !== null && listing.priceRub <= threshold) item.classList.add('ok');
          const image = { name: listing.title || '?', img: listing.img };
          item.append(find ? liveThumb(image) : thumb(image, 'thumb'));
          const info = el('div', 'info');
          info.append(el('div', 'title', listing.title));
          const when = listing.removed
            ? 'снято · видели ' + minuteDate(listing.lastSeen)
            : find
              ? 'подходит сейчас · в чате ' + ago(find.found)
              : 'с ' + minuteDate(listing.firstSeen) + (listing.trail.length > 1 ? ' · цена менялась' : '');
          info.append(el('div', 'when', when));
          const tags = listing.removed ? null : dealTags(listing.deal, level, isFresh(listing));
          if (tags) info.append(tags);
          item.append(info, el('div', 'cost', listing.priceRub === null ? '—' : rub(listing.priceRub)));
          if (listing.id && !listing.removed && !state.readOnly) item.append(watchToggle(listing));
          item.addEventListener('click', () => showItem(target.id, listing.id));
          listingsPanel.append(item);
        }
        const total = target.activeCount + target.removedCount;
        if (target.listings.length === 0) {
          listingsPanel.append(el('div', 'muted', 'Объявлений за 30 дней нет'));
        } else if (total > target.listings.length) {
          listingsPanel.append(el('div', 'muted', 'Показано ' + target.listings.length + ' из ' + fmt(total)));
        }
        view.append(listingsPanel);

        const actions = el('div', 'actions');
        // График цены — из профиля статистики (кнопка табло, серверный режим); цен модели по дням нет — кнопки нет
        if (target.id > 0 && profileModel(target.id)) {
          const chart = el('button', 'ghost', 'График цены');
          chart.type = 'button';
          chart.addEventListener('click', () => openScreen({ type: 'price', targetId: target.id }));
          actions.append(chart);
        }
        // Только просмотр: «в чат» — тоже sendData, удаление — правка
        if (state.offline && target.id > 0 && !state.readOnly) {
          const chat = el('button', '', 'История в чат');
          chat.type = 'button';
          chat.addEventListener('click', () => save({ openId: target.id }));
          actions.append(chat);
        }
        if (!state.readOnly) {
          const remove = el('button', 'danger', deleted ? 'Не удалять' : 'Удалить модель');
          remove.type = 'button';
          remove.addEventListener('click', () => toggleDelete(target));
          actions.append(remove);
        }
        view.append(actions);
      }

      /** Экран объявления: фото крупно, цена (цвет — по уровню), история цены, ссылка, «Следить», история в чат. */
      function renderItem(target, listing) {
        renderItemView(listing, { name: target.name, threshold: current(target).priceRub, targetId: target.id });
      }

      /** Итог проверки ПК кодом: цена (0 — её показывает строка), снято, заглушка, не разобрана, не открылась. */
      const CHECK_TEXT = ['', 'снято', 'заглушка Avito', 'не разобрана', 'не открылась'];

      /**
       * Страница объявления; ctx — цель (название, порог и id — у объявлений модели) или null, если подходящей цели
       * нет.
       */
      function renderItemView(listing, ctx) {
        const view = $('detailView');
        view.textContent = '';
        const hero = thumb({ name: listing.title || '?', img: listing.img }, 'hero');
        if (listing.removed) hero.classList.add('gone');
        view.append(hero, el('h2', '', listing.title));
        const threshold = ctx && ctx.threshold ? ctx.threshold : null;
        const ok = !listing.removed && listing.priceRub !== null && threshold !== null && listing.priceRub <= threshold;
        // Цвет — по «шансу» (К5): горячее — зелёным, «проверьте» — жёлтым; без «шанса» и порога — по цене к порогу
        const level = listingLevel(listing, threshold);
        const price = el('div', 'big-price', listing.priceRub === null ? 'без цены' : rub(listing.priceRub));
        if (listing.removed) price.classList.add('gone');
        else if (levelClass(level)) price.classList.add(level);
        else if (!level && ok) price.classList.add('ok');
        view.append(price);
        if (listing.deal && !listing.removed) view.append(chancePanel(listing.deal, level));
        const find = listing.removed ? null : liveFind(listing.id, (ctx && ctx.targetId) || undefined);
        if (find) {
          const note = el('div', 'live-note');
          const lot = find.quantity > 1 ? ' (' + find.quantity + ' шт. по ' + rub(find.unitRub) + ')' : '';
          note.append(pulse(), el('span', '', 'Подходит сейчас' + lot + ' · в чате ' + ago(find.found)));
          view.append(note);
        }
        if (listing.removed) {
          view.append(el('div', 'gone-banner', 'Снято · видели ' + minuteDate(listing.lastSeen)));
        } else if (ctx && threshold !== null) {
          // «Проверьте» (К5): по цене проходит, но красный флаг или низкий «шанс»
          let verdict = ok ? statusEl('Проходит', 'ok') : statusEl('Дороже порога', '');
          if (level === 'warn' && ok) verdict = statusEl('Проверьте', 'warn');
          verdict.className = 'verdict-line';
          const where = el('span', 'muted');
          where.textContent = ' · ' + RunText.plain(ctx.name) + ' до ' + rub(threshold);
          verdict.append(where);
          view.append(verdict);
        } else {
          view.append(statusEl('Модели нет', '', 'verdict-line'));
        }
        const info = el('div', 'panel');
        const line = (name, value) => {
          const row = el('div', 'stat');
          row.append(el('span', 'muted', name), el('b', '', value));
          info.append(row);
        };
        if (listing.firstSeen) line('Впервые', minuteDate(listing.firstSeen));
        if (listing.lastSeen) line('Последний раз', minuteDate(listing.lastSeen));
        // Объявление из профиля статистики: истории цены в данных нет (trail: null) — строки о ней нет
        if (listing.trail && listing.trail.length > 1) {
          const first = listing.trail[0];
          const last = listing.trail[listing.trail.length - 1];
          const change = Math.round(((last - first) * 100) / first);
          line('Цена менялась', listing.trail.map((value) => Number(value).toLocaleString('ru-RU')).join(' → ') + ' ₽');
          line('Изменение', (change > 0 ? '+' : change < 0 ? '−' : '') + Math.abs(change) + ' %');
        } else if (listing.trail) {
          line('Цена', 'не менялась');
        }
        if (isWatched(listing.id) || listing.watched === true) line('Слежу', 'проверка раз в ~2 ч');
        view.append(info);
        if (listing.checks && listing.checks.length > 0) {
          const checks = el('div', 'panel');
          checks.append(el('div', 'group-title', 'Проверки'));
          for (const check of listing.checks) {
            const row = el('div', 'stat');
            const cost = check.priceRub === null ? 'без цены' : rub(check.priceRub);
            const result = check.code === 0 ? cost : CHECK_TEXT[check.code] || '?';
            const tone = check.code === 0 ? 'ok' : check.code === 1 ? '' : 'bad';
            row.append(el('span', 'muted', minuteDate(check.at)), statusEl(result, tone));
            checks.append(row);
          }
          view.append(checks);
        } else if (isWatched(listing.id) && listing.checks !== null) {
          view.append(el('div', 'muted', 'Проверок ещё не было'));
        }

        const actions = el('div', 'actions');
        const open = el('button', '', 'Открыть на Avito');
        open.type = 'button';
        open.addEventListener('click', () => openLink(listing.url));
        actions.append(open);
        if (listing.id && !listing.removed && !state.readOnly) {
          const star = el('button', 'ghost', isWatched(listing.id) ? 'Не следить' : 'Следить');
          star.type = 'button';
          star.addEventListener('click', () => toggleWatch(listing));
          actions.append(star);
        }
        if (state.offline && listing.id && !state.readOnly) {
          const chat = el('button', 'ghost', 'История в чат');
          chat.type = 'button';
          chat.addEventListener('click', () => save({ historyId: listing.id }));
          actions.append(chat);
        }
        view.append(actions);
      }

      function showWatchItem(listingId) {
        openScreen({ type: 'watch', id: listingId });
      }

      /** Итог обхода словом (d.r): выдача, пусто, блок, ошибка, идёт. */
      const STATUS_TEXT = ['выдача', 'пусто', 'блок', 'ошибка', 'идёт'];

      /**
       * «Сводка рынка в чат»: только в режиме ссылки с правками (sendData, бот пришлёт сводку); иначе sendData не
       * сработает — кнопки нет (в чате — /brief).
       */
      function briefAction() {
        if (!state.offline || state.readOnly) return null;
        const button = el('button', 'brief ghost', 'Сводка рынка в чат');
        button.type = 'button';
        button.addEventListener('click', () => save({ brief: true }));
        return button;
      }

      /** Вкладка «Обходы»: профиль статистики (графики, цены моделей, страницы обходов) или сводка ссылки «Цели». */
      function renderStats() {
        const view = $('statsView');
        view.textContent = '';
        if (!state.profile) return renderDashboard(view);
        try {
          renderProfile(view, state.profile);
        } catch (error) {
          view.append(el('div', 'error', 'Не удалось показать обходы: ' + error.message));
        }
      }

      /** Сводка из ссылки «Цели» (как раньше); графики и страницы обходов — в кнопке табло. */
      function renderDashboard(view) {
        const d = state.dashboard;
        if (!d) {
          view.append(el('div', 'empty muted', 'Сводки нет'));
          return;
        }
        if (d.pausedUntil && d.pausedUntil * 60_000 > Date.now()) {
          view.append(el('div', 'pause-banner', pauseText(d.pausedUntil, d.pauseReason)));
        }
        const cards = el('div', 'cards');
        const card = (label, value, kind) => {
          const box = el('div', 'card' + (kind ? ' ' + kind : ''));
          box.append(el('div', 'num', String(value)), el('div', 'muted', label));
          cards.append(box);
        };
        const percent = d.day.runs ? Math.round((d.day.ok * 100) / d.day.runs) : 0;
        card('обходов за сутки', fmt(d.day.runs));
        card('удачных', percent + ' %', percent >= 80 ? 'good' : percent < 50 && d.day.runs ? 'bad' : '');
        card('блоков', fmt(d.day.blocked), d.day.blocked ? 'bad' : '');
        card('ошибок', fmt(d.day.failed), d.day.failed ? 'bad' : '');
        card('новых объявлений', fmt(d.day.fresh), d.day.fresh ? 'good' : '');
        card('находок', fmt(d.day.finds), d.day.finds ? 'good' : '');
        card('новых моделей', fmt(d.day.discoveries));
        card('объявлений в базе', fmt(d.listings));
        view.append(cards);

        if (d.queries.length > 0) {
          const panel = el('div', 'panel');
          panel.append(el('div', 'group-title', 'Запросы за сутки'));
          const table = el('table', 'qtable');
          const head = el('tr');
          for (const [index, title] of ['Запрос', 'Обходов', 'Удачно', 'Новых'].entries()) {
            head.append(el('th', index > 0 ? 'n' : '', title));
          }
          table.append(head);
          for (const q of d.queries) {
            const tr = el('tr');
            // Заголовок группы с итогом — жирным, с чертой сверху: не путать с запросами под ним
            if (q.header) tr.className = 'qgroup';
            tr.append(
              el('td', '', RunText.plain(q.query)),
              el('td', 'n', String(q.runs)),
              el('td', 'n', (q.runs ? Math.round((q.ok * 100) / q.runs) : 0) + ' %'),
              el('td', 'n', String(q.fresh)),
            );
            table.append(tr);
          }
          panel.append(table);
          view.append(panel);
        }

        const exits = exitsPanel(d.exits);
        if (exits) view.append(exits);

        const list = el('div', 'panel');
        list.append(el('div', 'group-title', 'Журнал'));
        if (d.recent.length === 0) list.append(el('div', 'muted', 'Обходов нет'));
        for (const run of d.recent) {
          const tone = run.page && run.page.removed ? '' : ['ok', 'ok', 'blocked', 'error', ''][run.code];
          const row = el('div', 'run ' + (tone || ''));
          const what = el('div', 'what');
          const title = el('div');
          // Вид словом («Выдача», «Модель», «Слежу», «Находка», «Разовый»); подпись — без смайликов старых ссылок, у
          // разового — только вид
          title.append(el('span', 'kind', RUN_KIND[run.kind] || ''));
          if (run.kind !== 3) title.append(RunText.plain(run.label));
          what.append(title);
          // Проверка страницы (М1): цена или «снято», а не число объявлений; «идёт» дольше срока — «нет ответа ПК»
          let status = run.code === 4 && runStuck(run.at) ? 'нет ответа ПК' : STATUS_TEXT[run.code] || '?';
          if (run.watch && run.code === 0) status = pageCheckText(run.page);
          const parts = [status];
          const search = !run.watch;
          if (search && isNum(run.found)) parts.push(countText(run.found, 'объявление', 'объявления', 'объявлений'));
          if (search && run.fresh) parts.push('+' + countText(run.fresh, 'новое', 'новых', 'новых'));
          if (run.seconds) parts.push(duration(run.seconds));
          what.append(el('div', 'sub', parts.join(' · ')));
          if (run.exit) what.append(el('div', 'sub', exitText(run.exit)));
          row.append(el('div', 'when', minuteDate(run.at)), what);
          list.append(row);
        }
        view.append(list);
        const brief = briefAction();
        if (brief) view.append(brief);
      }

      /** «Avito: пауза до 04.10, 22:40 · HTTP 429». */
      function pauseText(until, reason) {
        return 'Avito: пауза до ' + minuteDate(until) + (reason ? ' · ' + reason : '');
      }

      /**
       * «Выходы за сутки»: Avito по выходам (решение владельца 05.10.2026) — видно, помогают ли российские серверы.
       * Выход без обходов за сутки — только у старых обходов из списка.
       */
      function exitsPanel(all) {
        const exits = all.filter((exit) => exit.runs > 0);
        if (exits.length === 0) return null;
        const panel = el('div', 'panel');
        panel.append(el('div', 'group-title', 'Выходы за сутки'));
        const table = el('table', 'qtable');
        const head = el('tr');
        for (const [index, title] of ['Выход', 'Обходов', 'Удачно', 'Блоков'].entries()) {
          head.append(el('th', index > 0 ? 'n' : '', title));
        }
        table.append(head);
        for (const exit of exits) {
          const where = el('td', '', exit.label);
          if (exit.ip) where.append(el('div', 'sub', exit.ip));
          const percent = Math.round((exit.ok * 100) / exit.runs);
          const tr = el('tr');
          tr.append(
            where,
            el('td', 'n', String(exit.runs)),
            el('td', 'n' + (percent >= 80 ? ' good' : percent < 50 ? ' bad' : ''), percent + ' %'),
            el('td', 'n' + (exit.blocked ? ' bad' : ''), String(exit.blocked)),
          );
          table.append(tr);
        }
        panel.append(table);
        return panel;
      }

      /** Отметить нажатую кнопку группы (aria-pressed) по data-key. */
      function pressed(container, key) {
        for (const button of container.children) {
          button.setAttribute('aria-pressed', String(button.dataset.key === String(key)));
        }
      }

      /**
       * Вкладка «Обходы» по профилю статистики (TZ.md «Поиск по моделям, страница обхода и графики», шаг 5), сверху
       * вниз: находки, «Новые объявления», плитки за сутки, «Цены моделей», «Журнал», «Блоки», «Запросы за сутки»,
       * выходы, «Оценка шанса».
       */
      function renderProfile(view, p) {
        if (state.statsOnly) view.append(el('div', 'muted', 'данные ' + dataTime(p.at)));
        const pausedUntil = Number(p.day[9]) || 0;
        if (pausedUntil > nowMinute()) view.append(el('div', 'pause-banner', pauseText(pausedUntil, p.pauseReason)));
        const finds = el('div', 'finds');
        fillFinds(finds, findGroups());
        const card = el('div', 'panel chart-card');
        view.append(finds, card);
        newListingsCard(card, p);
        view.append(dayTiles(p));
        const prices = priceList(p);
        if (prices) view.append(prices);
        const runs = runsSection(p);
        if (runs) view.append(runs);
        // «Блоки» — лимиты браузеров Avito и статистика блоков; «Оценка шанса» — калибровка (аудит 05.10.2026)
        const blocks = blocksSection(p);
        if (blocks) view.append(blocks);
        const queries = queriesSection(p);
        if (queries) view.append(queries);
        const exits = exitsPanel(p.exits);
        if (exits) view.append(exits);
        const chance = chanceSection(p);
        if (chance) view.append(chance);
        const brief = briefAction();
        if (brief) view.append(brief);
        const cut = cutNotice(p);
        if (cut) view.append(cut);
      }

      /** Пульс на ярлыке «Обходы»: есть обход с живой находкой моложе 60 минут. */
      function statsPulse() {
        if (!state.profile) return false;
        const since = nowMinute() - 60;
        return state.profile.runs.some((run) => has(run.flags, 2) && run.minute >= since);
      }

      const NEW_PERIODS = [
        ['1d', '1Д'],
        ['1w', '1Н'],
        ['1m', '1М'],
        ['all', 'Всё'],
      ];

      /**
       * Карточка «Новые объявления»: крупно — число за период, чип «+12 % · +23» к прошлому такому же периоду, график
       * (пунктир — первыми нашли поиски по моделям, красные точки — находки), переключатель 1Д · 1Н · 1М · Всё.
       */
      function newListingsCard(card, p) {
        card.append(el('div', 'chart-label', 'Новые объявления'));
        const periods = NEW_PERIODS.filter(([key]) => newSeries(p, key));
        if (periods.length === 0) {
          // Ряды не вошли в ссылку — об этом строка внизу вкладки (cutNotice); карточки нет
          card.hidden = true;
          return;
        }
        const head = el('div', 'chart-head');
        const value = el('div', 'chart-value');
        const chip = el('span', 'chip');
        head.append(value, chip);
        const sub = el('div', 'chart-sub');
        const box = el('div');
        const switcher = el('div', 'periods');
        const legend = chartLegend([
          ['ln dash', 'моделями'],
          ['pt', 'находки'],
        ]);
        const share = el('div', 'muted');
        const starts = el('div', 'muted');
        card.append(head, sub, box, switcher, legend, share, starts);
        let data = null;
        const chart = lineChart(box, {
          floorZero: true,
          emptyText: 'Нет данных',
          tip: (point) => ({ value: fmt(point.y), label: point.label }),
          summary: () => (data ? 'Новые объявления ' + data.title + ': ' + fmt(data.total) : 'Новые объявления'),
          onScrub: (point) => showHead(point),
        });

        function showHead(point) {
          if (!data) return;
          value.textContent = fmt(point ? point.y : data.total);
          chip.hidden = Boolean(point) || !data.chip;
          if (data.chip) {
            chip.textContent = data.chip.text;
            chip.className = 'chip ' + data.chip.tone;
          }
          sub.textContent = point ? RunText.plain(newPointNote(point)) : data.title;
        }

        function select(key, animate) {
          const next = newSeries(p, key);
          if (!next) return;
          data = next;
          state.newPeriod = key;
          pressed(switcher, key);
          chart.update(data.points, { animate, tone: data.chip ? data.chip.tone : 'accent' });
          showHead(null);
          const part = data.total > 0 ? Math.round((data.model * 100) / data.total) : 0;
          share.textContent = 'моделями первыми ' + fmt(data.model) + ' · ' + part + ' %';
          share.hidden = data.total === 0;
          starts.textContent = data.starts.length ? 'Не в графике: ' + RunText.plain(data.starts.join(', ')) : '';
        }

        for (const [key, label] of periods) {
          const button = el('button', '', label);
          button.type = 'button';
          button.dataset.key = key;
          button.addEventListener('click', () => {
            if (state.newPeriod === key) return;
            haptic('select');
            select(key, true);
          });
          switcher.append(button);
        }
        select(periods.some(([key]) => key === state.newPeriod) ? state.newPeriod : periods[0][0], false);
      }

      /**
       * Ряд «Новые объявления» за период: 1Д — 24 часа, 1Н — 7 дней по 6 часов, 1М — 30 дней, Всё — по дням (история
       * длиннее 120 дней — по неделям). Последний шаг периода — текущий, неполный, поэтому прошлый период — той же
       * длины, что показанный (до момента данных), а не полный: шаги на его границах входят долей по времени. Дни в
       * ссылку вошли только за 30 (o.c = 1) — «Всё» повторило бы «1М», его нет.
       */
      function newSeries(p, key) {
        const c = p.series;
        if (!c) return null;
        if (key === '1d') {
          if (!Array.isArray(c.h)) return null;
          const points = minutePoints({ all: c.h, model: c.hm, finds: c.hf }, c.h0, 60);
          const prev = coveredSum(c.q, c.q0, 360, c.h0 - (p.atMinute - c.h0), c.h0);
          return newResult(p, points, prev, 'за 24 часа', 'к прошлым суткам');
        }
        if (key === '1w') {
          if (!Array.isArray(c.q)) return null;
          const points = minutePoints({ all: c.q, model: c.qm, finds: c.qf }, c.q0, 360);
          const prev = coveredSum(c.d, dayMinute(p, c.d0), 1440, c.q0 - (p.atMinute - c.q0), c.q0);
          return newResult(p, points, prev, 'за 7 дней', 'к прошлой неделе');
        }
        if (!Array.isArray(c.d)) return null;
        if (key === '1m') {
          const skip = Math.max(0, c.d.length - 30);
          const start = dayMinute(p, c.d0 + skip);
          const prev = coveredSum(c.d, dayMinute(p, c.d0), 1440, start - (p.atMinute - start), start);
          return newResult(p, dayPoints(p, c, skip), prev, 'за 30 дней', 'к прошлым 30 дням');
        }
        if (p.cut && p.cut.c >= 1) return null;
        const all = Array.isArray(c.w) ? weekPoints(p, c) : dayPoints(p, c, 0);
        return newResult(p, all, null, all.length ? 'с ' + dayLabel(all[0].x, false) : 'за всё время', '');
      }

      /** Сумма ряда за окно [from, to), если ряд покрывает его целиком; иначе — null (чипа нет). */
      function coveredSum(values, start, step, from, to) {
        if (!Array.isArray(values) || !isNum(start) || start > from) return null;
        return Math.round(ChartMath.windowSum(values, start, step, from, to));
      }

      /** Точка «Новых»: x, новых, из них моделями, находок (красная отметка), шаг [from, to) в минутах, подпись. */
      function newPoint(values, index, x, range, label) {
        const finds = Number((values.finds || [])[index]) || 0;
        return {
          x,
          y: Number(values.all[index]) || 0,
          y2: Number((values.model || [])[index]) || 0,
          finds,
          mark: finds > 0,
          from: range[0],
          to: range[1],
          label,
        };
      }

      /** Точки по часам или по 6 часов: x — минута Unix начала шага. */
      function minutePoints(values, start, step) {
        return values.all.map((_, index) => {
          const from = start + index * step;
          const label = step === 60 ? hourLabel(from) : blockLabel(from);
          return newPoint(values, index, from, [from, from + step], label);
        });
      }

      /** Точки по дням (x — номер дня), с шага skip ряда d. */
      function dayPoints(p, c, skip) {
        const values = { all: c.d, model: c.dm, finds: c.df };
        const points = [];
        for (let index = skip; index < c.d.length; index++) {
          const day = c.d0 + index;
          const range = [dayMinute(p, day), dayMinute(p, day + 1)];
          points.push(newPoint(values, index, day, range, dayLabel(day)));
        }
        return points;
      }

      /** Точки по неделям (x — номер дня понедельника). */
      function weekPoints(p, c) {
        const values = { all: c.w, model: c.wm, finds: c.wf };
        return c.w.map((_, index) => {
          const day = c.w0 + index * 7;
          const range = [dayMinute(p, day), dayMinute(p, day + 7)];
          return newPoint(values, index, day, range, 'неделя с ' + dayLabel(day, false));
        });
      }

      /** «14:00–15:00» (не сегодня — «вчера, 23:00–00:00»). */
      function hourLabel(from) {
        const day = dayHint(from);
        return (day ? day + ', ' : '') + clock(from) + '–' + clock(from + 60);
      }

      /** «пн, 5 окт., 12:00–18:00». */
      function blockLabel(from) {
        const options = { weekday: 'short', day: 'numeric', month: 'short' };
        const date = new Date(from * 60_000).toLocaleDateString('ru-RU', options);
        return date + ', ' + clock(from) + '–' + clock(from + 360);
      }

      /** Итог периода: сумма, из них моделями, чип к прошлому периоду, подпись, старты поисков (их нет в ряду). */
      function newResult(p, points, prev, title, prevTitle) {
        let total = 0;
        let model = 0;
        for (const point of points) {
          total += point.y;
          model += point.y2;
        }
        const chip = prev === null ? null : changeChip(total, prev);
        const from = points.length ? points[0].from : 0;
        const to = points.length ? points[points.length - 1].to : 0;
        const starts = startsIn(p, from, to);
        return { points, total, model, chip, title: chip ? title + ' · ' + prevTitle : title, starts };
      }

      /** Чип «+12 % · +23» к прошлому такому же периоду: больше — зелёный, меньше — красный. */
      function changeChip(total, prev) {
        const diff = total - prev;
        const pct = ChartMath.changePercent(prev, total);
        const tone = diff >= 0 ? 'up' : 'down';
        if (pct === null) return { text: signed(diff), tone };
        return { text: signed(pct) + ' % · ' + signed(diff), tone };
      }

      /** Легенда графика: [[класс образца (ln — линия, dash — пунктир, thr — порог, pt — точка), подпись]]. */
      function chartLegend(items) {
        const box = el('div', 'legend');
        for (const [kind, text] of items) {
          const item = el('span');
          item.append(el('i', kind), text);
          box.append(item);
        }
        return box;
      }

      /** Старты поисков в [from, to): их объявления в ряды не входят — «старт Catty Noir +41». */
      function startsIn(p, from, to) {
        const out = [];
        for (const start of (p.series && p.series.b) || []) {
          if (start[0] >= from && start[0] < to) out.push(startText(start));
        }
        return out;
      }

      function startText([, targetId, count, query]) {
        const what = targetId ? targetName(targetId) : '«' + (query || '?') + '»';
        return 'старт ' + what + ' +' + fmt(count);
      }

      /** Протяжка по «Новым»: шаг, из них моделями, находки, старты поисков. */
      function newPointNote(point) {
        const parts = [point.label];
        if (point.y2 > 0) parts.push('моделями ' + fmt(point.y2));
        if (point.finds > 0) parts.push(countText(point.finds, 'находка', 'находки', 'находок'));
        return parts.concat(startsIn(state.profile, point.from, point.to)).join(' · ');
      }

      /** Плитка: число и подпись (kind — good или bad). */
      function tile(parent, label, value, kind) {
        const box = el('div', 'card' + (kind ? ' ' + kind : ''));
        box.append(el('div', 'num', String(value)), el('div', 'muted', label));
        parent.append(box);
      }

      /** Плитки за сутки 2×2 и «Ещё»: блоки, ошибки, новые модели, объявлений в базе. */
      function dayTiles(p) {
        const day = (index) => Number(p.day[index]) || 0;
        const box = el('div');
        const cards = el('div', 'cards');
        const percent = day(0) ? Math.round((day(1) * 100) / day(0)) : 0;
        tile(cards, 'обходов за сутки', fmt(day(0)));
        tile(cards, 'удачных', percent + ' %', percent >= 80 ? 'good' : percent < 50 && day(0) ? 'bad' : '');
        tile(cards, 'новых объявлений', fmt(day(5)), day(5) ? 'good' : '');
        tile(cards, 'находок', fmt(day(6)), day(6) ? 'good' : '');
        const more = el('details', 'more');
        const extra = el('div', 'cards');
        tile(extra, 'блоков', fmt(day(2)), day(2) ? 'bad' : '');
        tile(extra, 'ошибок', fmt(day(3)), day(3) ? 'bad' : '');
        tile(extra, 'новых моделей', fmt(day(7)));
        tile(extra, 'объявлений в базе', fmt(day(8)));
        more.append(el('summary', '', 'Ещё'), extra);
        box.append(cards, more);
        return box;
      }

      /**
       * «Цены моделей» — как активы в Wallet: фото (живая находка — пульс), название, спарклайн за неделю, изменение,
       * «медиана 7 400 ₽ · 9 в продаже». Сначала модели с живой находкой, затем по числу объявлений.
       */
      function priceList(p) {
        if (p.models.length === 0) return null;
        const box = el('div');
        box.append(el('div', 'section-title', 'Цены моделей'));
        const live = new Set(liveFinds().map((find) => find.targetId));
        const rank = (model) => (live.has(model.targetId) ? 1_000_000 : 0) + lightTarget(p, model.targetId).selling;
        for (const model of [...p.models].sort((a, b) => rank(b) - rank(a))) {
          box.append(assetRow(p, model, live.has(model.targetId)));
        }
        return box;
      }

      function assetRow(p, model, live) {
        const target = lightTarget(p, model.targetId);
        const row = el('button', 'asset');
        row.type = 'button';
        const image = { name: target.name, img: target.img };
        row.append(live ? liveThumb(image) : thumb(image, 'thumb'));
        const week = pricePoints(model, 7);
        const last = week.length ? week[week.length - 1] : null;
        const parts = [];
        if (last) parts.push('медиана ' + rub(last.y));
        parts.push(fmt(target.selling) + ' в продаже');
        const info = el('span', 'info');
        info.append(el('span', 'name', target.name), el('span', 'sub', parts.join(' · ')));
        const right = el('span', 'right');
        right.append(sparkline(week));
        const change = last && week.length >= 2 ? ChartMath.changePercent(week[0].y, last.y) : null;
        if (change !== null) right.append(priceChange(change));
        row.append(info, right);
        row.addEventListener('click', () => openScreen({ type: 'price', targetId: model.targetId }));
        return row;
      }

      /** Спарклайн 64×28 — медиана за неделю, цветом акцента. */
      function sparkline(points) {
        const box = svgEl('svg', 'spark');
        box.setAttribute('viewBox', '0 0 64 28');
        box.setAttribute('aria-hidden', 'true');
        if (points.length < 2) return box;
        const [low, high] = ChartMath.extent(points.map((point) => point.y));
        const first = points[0].x;
        const span = points[points.length - 1].x - first || 1;
        const screen = points.map((point) => ({
          x: 2 + ((point.x - first) / span) * 60,
          y: high === low ? 14 : 3 + ((high - point.y) / (high - low)) * 22,
        }));
        const line = svgEl('path', 'spark-line');
        line.setAttribute('d', ChartMath.monotonePath(screen));
        box.append(line);
        return box;
      }

      /** Изменение цены: дешевеет — «−6 %» зелёным (для покупателя), дорожает — «+4 %» красным. */
      function priceChangeParts(change) {
        if (change === 0) return { text: '0 %', tone: '' };
        return { text: signed(change) + ' %', tone: change < 0 ? 'up' : 'down' };
      }

      function priceChange(change) {
        const parts = priceChangeParts(change);
        return el('span', 'chip small ' + parts.tone, parts.text);
      }

      /**
       * Точки цены модели по дням за последние days дней: x — номер дня, y — медиана ₽, low — минимум. Дней без кукол
       * нет; меньше 3 кукол за день — бледная точка («мало данных»).
       */
      function pricePoints(model, days) {
        const last = model.d0 + model.counts.length - 1;
        const points = [];
        model.counts.forEach((count, index) => {
          const day = model.d0 + index;
          if (!(count > 0) || day <= last - days) return;
          const finds = Number(model.finds[index]) || 0;
          points.push({
            x: day,
            y: model.median[index],
            low: model.min[index],
            count,
            finds,
            mark: finds > 0,
            faint: count < 3,
          });
        });
        return points;
      }

      /** Фильтры «Обходов»: ключ, подпись, условие; виды обходов — словами (RUN_KIND). */
      const RUN_FILTERS = [
        ['all', 'Все', () => true],
        ['general', RUN_KIND[0], (run) => run.kind === 0],
        ['model', RUN_KIND[1], (run) => run.kind === 1],
        ['watch', RUN_KIND[2], (run) => run.kind === 2],
        ['check', RUN_KIND[4], (run) => run.kind === 4],
        ['once', RUN_KIND[3], (run) => run.kind === 3],
        ['fresh', 'С новыми', (run) => run.fresh > 0],
        ['finds', 'С находками', (run) => run.finds > 0],
        ['failed', 'Сбои', (run) => run.outcome === 2 || run.outcome === 3],
      ];

      /** «Журнал»: чипы-фильтры с числами и строки обходов; нажатие — страница обхода. */
      function runsSection(p) {
        const box = el('div');
        box.append(el('div', 'section-title', 'Журнал'));
        if (p.runs.length === 0) {
          // Не вошли в ссылку — об этом строка внизу вкладки (cutNotice)
          if (p.cut && p.cut.r) return null;
          box.append(el('div', 'muted', 'Обходов нет'));
          return box;
        }
        const chips = el('div', 'chips');
        const list = el('div');
        box.append(chips, list);
        const filters = RUN_FILTERS.filter(([key, , test]) => key === 'all' || p.runs.some(test));
        const select = (key) => {
          state.runFilter = key;
          pressed(chips, key);
          fillRuns(list, p, key);
        };
        for (const [key, label, test] of filters) {
          const chip = el('button', 'fchip', label);
          chip.type = 'button';
          chip.dataset.key = key;
          const count = p.runs.filter(test).length;
          chip.append(el('span', 'n', fmt(count)));
          chip.addEventListener('click', () => {
            haptic('select');
            select(key);
          });
          chips.append(chip);
        }
        select(filters.some(([key]) => key === state.runFilter) ? state.runFilter : 'all');
        return box;
      }

      function fillRuns(list, p, key) {
        list.textContent = '';
        const filter = RUN_FILTERS.find(([id]) => id === key) || RUN_FILTERS[0];
        const runs = p.runs.filter(filter[2]);
        // Паузы браузеров после блока — строками между обходами (аудит 05.10.2026, М2): во «Все» и «Сбои»
        const pauses = key === 'all' || key === 'failed' ? sessionPauses(p, runs) : [];
        let next = 0;
        for (const run of runs) {
          while (next < pauses.length && pauses[next].minute >= run.minute) list.append(gapRow(pauses[next++]));
          list.append(runRow(p, run));
        }
      }

      /** Паузы браузеров после блока (история лимитов «Блоков») за время обходов списка, новые сверху. */
      function sessionPauses(p, runs) {
        if (!p.budget || runs.length === 0) return [];
        const oldest = runs[runs.length - 1].minute;
        return p.budget.history
          .filter((change) => (change.reason === 1 || change.reason === 3) && change.pausedUntil)
          .filter((change) => change.minute >= oldest)
          .sort((a, b) => b.minute - a.minute);
      }

      /** «Opera: пауза после блока до 22:40» (после HTTP 439 — «пауза после 439») — строка между обходами. */
      function gapRow(change) {
        const why = change.note ? ' · ' + change.note : '';
        const after = change.reason === 3 ? ': пауза после 439 до ' : ': пауза после блока до ';
        return el('div', 'gap-row', change.label + after + whenText(change.pausedUntil) + why);
      }

      /**
       * Строка обхода (от 56 px, нажимается целиком): полоса слева по итогу, время (не сегодня — «вчера»), вид словом
       * и что искали, итог, мелко — браузер, выход, длительность, ожидание в очереди. С живой находкой — фон и пульс.
       */
      function runRow(p, run) {
        const row = el('button', 'rrow o' + run.outcome);
        row.type = 'button';
        const live = has(run.flags, 2);
        if (live) row.classList.add('live');
        const time = el('span', 't', clock(run.minute));
        const day = dayHint(run.minute);
        if (day) time.append(el('span', 'sub', day));
        const what = el('span', 'l1');
        if (live) what.append(pulse());
        what.append(el('span', 'kind', RUN_KIND[run.kind] || ''), RunText.plain(runWhat(p, run)));
        const body = el('span', 'body');
        body.append(what, runResult(p, run), el('span', 'sub', runMeta(p, run)));
        row.append(time, body, icon('chevron', 'chev'));
        row.addEventListener('click', () => openScreen({ type: 'run', id: run.id }));
        return row;
      }

      /** Что искали: запрос, модель с порогом на момент обхода, заголовок проверенного объявления. */
      function runWhat(p, run) {
        if (run.kind === 0) return String(run.about || 'запрос');
        if (run.kind === 1) {
          const name = targetName(run.about);
          return run.thresholdRub ? name + ' · до ' + rub(run.thresholdRub) : name;
        }
        if (run.kind === 3) return has(run.flags, 4) ? 'без записи' : '';
        const listing = p.listings.get(run.about);
        return listing ? listing.title : 'объявление';
      }

      /** Обход «идёт» дольше срока задачи с уборщиком: ПК не прислал результат (аудит 05.10.2026, М2). */
      function runStuck(minute) {
        return nowMinute() - minute > RUNNING_MAX_MINUTES;
      }

      /** «50 объявлений · +3 новых · 1 находка», «цена 4 500 ₽», «снято» или «связь оборвалась · 2 попытки». */
      function runResult(p, run) {
        if (run.outcome === 4) {
          return runStuck(run.minute) ? el('span', 'l2 grey', 'нет ответа ПК') : el('span', 'l2', 'идёт');
        }
        if (run.check && run.check.removed) return el('span', 'l2 grey', 'снято');
        if (run.outcome === 1) return el('span', 'l2 grey', RUN_ERROR_TEXT[11]);
        if (run.outcome === 0) return el('span', 'l2', runSuccess(run));
        const kind = run.outcome === 2 ? 'warn' : 'bad';
        return el('span', 'l2 ' + kind, runError(p, run) + attemptsNote(run));
      }

      /**
       * Итог проверки страницы (аудит 05.10.2026, М1): «цена 4 500 ₽», «цена 5 000 → 4 500 ₽» (изменилась), «снято»;
       * проверки до итога в журнале — «страница открылась».
       */
      function pageCheckText(check) {
        if (!check) return 'страница открылась';
        if (check.removed) return 'снято';
        if (check.priceRub === null) return 'без цены';
        if (check.prevRub !== null && check.prevRub !== check.priceRub) {
          return 'цена ' + fmt(check.prevRub) + ' → ' + rub(check.priceRub);
        }
        return 'цена ' + rub(check.priceRub);
      }

      function runSuccess(run) {
        if (run.kind === 2 || run.kind === 4) return pageCheckText(run.check);
        const parts = [countText(run.found || 0, 'объявление', 'объявления', 'объявлений')];
        if (run.fresh > 0) parts.push('+' + countText(run.fresh, 'новое', 'новых', 'новых'));
        if (run.cheaper > 0) parts.push(countText(run.cheaper, 'подешевело', 'подешевели', 'подешевели'));
        if (run.finds > 0) parts.push(countText(run.finds, 'находка', 'находки', 'находок'));
        return parts.join(' · ');
      }

      function attemptsNote(run) {
        return run.attempts > 1 ? ' · ' + countText(run.attempts, 'попытка', 'попытки', 'попыток') : '';
      }

      /** Фраза ошибки обхода по словарю: сервер у «не ответил», время паузы у блока, сырой текст у «другого». */
      function runError(p, run) {
        const exit = p.exits[run.exit];
        return errorPhrase(p, run.code, exit ? exit.label : null, run.errorText, run);
      }

      /** Время паузы — только у блока, после которого Avito на паузе сейчас; у прошлых блоков — без него. */
      function errorPhrase(p, code, server, raw, run) {
        if (code === 6 && server && server !== 'напрямую') return 'сервер ' + server + ' не ответил';
        const until = Number(p.day[9]) || 0;
        if (code === 8 && until > run.minute && pauseRunId(p) === run.id) {
          return 'Avito закрыл доступ, пауза до ' + clock(until);
        }
        if (code === 15 && raw) return raw;
        if (!code) return 'сбой';
        return RUN_ERROR_TEXT[code] || RUN_ERROR_TEXT[15];
      }

      /** Обход, после которого Avito на паузе сейчас: самый новый блок (код 8), если после него удачных не было. */
      function pauseRunId(p) {
        for (const run of p.runs) {
          if (run.outcome === 0) return null;
          if (run.code === 8) return run.id;
        }
        return null;
      }

      /**
       * Удачный поиск с объявлениями, а списков выдачи нет — обход до журнала (аудит 05.10.2026, М2): так и
       * подписывается, а не остаётся пустым.
       */
      function beforeJournal(run) {
        return run.outcome === 0 && (run.kind === 0 || run.kind === 1) && run.found > 0 && run.known === null;
      }

      /** Мелкая строка: браузер, выход, передача, длительность, ожидание в очереди, страница, первый обход. */
      function runMeta(p, run) {
        const parts = [];
        // Браузер обхода (с 06.10.2026: браузер и IP меняются на каждой загрузке)
        if (run.browser) parts.push(run.browser + (run.media ? ' с картинками' : ''));
        const exit = p.exits[run.exit];
        if (exit) parts.push(exit.label);
        if (run.handOverOf) parts.push('передача');
        if (run.handedOver) parts.push('передан дальше');
        if (isNum(run.seconds)) parts.push(duration(run.seconds));
        if (isNum(run.wait)) parts.push('очередь ' + duration(run.wait));
        if (run.page > 1) parts.push('стр. ' + run.page);
        if (has(run.flags, 1)) parts.push('первый обход');
        if (run.kind !== 3 && has(run.flags, 4)) parts.push('без записи');
        if (beforeJournal(run)) parts.push('до журнала');
        return parts.join(' · ');
      }

      /** «Запросы за сутки» по группам: «Выдача», «Модели», «Проверки». */
      function queriesSection(p) {
        if (p.groups.length === 0 && p.queries.length === 0) return null;
        const box = el('div');
        box.append(el('div', 'section-title', 'Запросы за сутки'));
        for (const group of p.groups) {
          box.append(
            groupPanel(
              group,
              p.queries.filter((query) => query.group === group.group),
            ),
          );
        }
        const known = new Set(p.groups.map((group) => group.group));
        const rest = p.queries.filter((query) => !known.has(query.group));
        if (rest.length > 0) box.append(groupPanel(null, rest));
        return box;
      }

      /** Группа: интервал и причина замедления, итог за сутки, ожидание в очереди; строки запросов группы. */
      function groupPanel(group, rows) {
        const panel = el('div', 'panel');
        if (group) {
          panel.append(el('div', 'group-title', groupTitle(group)), el('div', 'sub', groupDay(group)));
          const queue = queueText(group);
          if (queue) panel.append(el('div', 'sub', queue));
        }
        if (rows.length > 0) panel.append(queryTable(rows, group ? group.group : 0));
        return panel;
      }

      /** «Модели · 6 моделей · раз в ~24 мин (цель 10) · сейчас: лимит Avito». */
      function groupTitle(group) {
        const parts = [GROUP_TITLE[group.group] || 'Другое'];
        if (group.group === 0 && group.urls > 0) parts.push(countText(group.urls, 'запрос', 'запроса', 'запросов'));
        if (group.group === 1 && group.urls > 0) parts.push(countText(group.urls, 'модель', 'модели', 'моделей'));
        if (group.group !== 2) {
          const every = group.every >= 0 ? 'раз в ~' + group.every + ' мин' : 'за 3 ч не было';
          parts.push(group.target > 0 ? every + ' (цель ' + group.target + ')' : every);
        }
        // «реже: лимит загрузок Avito» (8) — без «сейчас:»: это не пауза, а растяжка по лимиту загрузок
        if (group.slow > 0) parts.push(group.slow === 8 ? slowText(group) : 'сейчас: ' + slowText(group));
        return parts.join(' · ');
      }

      function slowText(group) {
        const text = RunText.slow[group.slow] || 'причина неизвестна';
        return group.slow === 4 && group.slowUntil > 0 ? text + ' до ' + clock(group.slowUntil) : text;
      }

      /** Итог группы за сутки: «70 обходов · 74 % удачных · 50 новых · 21 только им · 3 находки». */
      function groupDay(group) {
        const percent = group.runs ? Math.round((group.ok * 100) / group.runs) : 0;
        const parts = [countText(group.runs, 'обход', 'обхода', 'обходов'), percent + ' % удачных'];
        if (group.group !== 2) {
          parts.push(fmt(group.fresh) + ' новых', fmt(group.only) + ' только им');
          parts.push(countText(group.finds, 'находка', 'находки', 'находок'));
        }
        return parts.join(' · ');
      }

      function queueText(group) {
        if (!(group.waitMedian >= 0)) return '';
        const p90 = group.waitP90 >= 0 ? ', 90 % до ' + duration(group.waitP90) : '';
        return 'очередь: медиана ' + duration(group.waitMedian) + p90;
      }

      /** Строки запросов: запрос (обходов и удачных %) и колонки Новых · Только им · Находок. */
      function queryTable(rows, group) {
        const table = el('table', 'qtable');
        const head = el('tr');
        head.append(el('th', '', 'Запрос'));
        for (const title of ['Новых', 'Только им', 'Находок']) head.append(el('th', 'n', title));
        table.append(head);
        for (const query of rows) {
          const name = el('td', '', query.query);
          const percent = query.runs ? Math.round((query.ok * 100) / query.runs) : 0;
          name.append(el('div', 'sub', countText(query.runs, 'обход', 'обхода', 'обходов') + ' · ' + percent + ' %'));
          const tr = el('tr');
          tr.append(name, numCell(query.fresh, group), numCell(query.only, group), numCell(query.finds, 0));
          table.append(tr);
        }
        return table;
      }

      function numCell(value, group) {
        return el('td', 'n' + (value > 0 ? ' good' : ''), group === 2 ? '—' : fmt(value || 0));
      }

      const CUT_SERIES = ['графики старше 30 дней', 'графики 1М и Всё', 'график новых объявлений'];

      /**
       * Чего не хватило в ссылке (o; Telegram ограничивает длину кнопки) — одной строкой внизу вкладки: в разделах
       * отдельных пометок нет.
       */
      function cutNotice(p) {
        const cut = p.cut;
        if (!cut) return null;
        const parts = [];
        if (CUT_SERIES[cut.c - 1]) parts.push(CUT_SERIES[cut.c - 1]);
        if (cut.f) parts.push(countText(cut.f, 'находка', 'находки', 'находок'));
        if (cut.r) parts.push(countText(cut.r, 'обход', 'обхода', 'обходов'));
        if (cut.d) parts.push('подробности ' + countText(cut.d, 'обхода', 'обходов', 'обходов'));
        if (cut.m) parts.push(countText(cut.m, 'график цены', 'графика цены', 'графиков цены'));
        if (cut.h) parts.push('цена ' + countText(cut.h, 'модели', 'моделей', 'моделей') + ' старше 30 дней');
        if (cut.l) parts.push(countText(cut.l, 'список «в продаже»', 'списка «в продаже»', 'списков «в продаже»'));
        if (cut.q) parts.push('запросы');
        if (cut.i) parts.push(countText(cut.i, 'интересный обход', 'интересных обхода', 'интересных обходов'));
        if (cut.p) parts.push(countText(cut.p, 'фото', 'фото', 'фото'));
        if (cut.k) parts.push(countText(cut.k, 'блок', 'блока', 'блоков'));
        if (cut.y) parts.push(countText(cut.y, 'изменение лимита', 'изменения лимита', 'изменений лимита'));
        if (parts.length === 0) return null;
        return el('div', 'muted', 'Не вошло в ссылку: ' + parts.join(', '));
      }

      /** Доля: «4,1 %»; загрузок нет — «—». */
      function shareText(part, total) {
        if (!(total > 0)) return '—';
        return ((part * 100) / total).toFixed(1).replace('.', ',').replace(/,0$/, '') + ' %';
      }

      /** Заголовок столбца с числами — справа. */
      const numHead = (title) => [title, true];

      /** Таблица: заголовки [подпись, числа справа?] и строки ячеек (текст, число — справа, или готовая ячейка). */
      function gridTable(heads, rows) {
        // Подписи под значениями переносятся: на телефоне в четыре столбца иначе не влезает
        const box = el('table', 'qtable wrap');
        const head = el('tr');
        for (const [title, numeric] of heads) head.append(el('th', numeric ? 'n' : '', title));
        box.append(head);
        for (const cells of rows) {
          const tr = el('tr');
          for (const cell of cells) {
            if (cell instanceof Node) tr.append(cell);
            else if (typeof cell === 'number') tr.append(el('td', 'n', fmt(cell)));
            else tr.append(el('td', '', cell));
          }
          box.append(tr);
        }
        return box;
      }

      /** Загрузок, блоков и доля — три ячейки строки. */
      const blockCells = (loads, blocks) => [loads, blocks, shareText(blocks, loads)];
      const BLOCK_HEADS = [numHead('Загрузок'), numHead('Блоков'), numHead('Доля')];

      /**
       * «Блоки» (просьба владельца 05.10.2026: после скольких загрузок блок): лимиты браузеров Avito и их история,
       * статистика блоков за неделю — вывод, смена браузера и IP подряд, последние блоки, доля блоков по частоте
       * загрузок, по выходам и браузерам.
       */
      function blocksSection(p) {
        if (!p.budget && !p.blocks) return null;
        const box = el('div');
        box.append(el('div', 'section-title', 'Блоки'));
        if (p.budget) box.append(budgetPanel(p.budget));
        if (p.blocks) box.append(...blockPanels(p.blocks));
        return box;
      }

      /**
       * Состояние браузера в «Блоках» словом и точкой: берёт (зелёная; её очередь — «следующий»), пауза до … (жёлтая),
       * лимит за час, общий потолок, ждёт очереди или загрузку другого, не на связи (серые).
       */
      function sessionCell(session) {
        const paused = session.hold === 1 && session.pausedUntil;
        let status = session.active ? HOLD_TEXT[session.hold] || '?' : 'не на связи';
        if (session.active && paused) status = 'пауза до ' + whenText(session.pausedUntil);
        if (session.active && session.hold === 0 && session.turn) status = 'следующий';
        let tone = '';
        if (session.active && session.hold === 0) tone = 'ok';
        if (session.active && paused) tone = 'warn';
        const cell = el('td');
        cell.append(statusEl(status, tone));
        if (paused && session.reason) cell.append(el('div', 'sub', session.reason));
        return cell;
      }

      /** Изменение лимита: «22:10 Opera: блок, 24 → 12, пауза до 22:40 · общий · HTTP 429». */
      function changeText(change) {
        const what = CHANGE_TEXT[change.reason] || '?';
        const from = change.from === null ? '' : change.from + ' → ';
        const pause = change.pausedUntil ? ', пауза до ' + whenText(change.pausedUntil) : '';
        const note = change.note ? ' · ' + change.note : '';
        return whenText(change.minute) + ' ' + change.label + ': ' + what + ', ' + from + change.to + pause + note;
      }

      /** Лимиты браузеров: загрузок за час и лимит, кто ждёт и почему, изменения лимитов (новые сверху). */
      function budgetPanel(budget) {
        const panel = el('div', 'panel');
        const loads = fmt(budget.loads) + ' из ' + fmt(budget.capacity) + ' загрузок за час';
        panel.append(el('div', 'group-title', loads));
        const cap = budget.cap ? ' · потолок ' + budget.cap + '/ч' : '';
        const limits = 'лимит браузера ' + budget.min + '–' + budget.max + ' · старт ' + budget.start + cap;
        panel.append(el('div', 'sub', limits));
        const rows = budget.sessions.map((session) => {
          const name = el('td', '', session.label);
          const notes = [session.last ? 'последний' : '', session.media ? 'картинки' : ''];
          const note = notes.filter(Boolean).join(', ');
          if (note) name.append(el('div', 'sub', note));
          return [name, session.loads, session.budget, sessionCell(session)];
        });
        panel.append(gridTable([['Браузер'], numHead('За час'), numHead('Лимит'), ['Сейчас']], rows));
        for (const change of budget.history) panel.append(el('div', 'sub', changeText(change)));
        return panel;
      }

      /** Последний блок строкой: когда, выход (IP, браузер, вид, HTTP), загрузок за 60 мин, с прошлого блока. */
      function blockRow(row) {
        const when = el('td', '', clock(row.minute));
        const day = dayHint(row.minute);
        if (day) when.append(el('div', 'sub', day));
        // HTTP 439 — ранний сигнал (выдача пришла), а не блок
        if (row.warn) when.append(el('div', 'sub', '439, не блок'));
        const exit = el('td', '', row.exit ? row.exit.label : '?');
        const type = row.ipType ? IP_TYPE_TEXT[row.ipType] : '';
        const media = row.media === true ? 'с картинками' : '';
        const kind = (RUN_KIND[row.kind] || '').toLowerCase();
        const about = [row.exit && row.exit.ip, type, row.session, media, kind];
        about.push(row.http ? 'HTTP ' + row.http : '');
        exit.append(el('div', 'sub', about.filter(Boolean).join(' · ')));
        const loads = el('td', 'n', row.all[2] + ' / ' + row.sameExit[2] + ' / ' + row.sameSession[2]);
        const since = el('td', 'n', row.sincePrev === null ? '—' : duration(row.sincePrev * 60));
        if (row.firstAfterQuiet) since.append(el('div', 'sub', 'после тишины'));
        const idle = [];
        if (isNum(row.idleSession)) idle.push('тишина браузера ' + duration(row.idleSession * 60));
        if (isNum(row.idleExit)) idle.push('IP ' + duration(row.idleExit * 60));
        if (idle.length > 0) since.append(el('div', 'sub', idle.join(', ')));
        return [when, exit, loads, since];
      }

      /** Загрузок, блоков (доля) и 439 (доля) — четыре ячейки строки «что предсказывает блоки». */
      const groupCells = (group) => [
        group.loads,
        group.blocks,
        shareText(group.blocks, group.loads),
        shareText(group.warns, group.loads),
      ];
      const GROUP_HEADS = [numHead('Загрузок'), numHead('Блоков'), numHead('Доля'), numHead('439')];

      /**
       * «Что предсказывает блоки» (с 06.10.2026): доля блоков и 439 по типу IP выхода и по тишине браузера перед
       * загрузкой; опыт «с картинками и без»; безопасный темп браузера.
       */
      function predictorPanels(stats) {
        const panels = [];
        const head = el('div', 'panel');
        head.append(el('div', 'group-title', 'Что предсказывает блоки'));
        // Безопасный темп — 0,8 × нижняя четверть загрузок браузера за час перед его блоками (от 3 блоков)
        const rateText = (rate) => (rate ? 'до ' + rate + '/ч' : 'мало данных');
        if (stats.safeRates && stats.safeRates.length > 0) {
          const rows = stats.safeRates.map((row) => [row.session, el('td', 'n', rateText(row.rate))]);
          head.append(gridTable([['Браузер'], numHead('Безопасный темп')], rows));
        } else {
          head.append(el('div', '', 'Безопасный темп: ' + rateText(stats.safeRate)));
        }
        if (stats.warns > 0) head.append(el('div', 'sub', 'HTTP 439: ' + fmt(stats.warns)));
        const types = stats.byType.filter((row) => row.loads > 0);
        if (types.length > 0) {
          const rows = types.map((row) => [IP_TYPE_TEXT[row.type] || '?', ...groupCells(row)]);
          head.append(gridTable([['Тип IP'], ...GROUP_HEADS], rows));
        }
        const idle = (stats.byIdle || []).filter((row) => row.loads > 0);
        if (idle.length > 0) {
          const rows = idle.map((row) => ['от ' + duration(row.from * 60), ...groupCells(row)]);
          head.append(gridTable([['Тишина браузера'], ...GROUP_HEADS], rows));
        }
        panels.push(head);
        const media = stats.media;
        if (media && media.on.loads + media.off.loads > 0) {
          const panel = el('div', 'panel');
          panel.append(el('div', 'group-title', 'С картинками и без'));
          const rows = [
            ['с картинками', ...groupCells(media.on)],
            ['без картинок', ...groupCells(media.off)],
          ];
          panel.append(gridTable([['Загрузки'], ...GROUP_HEADS], rows));
          panels.push(panel);
        }
        return panels;
      }

      /** Статистика блоков: вывод и смена подряд, последние блоки, доли по частоте загрузок, выходы и браузеры. */
      function blockPanels(stats) {
        const head = el('div', 'panel');
        const total = fmt(stats.loads) + ' загрузок, ' + countText(stats.blocks, 'блок', 'блока', 'блоков');
        head.append(el('div', 'group-title', 'За ' + stats.days + ' дн.: ' + total));
        for (const line of stats.conclusion) head.append(el('div', '', line));
        const repeats = stats.repeats;
        if (repeats && repeats.pairs > 0) {
          const same = 'тот же IP — ' + repeats.sameExit + ', тот же браузер — ' + repeats.sameSession;
          head.append(el('div', 'sub', 'Подряд за сутки: ' + same + ' из ' + repeats.pairs));
        }
        const panels = [head];
        if (stats.rows.length > 0) {
          const panel = el('div', 'panel');
          panel.append(el('div', 'group-title', 'Последние блоки'));
          const heads = [['Когда'], ['Выход'], numHead('Всего / IP / браузер'), numHead('С прошлого')];
          panel.append(gridTable(heads, stats.rows.map(blockRow)));
          panels.push(panel);
        }
        const shares = el('div', 'panel');
        shares.append(el('div', 'group-title', 'Блоки по темпу'));
        const groups = [
          ['Всего', stats.byAll],
          ['С выхода', stats.byExit],
          ['У браузера', stats.bySession],
        ];
        for (const [title, buckets] of groups) {
          const used = buckets.filter((bucket) => bucket.loads > 0);
          const rows = used.map((bucket) => ['от ' + bucket.from, ...blockCells(bucket.loads, bucket.blocks)]);
          if (rows.length > 0) shares.append(gridTable([[title], ...BLOCK_HEADS], rows));
        }
        panels.push(shares);
        const exitRows = stats.exits.map((row) => {
          const cell = el('td', '', row.exit ? row.exit.label : '?');
          if (row.exit && row.exit.ip) cell.append(el('div', 'sub', row.exit.ip));
          return [cell, ...blockCells(row.loads, row.blocks)];
        });
        const sessionRows = stats.sessions.map((row) => [row.session, ...blockCells(row.loads, row.blocks)]);
        if (exitRows.length > 0 || sessionRows.length > 0) {
          const where = el('div', 'panel');
          if (exitRows.length > 0) where.append(gridTable([['Выход'], ...BLOCK_HEADS], exitRows));
          if (sessionRows.length > 0) where.append(gridTable([['Браузер'], ...BLOCK_HEADS], sessionRows));
          panels.push(where);
        }
        if (stats.byType) panels.push(...predictorPanels(stats));
        return panels;
      }

      /**
       * «Оценка шанса» (калибровка, решение владельца 05.10.2026): находки текущей версии формулы по корзинам «шанса» —
       * сколько, одобрено из оценённых, снято с Avito за сутки из проверенных.
       */
      function chanceSection(p) {
        const chance = p.chance;
        if (!chance || chance.buckets.length === 0) return null;
        const panel = el('div', 'panel');
        panel.append(el('div', 'group-title', 'Оценка шанса · v' + chance.version));
        const rows = chance.buckets.map((bucket) => {
          const range = bucket.from >= 90 ? '90–100' : bucket.from + '–' + (bucket.from + 9);
          const good = el('td', 'n', bucket.good + ' из ' + bucket.rated);
          good.append(el('div', 'sub', shareText(bucket.good, bucket.rated)));
          const gone = el('td', 'n', bucket.gone + ' из ' + bucket.checked);
          gone.append(el('div', 'sub', shareText(bucket.gone, bucket.checked)));
          return [range, bucket.matches, good, gone];
        });
        const heads = [['Шанс'], numHead('Находок'), numHead('Одобрено'), numHead('Снято за сутки')];
        panel.append(gridTable(heads, rows));
        return panel;
      }

      /** Страница обхода (TZ.md, шаг 5): заголовок, итог по словарю ошибок, плитки, как грузили, новые объявления. */
      function renderRun(run) {
        const p = state.profile;
        const view = $('detailView');
        view.textContent = '';
        view.append(runHead(p, run), el('div', 'muted', runLine(run)), runOutcome(p, run));
        const handOver = handOverLine(run);
        if (handOver) view.append(handOver);
        const banner = findBanner(run);
        if (banner) view.append(banner);
        const cards = el('div', 'cards');
        const count = (value) => (isNum(value) ? fmt(value) : '—');
        if (run.kind === 2 || run.kind === 4) {
          // Проверка страницы (М1): цена на странице и до проверки, а не «найдено»
          const price = (value) => (run.check && isNum(value) ? rub(value) : '—');
          tile(cards, 'цена', run.check && run.check.removed ? 'снято' : price(run.check && run.check.priceRub));
          tile(cards, 'до проверки', price(run.check && run.check.prevRub));
        } else {
          tile(cards, 'найдено', count(run.found));
          tile(cards, 'новых', count(run.fresh), run.fresh > 0 ? 'good' : '');
          tile(cards, 'подешевели', count(run.cheaper), run.cheaper > 0 ? 'good' : '');
          tile(cards, 'находок', fmt(run.finds), run.finds > 0 ? 'good' : '');
        }
        view.append(cards);
        // Подробности (списки и попытки) у старых обходов не поместились в ссылку — не ошибка
        const detailed = run.freshIds !== 0;
        if (!detailed) view.append(el('div', 'muted', 'Подробности не вошли в ссылку'));
        const load = loadPanel(p, run);
        if (load) view.append(load);
        if (detailed) appendListings(view, p, run);
        view.append(runActions(p, run), el('div', 'muted tiny', runTech(run)));
      }

      /** Заголовок: модель (фото 48 px) и порог на момент обхода, запрос, «Разовый», заголовок объявления. */
      function runHead(p, run) {
        const head = el('div', 'run-head');
        const info = el('div', 'info');
        if (run.kind === 1) {
          const target = lightTarget(p, run.about);
          head.append(thumb({ name: target.name, img: target.img }, 'thumb big'));
          info.append(el('h2', '', target.name));
          if (run.thresholdRub) info.append(el('div', 'muted', 'порог ' + rub(run.thresholdRub)));
        } else {
          info.append(el('h2', '', runTitle(p, run)));
        }
        head.append(info);
        return head;
      }

      function runTitle(p, run) {
        if (run.kind === 0) return '«' + (run.about || '?') + '»';
        if (run.kind === 3) return has(run.flags, 4) ? 'Разовый без записи' : 'Разовый';
        const listing = p.listings.get(run.about);
        return listing ? listing.title : 'Объявление';
      }

      /** Под заголовком: вид, когда, сколько шёл, ожидание в очереди, страница догонялки, первый обход, браузер. */
      function runLine(run) {
        const parts = [RUN_KIND[run.kind] || '?', whenText(run.minute)];
        if (isNum(run.seconds)) parts.push('шёл ' + duration(run.seconds));
        if (isNum(run.wait)) parts.push('очередь ' + duration(run.wait));
        if (run.page > 1) parts.push('стр. ' + run.page);
        if (has(run.flags, 1)) parts.push('первый обход');
        if (run.browser) parts.push(run.browser + (run.media ? ' с картинками' : ''));
        return parts.join(' · ');
      }

      /** Передача и выход (с 06.10.2026): «передан от обхода 123», «передан другому браузеру», сеть и тип IP. */
      function handOverLine(run) {
        const parts = [];
        if (run.handOverOf) parts.push('передан от обхода ' + run.handOverOf);
        if (run.handedOver) parts.push('передан другому браузеру');
        if (run.asn) parts.push('сеть ' + run.asn);
        if (run.ipType) parts.push('IP ' + IP_TYPE_TEXT[run.ipType]);
        return parts.length > 0 ? el('div', 'muted', parts.join(' · ')) : null;
      }

      /** Первая буква — заглавная (итог крупной строкой). */
      const capital = (text) => (text ? text[0].toUpperCase() + text.slice(1) : text);

      /** «14:31», не сегодня — «вчера 14:31». */
      function whenText(minute) {
        const day = dayHint(minute);
        return (day ? day + ' ' : '') + clock(minute);
      }

      /** Итог крупной строкой — по словарю ошибок. */
      function runOutcome(p, run) {
        if (run.outcome === 4) {
          if (runStuck(run.minute)) return el('div', 'outcome grey', RUN_ERROR_TEXT[12]);
          return el('div', 'outcome', 'Идёт');
        }
        // Снято — свой итог проверки страницы (М1), а не «0 объявлений»
        if (run.check && run.check.removed) return el('div', 'outcome grey', 'Снято');
        if (run.outcome === 1) return el('div', 'outcome grey', RUN_ERROR_TEXT[11]);
        if (run.outcome === 0) {
          const text = run.kind === 2 || run.kind === 4 ? capital(pageCheckText(run.check)) : 'Выдача получена';
          return el('div', 'outcome ok', text);
        }
        const kind = run.outcome === 2 ? 'warn' : 'bad';
        return el('div', 'outcome ' + kind, capital(runError(p, run)) + attemptsNote(run));
      }

      /** Находка после обхода — плашка (с пульсом, пока подходит); нажатие — страница объявления. */
      function findBanner(run) {
        if (!(run.finds > 0)) return null;
        const first = Array.isArray(run.findIds) ? run.findIds[0] : undefined;
        const listing = first === undefined ? null : profileItem(first);
        const banner = el('button', 'find-banner');
        banner.type = 'button';
        if (has(run.flags, 2)) banner.append(pulse());
        const count = countText(run.finds, 'находка', 'находки', 'находок') + ' после обхода';
        banner.append(el('span', '', listing ? count + ': ' + listing.title : count));
        if (listing) banner.addEventListener('click', () => openScreen({ type: 'listing', id: listing.id }));
        else banner.disabled = true;
        return banner;
      }

      const TIMELINE_LEGEND = [
        ['ok', 'загрузка'],
        ['wait', 'ждал повтора'],
        ['settle', 'пауза и разбор'],
      ];

      /** «Загрузка»: полоска времени задачи и по строке на попытку — сервер, IP, итог, секунды, HTTP. */
      function loadPanel(p, run) {
        if (run.attemptList === 0) return null;
        const panel = el('div', 'panel');
        panel.append(el('div', 'group-title', 'Загрузка'));
        const attempts = run.attemptList.map(attemptFromRow);
        if (attempts.length === 0) {
          panel.append(el('div', 'muted', 'Нет данных'));
          return panel;
        }
        const bar = timeline(run, attempts);
        if (bar) panel.append(bar);
        attempts.forEach((attempt, index) => panel.append(attemptRow(p, run, attempt, index)));
        return panel;
      }

      /** Попытка: [выход — строка x, начало от начала задачи с, секунд, код ошибки, HTTP, записано 0|1]. */
      function attemptFromRow([exit, start, seconds, code, http, recorded]) {
        return { exit, start, seconds, code: code || 0, http: http || 0, recorded: recorded === 1 };
      }

      /** Цвет попытки: загрузилась, блок или «подождите», сбой; итог не записан и «ничего не нашёл» — серый. */
      function attemptTone(attempt) {
        if (!attempt.recorded || attempt.code === 11) return 'none';
        if (attempt.code === 0) return 'ok';
        return attempt.code === 8 || attempt.code === 9 ? 'warn' : 'bad';
      }

      /** Полоска времени задачи: загрузки (цвет — итог), ожидание повтора 15/30 с, пауза после загрузки и разбор. */
      function timeline(run, attempts) {
        if (!attempts.every((attempt) => isNum(attempt.start) && isNum(attempt.seconds))) return null;
        const last = attempts[attempts.length - 1];
        const total = Math.max(Number(run.seconds) || 0, last.start + last.seconds);
        if (!(total > 0)) return null;
        const bar = el('div', 'timeline');
        bar.setAttribute('aria-hidden', 'true');
        const part = (tone, seconds) => {
          const span = el('span', 'seg-' + tone);
          span.style.width = (Math.max(0, seconds) * 100) / total + '%';
          bar.append(span);
        };
        let cursor = 0;
        for (const attempt of attempts) {
          if (attempt.start > cursor) part('wait', attempt.start - cursor);
          part(attemptTone(attempt), attempt.seconds);
          cursor = Math.max(cursor, attempt.start + attempt.seconds);
        }
        if (total > cursor) part('settle', total - cursor);
        const legend = el('div', 'legend');
        for (const [tone, text] of TIMELINE_LEGEND) {
          const item = el('span');
          item.append(el('i', 'seg-' + tone), text);
          legend.append(item);
        }
        legend.append(el('span', '', 'всего ' + duration(total)));
        const box = el('div');
        box.append(bar, legend);
        return box;
      }

      /** Попытка: сервер и IP, итог по словарю (агент до журнала — «ошибка не записана»), секунды, HTTP. */
      function attemptRow(p, run, attempt, index) {
        const row = el('div', 'att');
        const exit = p.exits[attempt.exit];
        const where = el('div');
        where.append(el('b', '', index + 1 + '. ' + (exit ? exit.label : 'выход неизвестен')));
        if (exit && exit.ip) where.append(el('span', 'muted', ' · ' + exit.ip));
        const parts = [attemptText(p, run, attempt, exit)];
        if (isNum(attempt.seconds)) parts.push(duration(attempt.seconds));
        if (attempt.http) parts.push('HTTP ' + attempt.http);
        const body = el('div', 'info');
        body.append(where, el('div', 'sub', parts.join(' · ')));
        row.append(el('i', 'seg-' + attemptTone(attempt)), body);
        return row;
      }

      function attemptText(p, run, attempt, exit) {
        if (!attempt.recorded) return 'ошибка не записана';
        if (attempt.code === 0) return 'загрузилась';
        // «Avito ничего не нашёл» — не ошибка загрузки (серым): страница пришла
        if (attempt.code === 11) return 'загрузилась, объявлений нет';
        return errorPhrase(p, attempt.code, exit ? exit.label : null, null, run);
      }

      /** «Новые (N)», «Подешевели (N)», «Знакомых: N». */
      function appendListings(view, p, run) {
        const fresh = run.freshIds.map((id) => p.listings.get(id)).filter(Boolean);
        if (run.freshIds.length > 0) view.append(el('div', 'section-title', 'Новые (' + run.freshIds.length + ')'));
        for (const listing of fresh) view.append(listingRow(run, listing, null));
        const cheaper = Array.isArray(run.cheaperList) ? run.cheaperList : [];
        if (cheaper.length > 0) view.append(el('div', 'section-title', 'Подешевели (' + cheaper.length + ')'));
        for (const [id, before] of cheaper) {
          const listing = p.listings.get(id);
          if (listing) view.append(listingRow(run, listing, before));
        }
        if (isNum(run.known) && run.known > 0) view.append(el('div', 'muted', 'Знакомых: ' + fmt(run.known)));
        if (beforeJournal(run)) view.append(el('div', 'muted', 'Объявления: до журнала'));
      }

      /**
       * Объявление обхода: фото 56 px, заголовок в две строки, цена (зелёная — не дороже порога), «шанс» и разметка,
       * итог отбора одной фразой (находка — красным). Нажатие — страница объявления.
       */
      function listingRow(run, listing, before) {
        const row = el('button', 'lrow');
        row.type = 'button';
        const threshold = run.kind === 1 && listing.targetId === run.about ? run.thresholdRub : 0;
        // Цвет — по «шансу» у модели объявления (К5); подходит сейчас — пульс, без цвета уровня
        const level = listingLevel(listing, threshold || thresholdOf(listing.targetId));
        if (!listing.live && levelClass(level)) row.classList.add(level);
        const image = { name: listing.title || '?', img: listing.img };
        row.append(listing.live ? liveThumb(image) : thumb(image, 'thumb'));
        const info = el('span', 'info');
        info.append(el('span', 'title', listing.title));
        const price = before === null ? priceText(listing) : cheaperText(before, listing.priceRub);
        // Зелёная цена — только у горячего (К5); без уровня — по порогу, как раньше
        info.append(el('span', 'cost' + (listing.within && !level ? ' okc' : ''), price));
        const tags = dealTags(listing.deal, level, isFresh(listing));
        if (tags) info.append(tags);
        const chips = verdictChips(listing);
        if (chips) info.append(chips);
        // Стало находкой после этого обхода — как отправленная находка (красным)
        const found = Array.isArray(run.findIds) && run.findIds.includes(listing.id);
        const tone = found ? 'sent' : outcomeClass(listing.outcome);
        info.append(el('span', 'verdict ' + tone, selectionText(listing, threshold)));
        row.append(info);
        row.addEventListener('click', () => openScreen({ type: 'listing', id: listing.id }));
        return row;
      }

      /** Цена объявления; у лота — и сколько кукол. */
      function priceText(listing) {
        if (listing.priceRub === null) return 'без цены';
        const quantity = lotSize(listing);
        return quantity > 1 ? rub(listing.priceRub) + ' · ' + quantity + ' шт.' : rub(listing.priceRub);
      }

      /** Кукол в объявлении: лот по разбору или по признакам сервера (DealRow); неизвестно — 1. */
      function lotSize(listing) {
        const verdict = listing.verdict && listing.verdict.type === 1 ? listing.verdict.quantity : 1;
        const deal = listing.deal && listing.deal.quantity > 1 ? listing.deal.quantity : 1;
        return Math.max(1, verdict, deal);
      }

      /** Цена за штуку (лот — цена / кукол); без цены — null. */
      function unitPrice(listing) {
        if (listing.priceRub === null || listing.priceRub === undefined) return null;
        return Math.round(listing.priceRub / lotSize(listing));
      }

      /** Подешевело: «9 900 → 8 500 ₽ (−14 %)». */
      function cheaperText(before, now) {
        if (now === null) return 'без цены';
        if (!isNum(before)) return rub(now);
        const pct = ChartMath.changePercent(before, now);
        return fmt(before) + ' → ' + rub(now) + (pct === null ? '' : ' (' + signed(pct) + ' %)');
      }

      /** Разметка классификатора чипами: «кукла · Catty Noir · 92 %», «лот 3 шт · 2 700 ₽/шт», «одежда», «куплю». */
      function verdictChips(listing) {
        const chips = [];
        const verdict = listing.verdict;
        if (verdict) {
          if (verdict.type === 0) chips.push(dollChip(listing, verdict));
          else if (verdict.type === 1) chips.push(lotChip(listing, verdict));
          else chips.push(ITEM_TYPE_TEXT[verdict.type] || 'другое');
          if (verdict.offer > 0) chips.push(OFFER_TEXT[verdict.offer] || 'не продажа');
          if (verdict.fake) chips.push('подделка?');
        }
        if (listing.byModel) chips.push('поиск по модели');
        if (listing.baseline) chips.push('первый обход');
        if (listing.watched) chips.push('слежу');
        if (listing.removed) chips.push('снято');
        if (chips.length === 0) return null;
        const box = el('span', 'vchips');
        for (const text of chips) box.append(el('span', 'vchip', text));
        return box;
      }

      function dollChip(listing, verdict) {
        const parts = ['кукла'];
        if (listing.targetId) parts.push(targetName(listing.targetId));
        if (verdict.confidence > 0) parts.push(verdict.confidence + ' %');
        return parts.join(' · ');
      }

      function lotChip(listing, verdict) {
        const unit = unitPrice(listing);
        return 'лот ' + verdict.quantity + ' шт' + (unit === null ? '' : ' · ' + rub(unit) + '/шт');
      }

      /** Итог отбора (stats/run-detail.ts Selection, коды 0–8). */
      const SELECTION_TEXT = [
        'находка отправлена',
        'дороже порога',
        'не кукла',
        'модель на паузе',
        'без цены',
        'ни одной модели',
        'ещё разбирается',
        'находка отклонена',
        'подходит, без сообщения',
      ];

      /** Итог отбора одной фразой: «находка, в чате с 14:33», «дороже порога: 9 900 > 8 000», «не кукла: одежда». */
      function selectionText(listing, thresholdRub) {
        const code = listing.outcome;
        if (code === 0 && listing.sentAt) return 'находка, в чате с ' + whenText(listing.sentAt);
        if (code === 1) return pricierText(listing, thresholdRub);
        if (code === 2) return notDollText(listing.verdict);
        if (code === 4 && listing.priceRub !== null) return 'символическая цена';
        return SELECTION_TEXT[code] || 'итог неизвестен';
      }

      function pricierText(listing, thresholdRub) {
        const target = listing.targetId ? findTarget(listing.targetId) || profileTarget(listing.targetId) : null;
        const threshold = thresholdRub || (target ? target.priceRub : 0);
        const unit = unitPrice(listing);
        if (unit === null || !threshold) return 'дороже порога';
        return 'дороже порога: ' + fmt(unit) + ' > ' + fmt(threshold);
      }

      function notDollText(verdict) {
        if (!verdict) return 'не кукла';
        if (verdict.fake) return 'похоже на подделку';
        if (verdict.offer > 1) return 'не продажа: ' + (OFFER_TEXT[verdict.offer] || '?');
        return 'не кукла: ' + (ITEM_TYPE_TEXT[verdict.type] || 'другое');
      }

      function outcomeClass(code) {
        if (code === 0) return 'sent';
        return code === 8 ? 'okc' : '';
      }

      /** «Открыть на Avito» (адрес поиска или объявления из БД) и «Цена модели» у обходов модели. */
      function runActions(p, run) {
        const actions = el('div', 'actions');
        const url = isNum(run.url) ? p.urls[run.url] : null;
        if (url) {
          const open = el('button', '', 'Открыть на Avito');
          open.type = 'button';
          open.addEventListener('click', () => openLink(url));
          actions.append(open);
        }
        if (run.kind === 1 && profileModel(run.about)) {
          const chart = el('button', 'ghost', 'Цена модели');
          chart.type = 'button';
          chart.addEventListener('click', () => openScreen({ type: 'price', targetId: run.about }));
          actions.append(chart);
        }
        return actions;
      }

      /** Мелко внизу: HTTP, размер HTML, начало и конец. */
      function runTech(run) {
        const parts = [];
        if (run.http) parts.push('HTTP ' + run.http);
