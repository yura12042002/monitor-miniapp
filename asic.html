<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Асики</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /*
       * Mini App бота асиков (решение владельца 12.10.2026: «аналогичное ТГ приложение, как с куклами»): стиль — как у
       * приложения кукол (просьба владельца 05.10.2026: без смайликов, чёткий стиль без воды): цвета Telegram, один
       * акцент и смысловые зелёный, жёлтый и красный; статусы — словом и цветной точкой; подписи в 1–3 слова.
       */
      :root {
        --bg: var(--tg-theme-bg-color, #ffffff);
        --text: var(--tg-theme-text-color, #111111);
        --hint: var(--tg-theme-hint-color, #8a8a8e);
        --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
        --accent: var(--tg-theme-button-color, #2481cc);
        --accent-text: var(--tg-theme-button-text-color, #ffffff);
        --link: var(--tg-theme-link-color, #2481cc);
        --red: var(--tg-theme-destructive-text-color, #e53935);
        --green: #1f9a5e;
        --yellow: #e0a100;
        --grey: #8e8e93;
        --line: rgba(142, 142, 147, 0.22);
        --fs-s: 13px;
        --fs-m: 15px;
        --fs-l: 20px;
        --r: 12px;
        --r-s: 8px;
      }
      body.dark {
        --green: #4cc38a;
        --yellow: #f0b429;
        --line: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 16px 96px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: var(--fs-m);
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        font-size: var(--fs-l);
        margin: 4px 0 2px;
      }
      h2 {
        font-size: var(--fs-m);
        margin: 18px 0 6px;
        color: var(--hint);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .muted {
        color: var(--hint);
        font-size: var(--fs-s);
      }
      [hidden] {
        display: none !important;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: var(--r-s);
        padding: 8px 12px;
        background: var(--card);
        color: var(--text);
        cursor: pointer;
      }
      button.small {
        padding: 6px 10px;
        font-size: var(--fs-s);
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin: 12px 0 8px;
        background: var(--card);
        border-radius: var(--r);
        padding: 4px;
      }
      .tab {
        flex: 1;
        padding: 8px 4px;
        background: transparent;
        font-size: var(--fs-s);
        font-weight: 600;
      }
      .tab.active {
        background: var(--bg);
        color: var(--accent);
      }
      .list {
        background: var(--card);
        border-radius: var(--r);
        overflow: hidden;
      }
      .row {
        padding: 10px 12px;
        border-top: 1px solid var(--line);
      }
      .row:first-child {
        border-top: 0;
      }
      .line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .name {
        overflow-wrap: anywhere;
      }
      .price {
        font-weight: 600;
        white-space: nowrap;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        background: var(--grey);
        vertical-align: middle;
      }
      .dot.green {
        background: var(--green);
      }
      .dot.yellow {
        background: var(--yellow);
      }
      .dot.red {
        background: var(--red);
      }
      .dot.accent {
        background: var(--accent);
      }
      .edit {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .edit input {
        font: inherit;
        width: 120px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-s);
        padding: 6px 8px;
        outline: none;
        -moz-appearance: textfield;
        appearance: textfield;
      }
      .edit input:focus {
        border-color: var(--accent);
      }
      .edit input::-webkit-outer-spin-button,
      .edit input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .toggle.on {
        color: var(--green);
      }
      .toggle.off {
        color: var(--yellow);
      }
      .changed {
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .empty {
        padding: 14px 12px;
        color: var(--hint);
      }
      .error {
        margin-top: 24px;
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div>
        <h1>Асики</h1>
        <div class="muted" id="at"></div>
      </div>
      <button class="small" id="refresh" type="button">Обновить</button>
    </div>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab active" type="button" data-tab="targets">Цели</button>
      <button class="tab" type="button" data-tab="finds">Находки</button>
      <button class="tab" type="button" data-tab="eaeu">ЕАЭС</button>
      <button class="tab" type="button" data-tab="runs">Обходы</button>
    </div>
    <main id="main"></main>
    <div class="error" id="error" hidden></div>
    <script>
      const tg = window.Telegram && window.Telegram.WebApp;
      const state = { data: null, tab: 'targets', dirty: new Map(), readOnly: false };
      const $ = (id) => document.getElementById(id);
      const TZ = 'Europe/Moscow';
      const DAY = new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, day: '2-digit', month: '2-digit' });
      const TIME = new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
      const STATUS = {
        ok: ['в порядке', 'green'],
        empty: ['пусто', 'grey'],
        blocked: ['блок', 'red'],
        parse_error: ['не разобрано', 'yellow'],
        failed: ['сбой', 'red'],
        timeout: ['нет ответа', 'red'],
        unsupported: ['нет доступа', 'grey'],
        running: ['идёт', 'accent'],
        'в порядке': ['в порядке', 'green'],
        пауза: ['пауза', 'yellow'],
        сбой: ['сбой', 'red'],
      };
      const SIGN = { RUB: '₽', KZT: '₸', BYN: 'BYN', KGS: 'сом', AMD: '֏', USD: '$', USDT: 'USDT' };
      const COUNTRY = { RU: 'Россия', KZ: 'Казахстан', BY: 'Беларусь', KG: 'Кыргызстан', AM: 'Армения' };

      function esc(text) {
        return String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      }
      function safeUrl(url) {
        try {
          const parsed = new URL(String(url));
          return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : null;
        } catch {
          return null;
        }
      }
      function rub(value) {
        return Math.round(Number(value) || 0).toLocaleString('ru-RU') + ' ₽';
      }
      function money(amount, currency) {
        return Number(amount || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ' + (SIGN[currency] || currency);
      }
      /** Минута Unix → «12.10 14:05»; сегодня — только время. */
      function when(minute) {
        if (!Number(minute)) return '—';
        const date = new Date(Number(minute) * 60000);
        const today = DAY.format(new Date()) === DAY.format(date);
        return today ? TIME.format(date) : DAY.format(date) + ' ' + TIME.format(date);
      }
      function status(code) {
        const [word, color] = STATUS[code] || [String(code), 'grey'];
        return '<span class="dot ' + color + '"></span>' + esc(word);
      }
      function link(url, text) {
        const href = safeUrl(url);
        if (!href) return esc(text);
        return '<a href="' + esc(href) + '" data-link="' + esc(href) + '">' + esc(text) + '</a>';
      }

      /** Данные из ссылки кнопки: #z=<deflate-raw base64url>. */
      async function readData() {
        const packed = /[#&]z=([A-Za-z0-9_-]+)/.exec(location.hash);
        if (!packed) throw new Error('Нет данных: откройте приложение кнопкой «Приложение» внизу чата с ботом.');
        if (typeof DecompressionStream === 'undefined') throw new Error('Обновите Telegram: нужен новее WebView.');
        const base64 = packed[1].replace(/-/g, '+').replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(base64 + '='.repeat((4 - (base64.length % 4)) % 4)), (c) => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        const data = JSON.parse(await new Response(stream).text());
        if (data.v !== 1) throw new Error('Данные другой версии: обновите кнопку командой /app.');
        return data;
      }

      function targetView(row) {
        const [id, name, kind, maxRub, active, model, finds] = row;
        return { id, name, kind, maxRub, active: active === 1, model, finds };
      }

      function renderTargets() {
        const targets = state.data.t.map(targetView);
        if (targets.length === 0) return '<div class="list"><div class="empty">Целей нет</div></div>';
        const groups = new Map();
        for (const target of targets) {
          if (!groups.has(target.model)) groups.set(target.model, []);
          groups.get(target.model).push(target);
        }
        let html = '';
        for (const [model, list] of groups) {
          html += '<h2>' + esc(model) + '</h2><div class="list">';
          for (const target of list) {
            const edit = state.dirty.get(target.id) || {};
            const price = edit.price ?? target.maxRub;
            const active = edit.active ?? target.active;
            const changed = price !== target.maxRub || active !== target.active ? ' changed' : '';
            html +=
              '<div class="row' + changed + '"><div class="line"><span class="name">' + esc(target.name) + '</span>' +
              '<span class="muted">' + esc(target.kind) + (target.finds ? ' · находок ' + esc(target.finds) : '') + '</span></div>' +
              '<div class="edit"><span class="muted">до</span><input type="number" inputmode="numeric" min="100" step="100" ' +
              'data-price="' + esc(target.id) + '" value="' + esc(price) + '"' + (state.readOnly ? ' disabled' : '') + ' />' +
              '<span class="muted">₽</span><button class="small toggle ' + (active ? 'on' : 'off') + '" type="button" ' +
              'data-toggle="' + esc(target.id) + '"' + (state.readOnly ? ' disabled' : '') + '>' + (active ? 'ищу' : 'пауза') +
              '</button></div></div>';
          }
          html += '</div>';
        }
        return html;
      }

      function renderFinds() {
        const names = new Map(state.data.t.map((row) => [row[0], row[1]]));
        if (state.data.f.length === 0) return '<div class="list"><div class="empty">Находок пока нет</div></div>';
        let html = '<div class="list">';
        for (const [minute, targetId, priceRub, title, url] of state.data.f) {
          html +=
            '<div class="row"><div class="line"><span class="name">' + link(url, title) + '</span><span class="price">' +
            rub(priceRub) + '</span></div><div class="muted">' + when(minute) + ' · ' + esc(names.get(targetId) || 'цель удалена') +
            '</div></div>';
        }
        return html + '</div>';
      }

      function renderEaeu() {
        let html = '<h2>Находки S21 200T</h2><div class="list">';
        if (state.data.o.length === 0) html += '<div class="empty">Пока нет</div>';
        for (const [minute, source, country, priceRub, amount, currency, title, url, working] of state.data.o) {
          const original = currency !== 'RUB' ? ' · ' + esc(money(amount, currency)) : '';
          html +=
            '<div class="row"><div class="line"><span class="name">' + link(url, title) + '</span><span class="price">' +
            rub(priceRub) + '</span></div><div class="muted">' + when(minute) + ' · ' + esc(source) + ' · ' +
            esc(COUNTRY[country] || country) + original + ' · ' + (working ? 'рабочий' : 'работа не подтверждена') + '</div></div>';
        }
        html += '</div><h2>Площадки</h2><div class="list">';
        for (const [title, country, code, minute, found, matched, error] of state.data.s) {
          html +=
            '<div class="row"><div class="line"><span class="name">' + esc(title) + ' <span class="muted">' +
            esc(COUNTRY[country] || country) + '</span></span><span>' + status(code) + '</span></div><div class="muted">' +
            'проверено ' + when(minute) + ' · объявлений ' + esc(found) + ' · подошло ' + esc(matched) +
            (error ? ' · ' + esc(error) : '') + '</div></div>';
        }
        return html + '</div>';
      }

      function renderRuns() {
        let html = '<h2>Avito, 6 часов</h2><div class="list">';
        if (state.data.r.length === 0) html += '<div class="empty">Обходов нет</div>';
        for (const [minute, query, code, found, fresh, browser, exit] of state.data.r) {
          const via = [browser, exit].filter(Boolean).map(esc).join(' · ');
          html +=
            '<div class="row"><div class="line"><span class="name">' + esc(query) + '</span><span>' + status(code) +
            '</span></div><div class="muted">' + when(minute) + ' · найдено ' + esc(found) + ' · новых ' + esc(fresh) +
            (via ? ' · ' + via : '') + '</div></div>';
        }
        html += '</div><h2>Источники цен</h2><div class="list">';
        if (state.data.p.length === 0) html += '<div class="empty">Нет данных</div>';
        for (const [site, code, minute] of state.data.p) {
          html +=
            '<div class="row"><div class="line"><span class="name">' + esc(site) + '</span><span>' + status(code) +
            '</span></div><div class="muted">удача ' + when(minute) + '</div></div>';
        }
        return html + '</div>';
      }

      function render() {
        const views = { targets: renderTargets, finds: renderFinds, eaeu: renderEaeu, runs: renderRuns };
        $('main').innerHTML = views[state.tab]();
        for (const tab of document.querySelectorAll('.tab')) tab.classList.toggle('active', tab.dataset.tab === state.tab);
        updateMainButton();
      }

      function edits() {
        const targets = new Map(state.data.t.map((row) => [row[0], targetView(row)]));
        const list = [];
        for (const [id, edit] of state.dirty) {
          const target = targets.get(id);
          if (!target) continue;
          const price = edit.price !== undefined && edit.price !== target.maxRub ? edit.price : null;
          const active = edit.active !== undefined && edit.active !== target.active ? (edit.active ? 1 : 0) : null;
          if (price !== null || active !== null) list.push([id, price, active]);
        }
        return list;
      }

      function updateMainButton() {
        if (!tg) return;
        const count = edits().length;
        if (count === 0 || state.readOnly) return tg.MainButton.hide();
        tg.MainButton.setText('Сохранить (' + count + ')');
        tg.MainButton.show();
      }

      function send(payload) {
        if (!tg) return;
        if (state.readOnly) {
          tg.showAlert('Править — через кнопку «Приложение» внизу чата.');
          return;
        }
        tg.sendData(JSON.stringify(payload));
      }

      /** Открыто inline-кнопкой или из меню: sendData не работает — только просмотр. */
      function openedInline() {
        const unsafe = (tg && tg.initDataUnsafe) || {};
        return Boolean(unsafe.query_id) || /(^|&)query_id=/.test((tg && tg.initData) || '');
      }

      document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element)) return;
        const linkNode = event.target.closest('[data-link]');
        if (linkNode) {
          event.preventDefault();
          if (tg) tg.openLink(linkNode.dataset.link);
          else window.open(linkNode.dataset.link, '_blank');
          return;
        }
        const tab = event.target.closest('[data-tab]');
        if (tab) {
          state.tab = tab.dataset.tab;
          render();
          return;
        }
        const toggle = event.target.closest('[data-toggle]');
        if (toggle && state.data) {
          const id = Number(toggle.dataset.toggle);
          const target = targetView(state.data.t.find((row) => row[0] === id));
          const edit = state.dirty.get(id) || {};
          edit.active = !(edit.active ?? target.active);
          state.dirty.set(id, edit);
          render();
        }
      });
      document.addEventListener('change', (event) => {
        if (!(event.target instanceof Element)) return;
        const input = event.target.closest('[data-price]');
        if (!input) return;
        const id = Number(input.dataset.price);
        const value = Math.round(Number(input.value));
        if (!(value > 0)) return;
        const edit = state.dirty.get(id) || {};
        edit.price = value;
        state.dirty.set(id, edit);
        render();
      });
      // «Обновить» сохраняет и несохранённые правки: бот применит их и пришлёт свежую кнопку
      $('refresh').addEventListener('click', () => {
        commitFocused();
        send({ v: 1, c: edits(), r: 1 });
      });
      /** Цена в поле, из которого ещё не ушёл фокус, — в правки (change срабатывает на blur). */
      function commitFocused() {
        const focused = document.activeElement;
        if (focused && focused.matches && focused.matches('[data-price]')) focused.blur();
      }

      async function start() {
        if (tg) {
          tg.ready();
          tg.expand();
          document.body.classList.toggle('dark', tg.colorScheme === 'dark');
          tg.MainButton.onClick(() => {
            commitFocused();
            send({ v: 1, c: edits() });
          });
          tg.onEvent('themeChanged', () => document.body.classList.toggle('dark', tg.colorScheme === 'dark'));
          state.readOnly = openedInline();
        }
        try {
          state.data = await readData();
          $('at').textContent = 'данные на ' + when(Math.floor(state.data.at / 60));
          render();
        } catch (error) {
          $('error').hidden = false;
          $('error').textContent = error.message || String(error);
        }
      }
      start();
    </script>
  </body>
</html>
